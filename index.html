      pos.score*1.2-shadow*0.7-reversal;
    options.push({x,y,rating,d,pressure:chance.pressure,exits:pos.exits});
  }
  if(!options.length)return null;
  options.sort((a,b)=>b.rating-a.rating);
  const best=options[0];
  const savedGoal=enemyEscapeGoal;
  const survived=findTimedSafeStep(best.x,best.y,null,null,1);
  enemyEscapeGoal=savedGoal;
  if(!survived)return null;
  return best;
}

// v56: Convert the late-game blast-denial score into an actual positioning
// decision. The current tactical planner remains preferred unless a safe
// adjacent tile gives materially better coverage of the opponent's likely
// escape region. This NEVER permits placing an otherwise rejected bomb.
function findV56ContainmentStep(desired,attackStep){
  if(replayClock<V55_STALEMATE_MS || bombs.length!==0 || !player.alive)return null;
  const here={x:enemy.x,y:enemy.y};
  const distance=Math.abs(here.x-player.x)+Math.abs(here.y-player.y);
  if(distance<3 || distance>10)return null;
  const hereRisk=getEnemyPositionRisk(here.x,here.y);
  const value=(p)=>{
    const risk=getEnemyPositionRisk(p.x,p.y);
    if(risk.exits<2 || risk.score>hereRisk.score+3)return -Infinity;
    const denial=getV56EscapeDenial({x:p.x,y:p.y,range:8}).score;
    const d=Math.abs(p.x-player.x)+Math.abs(p.y-player.y);
    const repeat=enemyLastPosition&&p.x===enemyLastPosition.x&&p.y===enemyLastPosition.y;
    const offense=getEnemyOffenseOpportunity({x:p.x,y:p.y,range:8});
    return denial*2.5+offense.score*0.28-risk.score*1.25-
      Math.max(0,d-4)*1.0-(repeat?7:0);
  };
  const base=desired||here;
  let best=null;
  for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){
    const p={x:here.x+dx,y:here.y+dy};
    if(!enemyCanMove(p.x,p.y,null,1))continue;
    const risk=getEnemyPositionRisk(p.x,p.y);
    if(risk.exits<2 || risk.edgeDistance===0 && hereRisk.edgeDistance>0)continue;
    const score=value(p);
    if(!best||score>best.score)best={...p,score};
  }
  if(!best || !Number.isFinite(best.score))return null;
  const improvement=best.score-value(base);
  // A strategic attack target has already passed exact bomb safety screening.
  // Require a much clearer benefit to change that path than an approach move.
  const threshold=attackStep?10:5;
  if(improvement<threshold || (best.x===base.x&&best.y===base.y))return null;
  return {x:best.x,y:best.y,deniedScore:getV56EscapeDenial({x:best.x,y:best.y,range:8}).score,improvement:Math.round(improvement*10)/10};
}


// v58: The human replays show rapid bomb carpets (2-6 player bombs laid
// within ~1s) trapping the AI against an outer lane. Detect the *onset* of
// this pattern. This is a soft tactical search; real explosions and the
// full-horizon survival planner remain authoritative.
let v58BreakoutCount=0;
function findV58EncirclementBreakout() {
  if(!player.alive || !enemy.alive)return null;
  const hostile=bombs.filter(b=>b.owner==='player');
  if(hostile.length<2 || hostile.length>9)return null;
  const d0=Math.abs(enemy.x-player.x)+Math.abs(enemy.y-player.y);
  if(d0>10)return null;
  const mostRecent=Math.max(...hostile.map(b=>b.timer));
  const rapid=hostile.some(b=>b!==hostile[0] && Math.abs(b.timer-hostile[0].timer)<=650) ||
    (hostile.length>=3 && mostRecent>=850);
  if(!rapid)return null;
  const predicted=getTimedBombEvents();
  // This guard is critical: do not compete with the emergency survival logic.
  if(isTileDangerDuring(enemy.x,enemy.y,0,ENEMY_STEP_MS+40,predicted))return null;
  // Use the first eight genuine 120ms movement intervals, not the 200ms
  // conservative deep-search quantum, when estimating a breakout's reach.
  const directions=[[0,-1],[0,1],[-1,0],[1,0],[0,0]];
  const initial={x:enemy.x,y:enemy.y,depth:0,first:null};
  const q=[initial], seen=new Set([`${enemy.x},${enemy.y},0`]);
  const reach=getPlayerReachableCells(3);
  // Future bombs are speculative. Approximate exposure, but never treat one
  // hypothetical placement as a real explosion or a hard barrier.
  const future=reach.filter(p=>p.depth<=3).map(p=>({
    depth:p.depth, cells:new Set(getBlastCells({x:p.x,y:p.y,range:8})
      .map(c=>`${c[0]},${c[1]}`))}));
  const blastCounts=new Map();
  const cap=8;
  function futureExposure(x,y){
    const key=`${x},${y}`;
    if(blastCounts.has(key))return blastCounts.get(key);
    let risk=0;
    for(const p of future)if(p.cells.has(key))risk+=
      (p.depth===0?2.0:p.depth===1?1.35:p.depth===2?0.70:0.25);
    blastCounts.set(key,risk);
    return risk;
  }
  const refugeCache=new Map();
  function refugeScore(x,y){
    const key=`${x},${y}`;
    if(refugeCache.has(key))return refugeCache.get(key);
    const r=getEnemyPositionRisk(x,y);
    let safety=0;
    // Penalize the *whole nearby refuge*, not just the current tile.
    // Known bomb explosions have priority over projected human placements.
    for(const [dx,dy] of [[0,0],[1,0],[-1,0],[0,1],[0,-1],[2,0],[-2,0],[0,2],[0,-2]]) {
      const cx=x+dx,cy=y+dy;
      if(cx<1||cy<1||cx>=COLS-1||cy>=ROWS-1||map[cy][cx]!==0)continue;
      if(!isTileDangerDuring(cx,cy,0,2400,predicted))safety++;
    }
    const distance=Math.abs(x-player.x)+Math.abs(y-player.y);
    const nearBomb=hostile.reduce((a,b)=>Math.min(a,Math.abs(x-b.x)+Math.abs(y-b.y)),99);
    // A corner's 1-2 immediate exits are rapidly covered by a third bomb.
    const score=r.score*1.75 + getEnemyCorridorRisk(x,y)*0.8+
      futureExposure(x,y)*1.25 + Math.max(0,4-safety)*10+
      (r.edgeDistance===0?19:r.edgeDistance===1?5:0)+
      Math.max(0,6-distance)*3.0+Math.max(0,3-nearBomb)*2.4;
    refugeCache.set(key,score);
    return score;
  }
  let best=null;
  for(let head=0;head<q.length;head++) {
    const item=q[head];
    if(item.depth>=3) {
      const score=refugeScore(item.x,item.y)+item.depth*0.6;
      if(!best || score<best.score)best={...item,score};
    }
    if(item.depth>=cap)continue;
    for(const [dx,dy] of directions) {
      const nx=item.x+dx,ny=item.y+dy,step=item.depth+1;
      if(nx<1||ny<1||nx>=COLS-1||ny>=ROWS-1 || map[ny][nx]!==0)continue;
      if(player.alive&&nx===player.x&&ny===player.y)continue;
      const at=Math.max(0,(step-1)*ENEMY_STEP_MS-30);
      const until=step*ENEMY_STEP_MS+40;
      if(isTileDangerDuring(nx,ny,at,until,predicted))continue;
      if(bombs.some(b=>b.x===nx&&b.y===ny && b.timer+BOMB_FLAME_MS>at))continue;
      const k=`${nx},${ny},${step}`;
      if(seen.has(k))continue;
      seen.add(k);
      q.push({x:nx,y:ny,depth:step,first:item.first||{x:nx,y:ny}});
    }
  }
  if(!best || !best.first)return null;
  // If staying is already as good as the best refuge, keep the old tactical
  // route to preserve fast wins and avoid unnecessary oscillation.
  const hereRisk=refugeScore(enemy.x,enemy.y);
  if(hereRisk-best.score<15)return null;
  const step=best.first;
  if(step.x===enemy.x && step.y===enemy.y)return null;
  if(!enemyCanMove(step.x,step.y,predicted,1))return null;
  // Verify the chosen first move survives all *real* bombs before overriding
  // the standard attack/positioning logic.
  const savedGoal=enemyEscapeGoal;
  const verified=findTimedSafeStep(step.x,step.y,null,null,1);
  enemyEscapeGoal=savedGoal;
  if(!verified)return null;
  return {step,target:{x:best.x,y:best.y},score:Math.round(best.score*10)/10,
    improvement:Math.round((hereRisk-best.score)*10)/10,
    hostileBombs:hostile.length};
}


// v59: When the existing time-expanded solver finds multiple REAL-bomb-safe
// first steps, use the player's NEXT plausible bomb to rank those routes.
// Hypothetical placements NEVER become obstacles or override a real-bomb
// survival failure; every redirect is revalidated against actual explosions.
let v59EscapeRedirectCount=0;
let v59EscapeCheckedCount=0;
function findV59SaferEscapeStep(chosen, escapeDiagnostics) {
  const hostile=bombs.filter(b=>b.owner==='player');
  if (!chosen || hostile.length===0 || hostile.length>9 || !player.alive) return chosen;
  const distance=Math.abs(enemy.x-player.x)+Math.abs(enemy.y-player.y);
  if (distance>10) return chosen;
  // v67: The same real-bomb timeline is immutable during one AI decision.
  // Build it once, not once per candidate first step.
  const events=getTimedBombEvents();
  const viable=(escapeDiagnostics?.viableFirstSteps||[]).filter(p=>p &&
    !isTileDangerDuring(p.x,p.y,0,ENEMY_STEP_MS+45,events));
  if (viable.length<2) {
    if (hostile.length>=2) replayLog('ai_v59_escape_assessment',
      {status:'no_alternative',hostileBombs:hostile.length,
       viableSteps:viable.length,from:{x:enemy.x,y:enemy.y}});
    return chosen;
  }
  v59EscapeCheckedCount++;
  const reach=getPlayerReachableCells(3).filter(p=>p.depth<=3 &&
    !bombs.some(b=>b.x===p.x&&b.y===p.y));
  // Score the *worst plausible single follow-up* and an additional second
  // placement, avoiding a falsely reassuring average over many safe cells.
  const plausible=reach.map(p=>({depth:p.depth,
    cells:new Set(getBlastCells({x:p.x,y:p.y,range:8}).map(c=>`${c[0]},${c[1]}`))}));
  const score=p=>{
    const r=getEnemyPositionRisk(p.x,p.y);
    const exits=[[0,-1],[0,1],[-1,0],[1,0]].map(([dx,dy])=>
      ({x:p.x+dx,y:p.y+dy})).filter(q=>q.x>=1&&q.y>=1&&
        q.x<COLS-1&&q.y<ROWS-1&&map[q.y][q.x]===0&&
        !bombs.some(b=>b.x===q.x&&b.y===q.y));
    let worst=0,second=0;
    for(const b of plausible){
      const hit=b.cells.has(`${p.x},${p.y}`);
      const blocked=exits.filter(q=>b.cells.has(`${q.x},${q.y}`)).length;
      if(!hit && blocked===0)continue;
      const remain=exits.length-blocked;
      let risk=(hit?7:0)+((hit&&remain===0)?30:
        (hit&&remain===1)?19:(blocked>=2)?10:0);
      if(remain===0 && !hit)risk+=7;
      risk*=b.depth===0?1:b.depth===1?0.92:b.depth===2?0.78:0.55;
      if(risk>worst){second=worst;worst=risk;}
      else if(risk>second)second=risk;
    }
    const edgePenalty=r.edgeDistance===0?16:r.edgeDistance===1?4:0;
    const pathExposure=getEnemyPlayerTrapRisk(p.x,p.y,bombs,reach);
    const corridor=getEnemyCorridorRisk(p.x,p.y);
    // Distinguish current known-bomb safety from speculative future risks.
    return r.score*1.3+edgePenalty+corridor*0.72+
      pathExposure*0.9+worst*1.15+second*0.23+
      (exits.length<2?23:0)+
      (enemyLastPosition&&enemyLastPosition.x===p.x&&enemyLastPosition.y===p.y?2:0);
  };
  const oldScore=score(chosen);
  const ordered=viable.filter(p=>p.x!==chosen.x||p.y!==chosen.y)
    .map(p=>({p,score:score(p)})).sort((a,b)=>a.score-b.score);
  const savedGoal=enemyEscapeGoal;
  let accepted=null,checked=0;
  for(const entry of ordered){
    if(entry.score>oldScore-8)break;
    if(checked>=2)break; // avoid unbounded deep searches during a bomb carpet
    const p=entry.p;
    // v67: In a multi-bomb volley, a speculative next-bomb risk score
    // must not overwrite an actually verified MOVE with a WAIT. The player
    // can plant another bomb before the next 120ms decision, and repeated
    // waits allow the remaining corridor to be closed. Keep the planner's
    // move; still allow a wait if the time-expanded planner chose it.
    // v70: Do not reverse a verified escape into yesterday's tile merely
    // because a *hypothetical* follow-up bomb slightly favors it. The
    // original first action was already verified against all REAL bombs.
    if(hostile.length>=2 && enemyLastPosition &&
       (chosen.x!==enemy.x || chosen.y!==enemy.y) &&
       p.x===enemyLastPosition.x && p.y===enemyLastPosition.y &&
       (chosen.x!==p.x || chosen.y!==p.y)) {
      replayLog('ai_v70_escape_reverse_veto',{
        from:{x:enemy.x,y:enemy.y},planned:chosen,rejected:p,
        hostileBombs:hostile.length});
      continue;
    }
    if(hostile.length>=2 && distance<=8 &&
       p.x===enemy.x && p.y===enemy.y &&
       (chosen.x!==enemy.x || chosen.y!==enemy.y)) {
      replayLog('ai_v67_escape_wait_veto',{
        from:{x:enemy.x,y:enemy.y},planned:chosen,hostileBombs:hostile.length,
        speculativeRiskImprovement:Math.round((oldScore-entry.score)*10)/10
      });
      continue;
    }
    checked++;
    // A higher score cannot justify moving into an imminent real explosion.
    if(!enemyCanMove(p.x,p.y,events,1))continue;
    const path=findTimedSafeStep(p.x,p.y,null,null,1);
    enemyEscapeGoal=savedGoal;
    if(!path)continue;
    accepted=entry;break;
  }
  enemyEscapeGoal=savedGoal;
  const outcome=accepted?'redirect':ordered.length && ordered[0].score<oldScore-8 ?
    'alternative_not_verified':'insufficient_improvement';
  if(hostile.length>=2 || accepted)replayLog('ai_v59_escape_assessment',{
    status:outcome,hostileBombs:hostile.length,viableSteps:viable.length,
    selected:chosen,selectedRisk:Math.round(oldScore*10)/10,
    alternative:ordered.length?ordered[0].p:null,
    alternativeRisk:ordered.length?Math.round(ordered[0].score*10)/10:null});
  if(!accepted)return chosen;
  v59EscapeRedirectCount++;
  replayLog('ai_v59_escape_redirect',{from:{x:enemy.x,y:enemy.y},
    original:chosen,to:accepted.p,improvement:Math.round((oldScore-accepted.score)*10)/10,
    hostileBombs:hostile.length,viableSteps:viable.length});
  return accepted.p;
}

// v60: Treat the next human bomb as a possible attack on the whole *escape
// pocket*, not just on the AI's next tile. This lightweight lookahead expands
// each already-survivable first step over the next six REAL 120ms intervals.
// We prefer a pocket whose reachable tiles cannot all be denied by one
// plausible player placement (including a possible chain detonation).
// Speculative bombs never become hard obstacles: candidates must first survive
// the actual bomb timeline via findTimedSafeStep, and large score improvements
// are required to override the established v59 route.
let v60RefugeRedirectCount=0;
function findV60ResilientRefugeStep(origin, selected, escapeDiagnostics, events) {
  if (!player.alive || !selected) return selected;
  const hostile=bombs.filter(b=>b.owner==='player');
  if (hostile.length<2 || hostile.length>8) return selected;
  const d=Math.abs(origin.x-player.x)+Math.abs(origin.y-player.y);
  if (d>9) return selected;
  const viable=(escapeDiagnostics?.viableFirstSteps||[]).filter(p=>p &&
    !isTileDangerDuring(p.x,p.y,0,ENEMY_STEP_MS+45,events));
  if (viable.length<2) return selected;
  const placements=getPlayerReachableCells(2)
    .filter(p=>!bombs.some(b=>b.x===p.x&&b.y===p.y))
    .map(p=>({depth:p.depth,blast:new Set(getBlastCells({x:p.x,y:p.y,range:8})
      .map(([x,y])=>`${x},${y}`))}));
  if (!placements.length) return selected;
  const dirs=[[0,0],[0,-1],[0,1],[-1,0],[1,0]];
  const realBombEvents=bombs.map((b,i)=>({b,time:events[i]?.time??b.timer}));
  const score=p=>{
    let frontier=[{x:p.x,y:p.y,left:false}];
    // One step was just selected; project 6 MORE steps without assuming a
    // free move or permitting passage through a known bomb's solid tile.
    for(let step=1;step<=6 && frontier.length;step++){
      const next=[], seen=new Set();
      const from=(step*ENEMY_STEP_MS)-35;
      const until=(step+1)*ENEMY_STEP_MS+35;
      for(const pos of frontier)for(const [dx,dy] of dirs){
        const x=pos.x+dx,y=pos.y+dy;
        if(x<1||y<1||x>=COLS-1||y>=ROWS-1||map[y][x]!==0)continue;
        if(player.alive&&x===player.x&&y===player.y)continue;
        if(isTileDangerDuring(x,y,from,until,events))continue;
        const left=pos.left||x!==p.x||y!==p.y;
        if(realBombEvents.some(({b,time})=>b.x===x&&b.y===y&&
          !(x===p.x&&y===p.y&&!left) && from<time+BOMB_FLAME_MS))continue;
        const key=`${x},${y},${left?1:0}`;
        if(seen.has(key))continue;
        seen.add(key);next.push({x,y,left});
      }
      frontier=next;
    }
    const cells=[...new Set(frontier.map(q=>`${q.x},${q.y}`))];
    if(!cells.length)return {score:1000,minimum:0,available:0};
    let worstCount=cells.length, worstAxes=4;
    for(const placement of placements){
      const escape=cells.filter(key=>!placement.blast.has(key));
      // A remaining row AND a remaining column permit another turn after
      // the bomb, unlike a long, aligned corridor that can be sealed again.
      const xs=new Set(escape.map(key=>key.split(',')[0])).size;
      const ys=new Set(escape.map(key=>key.split(',')[1])).size;
      const axes=Math.min(xs,ys);
      if(escape.length<worstCount || (escape.length===worstCount && axes<worstAxes)){
        worstCount=escape.length;worstAxes=axes;
      }
    }
    const position=getEnemyPositionRisk(p.x,p.y);
    const distance=Math.abs(p.x-player.x)+Math.abs(p.y-player.y);
    const risk=95/(1+worstCount)+
      (worstAxes<=1?15:worstAxes===2?4:0)+
      (worstCount/cells.length<0.35?14:0)+
      (cells.length<=4?14:cells.length<=8?6:0)+
      position.score*0.65+getEnemyCorridorRisk(p.x,p.y)*0.45+
      getEnemyPlayerTrapRisk(p.x,p.y)*0.5+
      (position.edgeDistance===0?10:0)+
      (distance<4?(4-distance)*2:0);
    return {score:risk,minimum:worstCount,available:cells.length};
  };
  const scoreCache=new Map();
  const scored=p=>{
    const k=`${p.x},${p.y}`;
    if(!scoreCache.has(k))scoreCache.set(k,score(p));
    return scoreCache.get(k);
  };
  const best=viable.slice().sort((a,b)=>scored(a).score-scored(b).score)[0];
  if(!best || (best.x===selected.x&&best.y===selected.y))return selected;
  const original=scored(selected),replacement=scored(best);
  // Refuse cosmetic swaps or positions with no additional recovery cells.
  if(original.score-replacement.score<14 ||
     replacement.minimum<original.minimum+2)return selected;
  const savedGoal=enemyEscapeGoal;
  const verified=findTimedSafeStep(best.x,best.y,null,null,1);
  enemyEscapeGoal=savedGoal;
  if(!verified)return selected;
  v60RefugeRedirectCount++;
  replayLog('ai_v60_refuge_redirect',{
    from:origin,original:selected,to:{x:best.x,y:best.y},
    oldScore:Math.round(original.score*10)/10,
    newScore:Math.round(replacement.score*10)/10,
    originalRecovery:original.minimum,newRecovery:replacement.minimum,
    plausiblePlacements:placements.length,realBombs:bombs.length});
  return {x:best.x,y:best.y};
}

function moveEnemyAI() {
  if (gameOver || !enemy.alive || !player.alive) return;

  // 既存の爆弾が敵の位置や経路を脅かす場合は、時間軸付き探索を最優先する。
  const currentEvents = getTimedBombEvents();
  const threatened = currentEvents.some(event =>
    event.cells.some(([x, y]) => x === enemy.x && y === enemy.y) &&
    event.time <= 2600
  ) || flames.some(flame => flame.cells.some(([x, y]) => x === enemy.x && y === enemy.y));

  if (threatened) {
    const safeStep = findTimedSafeStep(enemy.x, enemy.y);
    if (safeStep) {
      enemy.x = safeStep.x;
      enemy.y = safeStep.y;
      return;
    }
  }

  // 爆弾を置ける位置へ移動する。到着後、placeEnemyBombが生存経路を検証して設置する。
  const attackStep = findBestTacticalAttackStep();
  // v63: During early play, a verified attack destination outranks a
  // speculative intercept. Otherwise offensive planting can stall entirely.
  const interceptStep=attackStep && replayClock<V55_STALEMATE_MS ?
    null : findEnemyInterceptStep(attackStep);
  const approach=(attackStep||interceptStep)?null:findApproachStep();
  const desired=interceptStep||attackStep||approach;
  if(interceptStep) replayLog('ai_v56_intercept',{
    from:{x:enemy.x,y:enemy.y},to:interceptStep,
    player:{x:player.x,y:player.y},heading:{x:playerDirX,y:playerDirY}});
  const containmentStep=findV56ContainmentStep(desired,attackStep);
  const chosen=chooseEnemyStrategicStep(containmentStep||desired);
  if(containmentStep && chosen && chosen.x===containmentStep.x &&
      chosen.y===containmentStep.y) replayLog('ai_v56_containment',{
    from:{x:enemy.x,y:enemy.y},to:{x:chosen.x,y:chosen.y},
    deniedScore:containmentStep.deniedScore,
    improvement:containmentStep.improvement});
  if(chosen) {
    enemy.x=chosen.x;
    enemy.y=chosen.y;
    if(!attackStep) replayLog("ai_reposition", {to:chosen, reason:"no_valid_bomb_spot"});
  }
}

// v62: Within one AI decision the terrain is immutable, so repeated blast
// shapes can be shared. Clear before explosions, which may change soft walls.
let aiBlastCache = null;
function getBlastCells(bomb) {
  const cacheKey=aiBlastCache ? `${bomb.x},${bomb.y},${bomb.range}` : null;
  if (cacheKey!==null && aiBlastCache.has(cacheKey))
    return aiBlastCache.get(cacheKey);
  const cells = [[bomb.x, bomb.y]];
  const directions = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  for (const [dx, dy] of directions) {
    for (let i = 1; i <= bomb.range; i++) {
      const x = bomb.x + dx * i;
      const y = bomb.y + dy * i;

      // 固い壁で爆風が止まる
      if (
        x < 0 || y < 0 ||
        x >= COLS || y >= ROWS ||
        map[y][x] === 1
      ) {
        break;
      }

      cells.push([x, y]);

      // ソフトブロックで爆風が止まる
      if (map[y][x] === 2) {
        break;
      }
    }
  }

  if (cacheKey!==null) aiBlastCache.set(cacheKey,cells);
  return cells;
}

function isDangerous(x, y) {
  // 爆弾の爆風が届くマスは、爆発までの時間に関係なく危険とする
  return bombs.some(bomb =>
    getBlastCells(bomb).some(
      ([bx, by]) => bx === x && by === y
    )
  ) || flames.some(flame =>
    flame.cells.some(([fx, fy]) => fx === x && fy === y)
  );
}


function findEnemyEscapeTarget(startX, startY, extraBomb = null) {
  const dangerBombs = extraBomb
    ? [...bombs, extraBomb]
    : [...bombs];

  function isSafe(x, y) {
    const bombDanger = dangerBombs.some(bomb =>
      getBlastCells(bomb).some(
        ([bx, by]) => bx === x && by === y
      )
    );

    const flameDanger = flames.some(flame =>
      flame.cells.some(([fx, fy]) => fx === x && fy === y)
    );

    return !bombDanger && !flameDanger;
  }

  const queue = [{ x: startX, y: startY }];
  const visited = new Set([`${startX},${startY}`]);
  let head = 0;

  while (head < queue.length) {
    const current = queue[head++];

    // 現在地以外で安全な場所を見つけたら、そこを逃走先にする
    if (
      (current.x !== startX || current.y !== startY) &&
      isSafe(current.x, current.y)
    ) {
      return { x: current.x, y: current.y };
    }

    for (const [dx, dy] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
      const x = current.x + dx;
      const y = current.y + dy;
      const key = `${x},${y}`;

      if (visited.has(key)) continue;
      if (x < 0 || y < 0 || x >= COLS || y >= ROWS) continue;
      if (map[y][x] !== 0) continue;
      if (bombs.some(b => b.x === x && b.y === y)) continue;
      if (player.x === x && player.y === y) continue;

      // 爆風が届くマスも、爆発前に通過する経路として探索する
      visited.add(key);
      queue.push({ x, y });
    }
  }

  return null;
}

// 記憶した逃走先へ向かうための次の1マスを探す
function findEnemyNextStep(targetX, targetY) {
  const queue = [{
    x: enemy.x,
    y: enemy.y,
    first: null
  }];

  const visited = new Set([`${enemy.x},${enemy.y}`]);
  let head = 0;

  while (head < queue.length) {
    const current = queue[head++];

    if (current.x === targetX && current.y === targetY) {
      return current.first;
    }

    for (const [dx, dy] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
      const x = current.x + dx;
      const y = current.y + dy;
      const key = `${x},${y}`;

      if (visited.has(key)) continue;
      if (x < 0 || y < 0 || x >= COLS || y >= ROWS) continue;
      if (map[y][x] !== 0) continue;
      if (bombs.some(b => b.x === x && b.y === y)) continue;
      if (player.x === x && player.y === y) continue;

      visited.add(key);

      queue.push({
        x,
        y,
        first: current.first || { x, y }
      });
    }
  }

  return null;
}


function escapeEnemyAI() {
  if (gameOver || !enemy.alive) return false;

  // 現在地が危険でなければ、回避行動は不要
  if (!isDangerous(enemy.x, enemy.y)) return false;

  const directions = [
    [0, -1],
    [0, 1],
    [-1, 0],
    [1, 0]
  ];

  const queue = [{ x: enemy.x, y: enemy.y, first: null }];
  const visited = new Set([`${enemy.x},${enemy.y}`]);
  let head = 0;

  while (head < queue.length) {
    const current = queue[head++];

    if (
      current.first &&
      !isDangerous(current.x, current.y)
    ) {
      enemy.x = current.first.x;
      enemy.y = current.first.y;
      return true;
    }

    for (const [dx, dy] of directions) {
      const x = current.x + dx;
      const y = current.y + dy;
      const key = `${x},${y}`;

      if (visited.has(key)) continue;
      if (!enemyCanMove(x, y)) continue;

      visited.add(key);

      queue.push({
        x,
        y,
        first: current.first || { x, y }
      });
    }
  }

  // 逃げ道が見つからない
  return false;
}


function update(dt) {
  if (gameOver) return;
  replayClock += dt;

  bombCooldown = Math.max(0, bombCooldown - dt);

  // 押している方向へ連続移動
  updateGamepad();
  playerMoveTimer -= dt;

  if (playerMoveTimer <= 0) {
    let dx = 0;
    let dy = 0;

    if (joystickDirection === "arrowup") dy = -1;
    else if (joystickDirection === "arrowdown") dy = 1;
    else if (joystickDirection === "arrowleft") dx = -1;
    else if (joystickDirection === "arrowright") dx = 1;
    else if (heldKeys.has("arrowup") || heldKeys.has("w") || gamepadKeys.has("arrowup")) dy = -1;
    else if (heldKeys.has("arrowdown") || heldKeys.has("s") || gamepadKeys.has("arrowdown")) dy = 1;
    else if (heldKeys.has("arrowleft") || heldKeys.has("a") || gamepadKeys.has("arrowleft")) dx = -1;
    else if (heldKeys.has("arrowright") || heldKeys.has("d") || gamepadKeys.has("arrowright")) dx = 1;

    if (dx !== 0 || dy !== 0) {
      movePlayer(dx, dy);
      playerMoveTimer = PLAYER_MOVE_INTERVAL;
    } else {
      playerMoveTimer = 0;
    }
  }

  // 入力直後にクールタイムや既存の爆弾で設置できなかった場合、
  // 次のマスへ移動した後など、条件が成立した時点で1個だけ設置する。
  if (bombInputBufferMs > 0) {
    bombInputBufferMs = Math.max(0, bombInputBufferMs - dt);
    if (bombInputBufferMs > 0) placeBomb();
  }

  enemyBombCooldown = Math.max(0, enemyBombCooldown - dt);

  // 敵AIをプレイヤーと同じ120msごとに動かす
  enemyMoveTimer -= dt;

  if (enemyMoveTimer <= 0) {
    aiBlastCache=new Map();
    aiShadowRiskCache=new Map();
    v17ClearCaches();
    v17ReachCache=new Map();
    v17TimelineCache=new Map();
    v17TrapBlastCache=new Map();
    v17PressureCache=new Map();
    observePlayerMotionAtAiTick();
    const previousEnemyPosition = { x: enemy.x, y: enemy.y };
    let v60SavedEscapeDiagnostics=null;
    let v60PlacedBomb=false;
    let v74CommittedAssault=false;
    let v69VerifiedEscape=null;
    let v70UnthreatenedPlan=null;
    let v18EscapingThisTick=false;
    v18StrategicSafety=null;
    v18ThreatSafety=null;
    const currentEvents = getTimedBombEvents();
    const currentThreat = currentEvents.some(event =>
      event.cells.some(([x, y]) => x === enemy.x && y === enemy.y) && event.time <= 2600
    ) || flames.some(flame => flame.cells.some(([x, y]) => x === enemy.x && y === enemy.y));

    // v72: Execute an intentional two-sided corner lock instead of letting
    // every escape heuristic drag the AI away from its follow-up site.
    // Any failed movement/survival/placement test falls back to v71.
    const v72Setup=v72CornerCapturePlan(currentEvents);
    let v72Handled=false;
    if(v72Setup){
      if(v72Setup.first){
        enemy.x=v72Setup.first.x;enemy.y=v72Setup.first.y;
        v60PlacedBomb=true; // marks a protected action for later arbiter
        v72Handled=true;
        replayLog('ai_v72_corner_setup',{
          from:previousEnemyPosition,to:{x:enemy.x,y:enemy.y},
          target:v72Setup.target,anchorRemainingMs:v72Setup.remaining});
        replayRecordDecision('corner_setup',{currentThreat,
          from:previousEnemyPosition,to:{x:enemy.x,y:enemy.y},
          activeBombs:bombs.length});
      } else if(enemyBombCooldown<=0){
        const evaluation=evaluateEnemyBombSpot(enemy.x,enemy.y);
        if(evaluation?.v72CornerClosure && placeEnemyBomb(evaluation)){
          v72Handled=true;v60PlacedBomb=true;
          replayRecordDecision('corner_closure',{currentThreat,
            from:previousEnemyPosition,to:previousEnemyPosition,
            activeBombs:bombs.length});
        }
      }
    }
    let v74RelayHandled=false;
    if(!v72Handled){
      const relay=v74CornerRelayPlan(currentEvents);
      if(relay && relay.first){
        enemy.x=relay.first.x;enemy.y=relay.first.y;
        v74RelayHandled=true;v60PlacedBomb=true;
        replayLog('ai_v74_relay_setup',{from:previousEnemyPosition,
          to:{x:enemy.x,y:enemy.y},target:relay.target,
          remainingMs:relay.remaining});
        replayRecordDecision('relay_setup',{currentThreat,
          from:previousEnemyPosition,to:{x:enemy.x,y:enemy.y},activeBombs:bombs.length});
      }else if(relay && enemyBombCooldown<=0){
        const evalRelay=evaluateEnemyBombSpot(enemy.x,enemy.y);
        if(evalRelay?.v74CornerRelay && placeEnemyBomb(evalRelay)){
          v74RelayHandled=true;v60PlacedBomb=true;
          replayRecordDecision('relay_bomb',{currentThreat,
            from:previousEnemyPosition,to:previousEnemyPosition,activeBombs:bombs.length});
        }
      }
    }
    // 高攻撃型の優先順位: 角封鎖/リレー -> 即時危険判定 -> 安全な攻撃と移動。
    // 750ms は「脱出を始めてよい時刻」ではない。危険判定を先延ばしに
    // しても、自分が生き残れる経路は従来どおり全爆弾の時系列で検証する。
    const IMMEDIATE_DEADLY_TIME = 750;
    const isImminentDanger = currentEvents.some(event =>
      event.time <= IMMEDIATE_DEADLY_TIME &&
      event.cells.some(([x, y]) => x === enemy.x && y === enemy.y)
    ) || flames.some(flame =>
      flame.cells.some(([x, y]) => x === enemy.x && y === enemy.y));

    if (v72Handled || v74RelayHandled) {
      // 先に検証済みの角封鎖/リレー攻撃を尊重する。
    } else {
      // 期限が750msより後でも、後続の爆発から逃げ切れない場合は
      // 先に回避する。単なる即時危険判定の変更による自爆を防ぐ。
      let verifiedEscape = null;
      let escapeDiagnostics = null;
      if (currentThreat || isImminentDanger) {
        escapeDiagnostics = {};
        verifiedEscape = findAdaptiveTimedSafeStep(enemy.x, enemy.y,
          escapeDiagnostics);
        v60SavedEscapeDiagnostics = escapeDiagnostics;
        v69VerifiedEscape = verifiedEscape;
        if(verifiedEscape && escapeDiagnostics.viableFirstSteps?.length)
          v18ThreatSafety={origin:{x:enemy.x,y:enemy.y},
            bombKey:v17BombFieldKey(),viable:escapeDiagnostics.viableFirstSteps,
            plan:verifiedEscape};
      }
      const mustEvade = isImminentDanger || (currentThreat && !verifiedEscape);

      if (!mustEvade) {
        // 1. 危険な爆風が届く前でも、設置後の生存を検証できた爆弾は優先する。
        let placed = false;
        let attackAction = 'ultra_attack_move';
        if (enemyBombCooldown <= 0) {
          const v16PressureBomb=findV16HumanPressureBomb();
          const offsetFollowup = v16PressureBomb ? null : findV74VerifiedFollowup(currentEvents);
          const surprise = (v16PressureBomb || offsetFollowup) ? null : findV69LateSurpriseBomb();
          const counter = (v16PressureBomb || offsetFollowup || surprise) ? null :
            findEnemyCounterBomb(currentEvents);
          const preferred = v16PressureBomb || offsetFollowup || surprise || counter?.evaluation || null;
          if (preferred) {
            placed = placeEnemyBomb(preferred);
            if (placed) {
              attackAction = v16PressureBomb ? 'human_pressure_chain_bomb' :
                offsetFollowup ? 'offset_volley_bomb' :
                surprise ? 'late_chain_bomb' : 'counter_bomb';
              if (counter && !offsetFollowup && !surprise)
                lastEnemyCounterBombAt = replayClock;
            }
          }
          if (!placed) {
            placed = placeEnemyBomb();
            if (placed) attackAction = 'ultra_attack_bomb';
          }
        }
        v60PlacedBomb = !!placed;

        // 2. 爆弾を置いたターンも止まらず、攻撃地点へ1マス移動する。
        // move -> plant も許すが、実際の移動先から最後まで生存できる
        // 経路を確認する。事前検証と実際の設置判断を決して迂回しない。
        const attackStep = findBestTacticalAttackStep();
        const interceptStep = attackStep && replayClock < V55_STALEMATE_MS ?
          null : findEnemyInterceptStep(attackStep);
        const approach = (attackStep || interceptStep) ? null : findApproachStep();
        const desired = interceptStep || attackStep || approach;
        const containmentStep = findV56ContainmentStep(desired, attackStep);
        const pressureStep = !placed ? findV16PressureApproach(currentEvents) : null;
        let chosen = pressureStep || chooseEnemyStrategicStep(containmentStep || desired);
        const postBombEvents = getTimedBombEvents();
        const isLegalAdjacent = p => !!p &&
          Math.abs(p.x - enemy.x) + Math.abs(p.y - enemy.y) <= 1 &&
          (p.x === enemy.x && p.y === enemy.y ||
            enemyCanMove(p.x, p.y, postBombEvents, 1));
        const isVerifiedSurvivable = p => {
          if (!isLegalAdjacent(p)) return false;
          if (isTileDangerDuring(p.x, p.y, 0,
              ENEMY_STEP_MS + 45, postBombEvents)) return false;
          if (!bombs.length) return true;
          if (!v16HumanCounterBombSafe(p))return false;
          const previousEscapeGoal = enemyEscapeGoal;
          const route = findTimedSafeStep(p.x, p.y, null, null, 1);
          enemyEscapeGoal = previousEscapeGoal;
          return !!route;
        };

        let moved = false;
        if (chosen && isVerifiedSurvivable(chosen)) {
          moved = chosen.x !== enemy.x || chosen.y !== enemy.y;
          enemy.x = chosen.x;
          enemy.y = chosen.y;
          if (moved) {
            v74CommittedAssault = true;
            replayLog('ai_ultra_attack_step', {
              from: previousEnemyPosition, to: {x:enemy.x,y:enemy.y},
              placedFirst: placed, threatened: currentThreat });
          }
          // 3. このターンに設置していなければ移動先でも設置を試す。
          // クールタイムは変えないため、同じターンでの二重設置はしない。
          if (!placed && moved && enemyBombCooldown <= 0) {
            const chainAtStep=pressureStep && pressureStep.x===enemy.x &&
              pressureStep.y===enemy.y ? findV16HumanPressureBomb() : null;
            placed = chainAtStep ? placeEnemyBomb(chainAtStep) : placeEnemyBomb();
            if (placed) {
              v60PlacedBomb = true;
              attackAction = chainAtStep ? 'human_pressure_after_move_bomb' :
                'ultra_attack_after_move_bomb';
            }
          }
        } else if (currentThreat && verifiedEscape) {
          // 攻撃方向が危険なら、攻撃を優先しても安全な脱出路は捨てない。
          enemy.x = verifiedEscape.x;
          enemy.y = verifiedEscape.y;
          v18EscapingThisTick=true;
          replayLog('ai_ultra_attack_escape', {
            from:previousEnemyPosition, to:{x:enemy.x,y:enemy.y},
            reason:'attack_route_not_survivable'});
        }
        replayRecordDecision(attackAction, {
          currentThreat, isImminentDanger, placed,
          from:previousEnemyPosition,to:{x:enemy.x,y:enemy.y},
          activeBombs:bombs.length});
      } else {
        v18EscapingThisTick=true;
        // 750ms以内に爆風が来る場合、または安全な攻撃継続がない場合の回避。
        if (!escapeDiagnostics) escapeDiagnostics = {};
        const safeStep = verifiedEscape ||
          findAdaptiveTimedSafeStep(enemy.x, enemy.y, escapeDiagnostics);
        v69VerifiedEscape = safeStep;
        v60SavedEscapeDiagnostics = escapeDiagnostics;
        if (safeStep) {
          let chosen = chooseOffensiveEscapeStep(safeStep,
            escapeDiagnostics, currentEvents);
          chosen = findV59SaferEscapeStep(chosen, escapeDiagnostics);
          chosen = findV74AttackEscapeStep(chosen,
            escapeDiagnostics, currentEvents);
          enemy.x = chosen.x;
          enemy.y = chosen.y;
        } else {
          const emergency = escapeDiagnostics.partialFirstAction ||
            findEmergencyStep();
          if (emergency) {
            enemy.x = emergency.x;
            enemy.y = emergency.y;
          }
          replayLog('escape_failed', {
            at:previousEnemyPosition, emergency,
            usedPartialRoute:!!escapeDiagnostics.partialFirstAction,
            activeBombs:bombs.length, diagnostics:escapeDiagnostics});
        }
        replayRecordDecision('escape', {
          currentThreat, isImminentDanger, safeStep,
          from:previousEnemyPosition,to:{x:enemy.x,y:enemy.y},
          escapeDiagnostics,activeBombs:bombs.length});
      }
    }

    // v60: Run the refuge test on a genuine, existing-bomb-safe set of
    // first actions. The same final safety guard below still applies.
    const v60Hostile=bombs.filter(b=>b.owner==='player').length;
    const v60Distance=Math.abs(previousEnemyPosition.x-player.x)+
      Math.abs(previousEnemyPosition.y-player.y);
    // v69: A known-safe escape must not be changed at the end of the tick
    // by a purely speculative refuge score. v59 has already applied any
    // VERIFIED better first-step while threat handling was active.
    if(!currentThreat && !v60PlacedBomb && !v74CommittedAssault && v60Hostile>=2 && v60Hostile<=8 &&
       v60Distance<=9 && enemy.alive){
      let diag=v60SavedEscapeDiagnostics;
      if(!diag && !currentThreat){
        diag={};
        const savedGoal=enemyEscapeGoal;
        v70UnthreatenedPlan=findAdaptiveTimedSafeStep(
          previousEnemyPosition.x,previousEnemyPosition.y,diag);
        v60SavedEscapeDiagnostics=diag;
        enemyEscapeGoal=savedGoal;
      }
      // Do not override an emergency move when even the real-bomb planner
      // could not identify a full-horizon survival route.
      if(diag && (diag.viableFirstSteps||[]).length>=2){
        const improved=findV60ResilientRefugeStep(previousEnemyPosition,
          {x:enemy.x,y:enemy.y},diag,getTimedBombEvents());
        enemy.x=improved.x;enemy.y=improved.y;
      }
    }

    // v69: Preserve a full-horizon verified departure when an intermediary
    // heuristic sends the AI back to its origin or reverses the last move
    // just as an explosion approaches. No new pathfinding required.
    if(currentThreat && !v60PlacedBomb && v69VerifiedEscape &&
       (v69VerifiedEscape.x!==previousEnemyPosition.x ||
        v69VerifiedEscape.y!==previousEnemyPosition.y)) {
      const soonest=Math.min(Infinity,...currentEvents.map(e=>e.time));
      const isWait=enemy.x===previousEnemyPosition.x && enemy.y===previousEnemyPosition.y;
      const isReverse=enemyLastPosition && enemy.x===enemyLastPosition.x &&
        enemy.y===enemyLastPosition.y &&
        (v69VerifiedEscape.x!==enemyLastPosition.x ||
         v69VerifiedEscape.y!==enemyLastPosition.y);
      if((soonest<=1550 || bombs.filter(b=>b.owner==='player').length>=2) &&
         (isWait || isReverse)) {
        replayLog('ai_v69_escape_lock',{
          from:previousEnemyPosition,overridden:{x:enemy.x,y:enemy.y},
          restored:v69VerifiedEscape,reason:isWait?'prevent_wait':'prevent_reverse',
          nextBlastMs:Math.round(soonest)});
        enemy.x=v69VerifiedEscape.x;
        enemy.y=v69VerifiedEscape.y;
      }
    }

    // v70: One final arbiter for REAL-bomb-safe first actions.  In the
    // unthreatened branch the v60 guard has ALREADY run a complete timed
    // search; reuse its first-step set rather than adding another search.
    // Hypothetical next bombs may *rank* viable options, never invent one.
    const v70Hostiles=bombs.filter(b=>b.owner==='player').length;
    const v70PlayerDistance=Math.abs(previousEnemyPosition.x-player.x)+
      Math.abs(previousEnemyPosition.y-player.y);
    if(!currentThreat && !v60PlacedBomb && !v74CommittedAssault &&
       v70Hostiles>=2 && v70Hostiles<=8 && v70PlayerDistance<=9 &&
       v60SavedEscapeDiagnostics && v70UnthreatenedPlan) {
      const viable=(v60SavedEscapeDiagnostics.viableFirstSteps||[]).filter(p=>
        !isTileDangerDuring(p.x,p.y,0,ENEMY_STEP_MS+45,currentEvents));
      if(viable.length) {
        const from=previousEnemyPosition;
        const proposed={x:enemy.x,y:enemy.y};
        const includes=(p)=>viable.some(q=>q.x===p.x&&q.y===p.y);
        const wait=proposed.x===from.x&&proposed.y===from.y;
        const reverse=enemyLastPosition && proposed.x===enemyLastPosition.x&&
          proposed.y===enemyLastPosition.y;
        const fromRisk=getEnemyPositionRisk(from.x,from.y);
        const vulnerable=(fromRisk.edgeDistance===0 ||
          getEnemyCorridorRisk(from.x,from.y)>=15 || fromRisk.exits<=2);
        const risk=(p)=>{
          const pos=getEnemyPositionRisk(p.x,p.y);
          const d=Math.abs(p.x-player.x)+Math.abs(p.y-player.y);
          return pos.score*0.8+getEnemyPlayerTrapRisk(p.x,p.y)*0.8+
            getEnemyCorridorRisk(p.x,p.y)*0.65+
            (pos.edgeDistance===0?18:pos.edgeDistance===1?4:0)+
            Math.max(0,5-d)*2+
            (enemyLastPosition&&p.x===enemyLastPosition.x&&p.y===enemyLastPosition.y?7:0);
        };
        let replacement=null, reason=null;
        if(!includes(proposed)) {
          replacement=v70UnthreatenedPlan;
          reason='unverified_strategic_step';
        } else if(wait && vulnerable) {
          // A corridor/outer-wall wait is easy to close with the next human
          // bomb. Depart only along a known survivable first step, not into
          // a narrower lane for the sake of motion itself.
          const moving=viable.filter(p=>p.x!==from.x||p.y!==from.y);
          moving.sort((a,b)=>risk(a)-risk(b));
          const option=moving.find(p=>{
            const r=getEnemyPositionRisk(p.x,p.y);
            return r.edgeDistance>fromRisk.edgeDistance ||
              r.exits>fromRisk.exits ||
              (r.openArea>=fromRisk.openArea+2 && risk(p)<risk(proposed));
          });
          if(option && risk(option)<=risk(proposed)+7) {
            replacement=option;
            reason='leave_blockable_wait';
          }
        } else if(reverse && viable.length>=2) {
          const alternate=viable.filter(p=>
            !(enemyLastPosition && p.x===enemyLastPosition.x&&p.y===enemyLastPosition.y) &&
            !(p.x===from.x&&p.y===from.y)).sort((a,b)=>risk(a)-risk(b))[0];
          if(alternate && risk(alternate)<=risk(proposed)+3) {
            replacement=alternate;
            reason='avoid_unnecessary_reverse';
          }
        }
        if(replacement && includes(replacement) &&
           (replacement.x!==proposed.x||replacement.y!==proposed.y)) {
          enemy.x=replacement.x;enemy.y=replacement.y;
          replayLog('ai_v70_route_arbitration',{
            from,overridden:proposed,to:replacement,reason,
            viableSteps:viable.length,hostileBombs:v70Hostiles});
        }
      }
    }

    // v18: Preserve first-step proofs even after a v15 pursuit override.
    // v28 already computed the expensive search in crowded human-bomb scenes.
    const v18Before={x:enemy.x,y:enemy.y};
    const v18Safe=v18ArbitrateFirstStep(previousEnemyPosition,
      v18Before,getTimedBombEvents());
    enemy.x=v18Safe.x;enemy.y=v18Safe.y;
    if(v18Safe.x!==v18Before.x || v18Safe.y!==v18Before.y)
      v18EscapingThisTick=true;

    // v10最終防護: 移動先が次のAI判断までに爆発する場合は移動を取り消す。
    // この検査は既存の連鎖爆発も対象。現在地が危険でも、移動先が
    // さらに危険な場合は前の位置に留まる（緊急回避は別途実行）。
    const changedPosition = enemy.x !== previousEnemyPosition.x || enemy.y !== previousEnemyPosition.y;
    // v67: The final real-bomb timeline does not change while recovering
    // from an unsafe step. All alternate tiles share the same events.
    const finalMoveEvents = changedPosition ? getTimedBombEvents() : null;
    if (changedPosition && isTileDangerDuring(enemy.x, enemy.y, 0,
          ENEMY_STEP_MS + 35, finalMoveEvents)) {
      replayLog("unsafe_move_blocked", { from: previousEnemyPosition,
        attempted: {x:enemy.x,y:enemy.y}, reason:"blast_before_next_ai_tick" });
      const safeAlternative = [[0,-1],[0,1],[-1,0],[1,0],[0,0]]
        .map(([dx,dy])=>({x:previousEnemyPosition.x+dx,y:previousEnemyPosition.y+dy}))
        .filter(p=>p.x>=0&&p.y>=0&&p.x<COLS&&p.y<ROWS && map[p.y][p.x]===0)
        .filter(p=>!(player.alive&&player.x===p.x&&player.y===p.y))
        .filter(p=>!(p.x!==previousEnemyPosition.x||p.y!==previousEnemyPosition.y) ||
          !bombs.some(b=>b.x===p.x&&b.y===p.y))
        .filter(p=>!isTileDangerDuring(p.x,p.y,0,ENEMY_STEP_MS+35,finalMoveEvents));
      // 移動可能な候補が複数あるときは、出口の多いマスを優先する。
      safeAlternative.sort((a,b)=>
        getEnemyPositionRisk(a.x,a.y).score-getEnemyPositionRisk(b.x,b.y).score ||
        enemyEscapeMobility(b.x,b.y)-enemyEscapeMobility(a.x,a.y));
      if (safeAlternative.length) {
        enemy.x=safeAlternative[0].x;
        enemy.y=safeAlternative[0].y;
      } else {
        enemy.x=previousEnemyPosition.x;
        enemy.y=previousEnemyPosition.y;
      }
      replayLog("unsafe_move_recovered", {to:{x:enemy.x,y:enemy.y},
        candidateCount:safeAlternative.length});
    }
    // v18: Only remember actual emergency retreats, not elective flanks;
    // expire after a few AI steps or if human bombs disappear.
    if(v18EscapingThisTick && bombs.some(b=>b.owner==='player') &&
       (enemy.x!==previousEnemyPosition.x || enemy.y!==previousEnemyPosition.y)) {
      v18RetreatMemory={from:previousEnemyPosition,to:{x:enemy.x,y:enemy.y},
        until:replayClock+380};
    } else if(v18RetreatMemory && (replayClock>=v18RetreatMemory.until ||
        !bombs.some(b=>b.owner==='player'))){
      v18RetreatMemory=null;
    }
    enemyVisual = animateVisualPosition(enemyVisual, enemy.x, enemy.y, ENEMY_VISUAL_MOVE_MS);
    enemyLastPosition = previousEnemyPosition;
    if (!currentThreat) enemyEscapeGoal = null;
    replayLog("enemy_step", { from: previousEnemyPosition, to: { x: enemy.x, y: enemy.y } });
    replaySnapshot("ai_tick");
    enemyMoveTimer = ENEMY_THINK_INTERVAL;
  }


  // Explosion may alter the terrain; never carry cached blast cells past it.
  aiBlastCache=null;
  aiShadowRiskCache=null;
  v17ClearCaches();
  // 爆弾のタイマーを進める
  for (const bomb of [...bombs]) {
    bomb.timer -= dt;

    if (bomb.timer <= 0) {
      bombs = bombs.filter(b => b !== bomb);
      explode(bomb);
    }
  }

  // 爆風の持続時間を更新
  for (const flame of flames) {
    flame.timer -= dt;
  }

  flames = flames.filter(f => f.timer > 0);

  // プレイヤーと敵の被弾判定
  const playerHit = player.alive && flames.some(flame =>
    flame.cells.some(([x, y]) => x === player.x && y === player.y)
  );

  const enemyHit = enemy.alive && flames.some(flame =>
    flame.cells.some(([x, y]) => x === enemy.x && y === enemy.y)
  );

  if (playerHit) {
    const by=Array.from(new Set(flames.filter(flame=>
      flame.cells.some(([x,y])=>x===player.x&&y===player.y))
      .map(flame=>flame.owner||'unknown')));
    player.alive=false;
    replayLog('player_hit', {x:player.x,y:player.y,hitBy:by});
  }
  if (enemyHit) {
    const by=Array.from(new Set(flames.filter(flame=>
      flame.cells.some(([x,y])=>x===enemy.x&&y===enemy.y))
      .map(flame=>flame.owner||'unknown')));
    enemy.alive=false;
    replayLog('enemy_hit',{x:enemy.x,y:enemy.y,hitBy:by});
  }
  if (playerHit || enemyHit) replaySnapshot("hit");

  // Compact victory feedback; no replay creation, storage, or downloads.
  if (!player.alive || !enemy.alive) {
    gameOver = true;
    const outcome = !player.alive && !enemy.alive ? "draw" : !player.alive ? "lose" : "win";
    message.textContent = outcome === "win" ? "勝利！ AI v18に勝ちました" :
      outcome === "lose" ? "敗北！ AI v18の勝ちです" : "引き分け！";
    const resultMark = document.getElementById("result-mark");
    if (resultMark) {
      resultMark.textContent = outcome === "win" ? "WIN" : outcome === "lose" ? "LOSE" : "DRAW";
      resultMark.dataset.result = outcome;
      resultMark.hidden = false;
    }
    if (typeof updateMatchStatus === "function") updateMatchStatus();
  }
}

function draw() {
  const now = performance.now();
  const pVisual = getVisualPosition(playerVisual, player.x, player.y, now);
  const eVisual = getVisualPosition(enemyVisual, enemy.x, enemy.y, now);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // マップ
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      ctx.fillStyle = (x + y) % 2 === 0 ? "#315447" : "#29483d";
      ctx.fillRect(x * TILE, y * TILE, TILE, TILE);

      if (map[y][x] === 1) {
        ctx.fillStyle = "#64748b";
        ctx.fillRect(x * TILE + 2, y * TILE + 2, TILE - 4, TILE - 4);
      } else if (map[y][x] === 2) {
        ctx.fillStyle = "#a16236";
        ctx.fillRect(x * TILE + 3, y * TILE + 3, TILE - 6, TILE - 6);
      }
    }
  }

  // 爆弾
  for (const bomb of bombs) {
    ctx.fillStyle = "#111827";
    ctx.beginPath();
    ctx.arc(
      bomb.x * TILE + TILE / 2,
      bomb.y * TILE + TILE / 2,
      TILE * 0.34,
      0,
      Math.PI * 2
    );
    ctx.fill();

    ctx.fillStyle = "#facc15";
    ctx.fillRect(bomb.x * TILE + 20, bomb.y * TILE + 4, 4, 7);
  }

  // 爆風
  for (const flame of flames) {
    for (const [x, y] of flame.cells) {
      ctx.fillStyle = "#fb923c";
      ctx.fillRect(x * TILE + 2, y * TILE + 2, TILE - 4, TILE - 4);

      ctx.fillStyle = "#fde68a";
      ctx.fillRect(x * TILE + 9, y * TILE + 9, TILE - 18, TILE - 18);
    }
  }

  // プレイヤー：青
  if (player.alive) {
    ctx.fillStyle = "#38bdf8";
    ctx.beginPath();
    ctx.arc(
      pVisual.x * TILE + TILE / 2,
      pVisual.y * TILE + TILE / 2,
      TILE * 0.36,
      0,
      Math.PI * 2
    );
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(pVisual.x * TILE + 9, pVisual.y * TILE + 9, 4, 4);
    ctx.fillRect(pVisual.x * TILE + 19, pVisual.y * TILE + 9, 4, 4);
  }

  // 敵：赤
  if (enemy.alive) {
    ctx.fillStyle = "#f87171";
    ctx.beginPath();
    ctx.arc(
      eVisual.x * TILE + TILE / 2,
      eVisual.y * TILE + TILE / 2,
      TILE * 0.36,
      0,
      Math.PI * 2
    );
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(eVisual.x * TILE + 9, eVisual.y * TILE + 9, 4, 4);
    ctx.fillRect(eVisual.x * TILE + 19, eVisual.y * TILE + 9, 4, 4);
  }
}

function loop(now) {
  const dt = Math.min(now - lastTime, 50);
  lastTime = now;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

document.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();

  if (
    ["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)
  ) {
    event.preventDefault();
  }

  // 押しているキーを記録する
  heldKeys.add(key);

  // 爆弾は押した瞬間に1回だけ設置
  if (!event.repeat && (key === " " || key === "spacebar")) {
    requestBomb();
  }

  // リスタート
  if (!event.repeat && key === "r") {
    resetGame();
  }
});

document.addEventListener("keyup", event => {
  heldKeys.delete(event.key.toLowerCase());
});

// ウィンドウ外にフォーカスが移った場合も停止する
window.addEventListener("blur", () => {
  heldKeys.clear();
});

document.getElementById("restart").addEventListener("click", resetGame);

resetGame();
requestAnimationFrame(loop);

// Minimal HUD. Deliberately omits analytic counters and replay state.
function updateMatchStatus() {
  const el = document.getElementById("match-stats");
  if (!el) return;
  const s = Math.floor(replayClock / 1000);
  const mm = String(Math.floor(s / 60)).padStart(2, "0");
  const ss = String(s % 60).padStart(2, "0");
  el.textContent = `${mm}:${ss}`;
}
setInterval(updateMatchStatus, 1000);

// Disable Safari's long-press text-selection and callout actions on controls.
for (const eventName of ["contextmenu", "selectstart", "dragstart"]) {
  document.addEventListener(eventName, event => {
    if (event.target?.closest?.("#move-stick, #bomb-control")) event.preventDefault();
  }, {capture:true});
}
for (const control of document.querySelectorAll("#move-stick, #bomb-control")) {
  control.addEventListener("touchstart", event => event.preventDefault(), {passive:false});
  control.addEventListener("touchmove", event => event.preventDefault(), {passive:false});
}

// One pointer owns the stick. A second pointer can independently press BOMB.
// Pointer capture permits drags beyond the circular base without losing control.
const mobileSteps = {
  arrowup: [0,-1], arrowdown: [0,1], arrowleft: [-1,0], arrowright: [1,0]
};
const stick = document.getElementById("move-stick");
const knob = document.getElementById("stick-knob");
const STICK_DEAD_ZONE = 0.20;
const STICK_KNOB_TRAVEL = 0.42; // fraction of the base diameter
function aimStick(clientX, clientY) {
  if (!stick || joystickPointerId === null) return;
  const rect = stick.getBoundingClientRect();
  const radius = Math.min(rect.width,rect.height)/2;
  if (radius <= 0) return;
  const centerX = rect.left + rect.width/2;
  const centerY = rect.top + rect.height/2;
  let dx = (clientX-centerX)/radius;
  let dy = (clientY-centerY)/radius;
  const magnitude = Math.hypot(dx,dy);
  const factor = magnitude > 1 ? 1/magnitude : 1;
  dx *= factor; dy *= factor;
  // Visual position follows the finger, while movement remains grid-based.
  const travel = radius * STICK_KNOB_TRAVEL;
  if (knob) knob.style.transform = `translate(-50%, -50%) translate(${(dx*travel).toFixed(1)}px, ${(dy*travel).toFixed(1)}px)`;
  let direction = null;
  if (magnitude >= STICK_DEAD_ZONE) {
    if (Math.abs(dx) >= Math.abs(dy)) direction = dx >= 0 ? "arrowright" : "arrowleft";
    else direction = dy >= 0 ? "arrowdown" : "arrowup";
  }
  const previous = joystickDirection;
  joystickDirection = direction;
  // An analog-stick turn should not keep moving along the previous axis.
  if (previous && direction && previous !== direction)
    playerMoveTimer = Math.min(playerMoveTimer, 35);
  if (!direction) {
    if (previous) playerMoveTimer = 0;
    return;
  }
  // First movement is immediate instead of waiting for the animation frame.
  if (!previous && playerMoveTimer <= 0 && !gameOver) {
    const [stepX,stepY] = mobileSteps[direction];
    movePlayer(stepX,stepY);
    playerMoveTimer = PLAYER_MOVE_INTERVAL;
  }
}
function releaseStick() {
  joystickPointerId = null;
  joystickDirection = null;
  playerMoveTimer = 0;
  if (knob) knob.style.transform = "translate(-50%, -50%)";
  if (stick) stick.classList.remove("active");
}
if (stick) {
  stick.addEventListener("pointerdown", event => {
    if (gameOver || joystickPointerId !== null) return;
    event.preventDefault();
    joystickPointerId = event.pointerId;
    stick.classList.add("active");
    try { stick.setPointerCapture?.(event.pointerId); } catch (_) {}
    aimStick(event.clientX,event.clientY);
  });
  stick.addEventListener("pointermove", event => {
    if (event.pointerId !== joystickPointerId) return;
    event.preventDefault();
    aimStick(event.clientX,event.clientY);
  });
  for (const eventName of ["pointerup", "pointercancel", "lostpointercapture"])
    stick.addEventListener(eventName, event => {
      if (event.pointerId === joystickPointerId) releaseStick();
    });
}
const bombBtn = document.getElementById("bomb-control");
if (bombBtn) {
  bombBtn.addEventListener("pointerdown", event => {
    if (gameOver) return;
    event.preventDefault();
    try { bombBtn.setPointerCapture?.(event.pointerId); } catch (_) {}
    bombBtn.classList.add("pressed");
    requestBomb();
  });
  for (const name of ["pointerup","pointercancel","lostpointercapture"])
    bombBtn.addEventListener(name, () => bombBtn.classList.remove("pressed"));
}
window.addEventListener("blur", () => {
  releaseStick();
  heldKeys.clear();
  document.querySelectorAll(".pressed").forEach(button => button.classList.remove("pressed"));
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    releaseStick();
    heldKeys.clear();
    document.querySelectorAll(".pressed").forEach(button => button.classList.remove("pressed"));
  }
});

</script>
</body>
