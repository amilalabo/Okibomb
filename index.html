<html lang="ja">
<head>

<style>
:root{color-scheme:dark;--bg:#0d1522;--panel:#172639;--edge:#36506a;--text:#f1f8ff;--muted:#9fb6c9;--blue:#39bffa;--red:#ff7777;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
html{background:var(--bg);overflow-x:hidden}
body{margin:0;color:var(--text);background:radial-gradient(ellipse at 40% -20%,#243d5a 0%,var(--bg) 64%);min-height:100svh;padding:env(safe-area-inset-top) max(10px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));overscroll-behavior:contain;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.shell{max-width:830px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 3px 10px}
.brand{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
h1{font-size:clamp(18px,4.5vw,24px);margin:0;font-weight:900;letter-spacing:.01em}
.version{font-size:11px;background:#21405b;border:1px solid #355677;border-radius:99px;color:#b6e5ff;font-weight:700;padding:4px 9px}
.time{font-variant-numeric:tabular-nums;font-size:15px;font-weight:900;letter-spacing:.04em;color:#cedfed;min-width:57px;text-align:right}
.game-layout{display:grid;grid-template-columns:minmax(0,480px) minmax(240px,1fr);gap:16px;align-items:start}
.arena{min-width:0}
.board{position:relative;width:100%;aspect-ratio:15/13;border:2px solid #607d95;box-shadow:0 0 0 4px #112338,0 16px 36px #03091666;border-radius:8px;overflow:hidden;background:#29483d}
canvas{display:block;width:100%;height:100%;aspect-ratio:15/13;user-select:none;-webkit-user-select:none;touch-action:none}
#result-mark:not([hidden]){display:grid;place-items:center;position:absolute;inset:0;background:#06101acc;font-size:clamp(48px,13vw,94px);font-weight:1000;letter-spacing:.08em;text-shadow:0 4px 25px #020a13}
#result-mark[data-result=win]{color:#79dcff}#result-mark[data-result=lose]{color:#ff9393}#result-mark[data-result=draw]{color:#fff0a4}
#message{font-size:12px;line-height:1.5;color:#b9cbde;margin:11px 0 0;min-height:20px;font-weight:600}
.legend{display:flex;gap:14px;font-size:11px;color:#adbed0;align-items:center;margin-top:6px}
.dot{width:9px;height:9px;display:inline-block;border-radius:50%;margin-right:5px;background:var(--blue)}.dot.red{background:var(--red)}
.control-panel{border:1px solid #334b61;border-radius:14px;padding:14px;background:#142235;box-shadow:0 12px 30px #0003}
.controls{display:flex;align-items:center;justify-content:space-around;gap:10px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
/* Thumb-operated virtual analog stick: the knob follows the finger;
   the original grid game still receives four-way directions. */
.stick-wrap{display:grid;justify-items:center;align-items:center;gap:8px}
.joystick{position:relative;width:162px;height:162px;flex:none;border-radius:50%;border:2px solid #587d9b;background:radial-gradient(circle at 44% 36%,#324d69 0%,#1d324a 57%,#0e1c2d 100%);box-shadow:inset 0 5px 18px #050b17b0,0 5px 15px #0006;touch-action:none;overscroll-behavior:contain;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;cursor:grab}
.joystick.active{border-color:#6baee0;cursor:grabbing}
.joystick::before{content:"";position:absolute;inset:22%;border:1px solid #4f749250;border-radius:50%;pointer-events:none}
.stick-knob{position:absolute;left:50%;top:50%;width:70px;height:70px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 32% 26%,#7699b5,#365674 63%,#203650 100%);border:2px solid #80a1b7;box-shadow:0 4px 12px #030915b8,inset 0 2px 3px #d3e8ff3d;pointer-events:none;will-change:transform;touch-action:none}
.stick-knob::before{content:"";position:absolute;inset:22px;border-radius:50%;background:#b1cfe5a8;box-shadow:0 0 0 5px #e0f0ff1c}
.joystick .mark{position:absolute;color:#a1bed5;font-size:15px;line-height:1;pointer-events:none;user-select:none}
.joystick .mark-up{top:9px;left:50%;transform:translateX(-50%)}
.joystick .mark-down{bottom:9px;left:50%;transform:translateX(-50%)}
.joystick .mark-left{left:9px;top:50%;transform:translateY(-50%)}
.joystick .mark-right{right:9px;top:50%;transform:translateY(-50%)}
.stick-label{font-size:12px;color:#d7e4ee;font-weight:900}
.bomb-wrap{display:grid;justify-items:center;gap:9px;align-items:center}
.bomb{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ffbd7c,#f76d40 48%,#b83630 90%);border:3px solid #ffc08f;color:#291419;font-size:20px;font-weight:1000;box-shadow:0 6px 0 #612f25,0 10px 22px #0b1118}
.bomb.pressed,.bomb:active{transform:translateY(5px);box-shadow:0 1px 0 #612f25;background:#ffa05e}
.bomb-label{font-size:12px;color:#d7e4ee;font-weight:900}
.actions{display:flex;justify-content:flex-end;align-items:center;margin:0 0 28px;min-height:38px}
#restart{width:auto;min-width:132px;border:1px solid #567fa3;border-radius:10px;background:#24517a;padding:10px 15px;font:inherit;font-size:13px;font-weight:800;color:white;cursor:pointer;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#restart:active{background:#3b6e97}
.hint{color:#93aabd;font-size:11px;line-height:1.6;margin:11px 0 0}
@media(max-width:710px){.shell{max-width:475px}.game-layout{grid-template-columns:minmax(0,1fr);gap:10px}.control-panel{border:0;background:transparent;box-shadow:none;padding:0 8px}.header{padding:7px 2px 9px}.controls{justify-content:space-between;gap:12px;max-width:370px;margin:0 auto}.joystick{width:min(42vw,162px);height:min(42vw,162px)}.stick-knob{width:44%;height:44%}.stick-knob::before{inset:32%}.bomb{width:min(25vw,100px);height:min(25vw,100px)}.actions{max-width:370px;margin:0 auto 22px}.hint{margin:7px auto 0;max-width:370px}#message{margin-top:8px}}
@media(max-width:390px){.joystick{width:148px;height:148px}.bomb{width:89px;height:89px}.control-panel{padding:0 3px}.legend{margin-top:3px}#message{margin-top:6px}}
@media(orientation:landscape) and (max-height:520px){body{padding-top:max(3px,env(safe-area-inset-top));padding-bottom:max(3px,env(safe-area-inset-bottom))}.shell{max-width:960px}.header{padding:4px 2px 7px}.game-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,260px);gap:12px}.board{max-height:calc(100svh - 82px);width:auto;max-width:100%;margin:0 auto}.arena{display:flex;flex-direction:column;align-items:center}#message{min-height:0;margin:5px 0 0}.legend{display:none}.control-panel{align-self:center}.controls{gap:8px}.joystick{width:134px;height:134px}.stick-wrap{gap:4px}.stick-label{font-size:10px}.bomb{width:75px;height:75px;font-size:16px}.bomb-label{font-size:10px}.actions{margin:0 auto 13px}#restart{padding:8px 12px}.hint{margin:4px 0 0}}
@media(max-height:680px) and (orientation:portrait){.hint{display:none}.legend{margin-top:3px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<body><main class="shell">
<div class="header"><div class="brand"><span class="version">VS AI v18</span></div><div class="time" id="match-stats" aria-label="経過時間">00:00</div></div>
<div class="game-layout">
  <div class="arena">
    <div class="board"><canvas id="game" width="480" height="416" aria-label="対戦フィールド。青があなた、赤がAI v18です"></canvas><div id="result-mark" hidden aria-hidden="true"></div></div>
    <div id="message" role="status" aria-live="polite">対戦開始</div>
    <div class="legend"><span><i class="dot"></i>青：あなた</span><span><i class="dot red"></i>赤：AI v18</span></div>
  </div>
  <div class="control-panel">
    <div class="actions"><button id="restart" type="button">↻ もう一度対戦</button></div>
    <div class="controls" aria-label="タッチ操作">
      <div class="stick-wrap">
        <div class="joystick" id="move-stick" role="group" aria-label="移動スティック。指を置いて上下左右へ倒すと移動します">
          <span class="mark mark-up" aria-hidden="true">▲</span><span class="mark mark-left" aria-hidden="true">◀</span>
          <span class="mark mark-right" aria-hidden="true">▶</span><span class="mark mark-down" aria-hidden="true">▼</span>
          <div class="stick-knob" id="stick-knob" aria-hidden="true"></div>
        </div>
        <div class="stick-label">移動スティック</div>
      </div>
      <div class="bomb-wrap"><button type="button" class="bomb" id="bomb-control" aria-label="爆弾を置く">BOMB</button><div class="bomb-label">爆弾を置く</div></div>
    </div>
    <p class="hint">左スティックを指で倒して移動。中央に戻すと停止。爆弾ボタンと同時操作できます。PCは矢印キー／WASD・Space。</p>
  </div>
</div>
</main>
<script>

// The on-screen build label is sourced from this script, so replacing game.js
// always shows the correct opponent even when the HTML is unchanged.
const AI_BUILD_VERSION = "v18・対人戦特化（生存初手固定・退避記憶・追跡保護）";
// Parameter search alters only tactical prioritization / admission criteria.
// Time-expanded bomb-escape verification and safety invariants are never tunable.
// LAB_TUNING_START
const AI_ATTACK_TUNING = Object.freeze({"aggression":1.5,"pressure":1.4,"lead":1.3,"layered":1.5,"counter":1.2,"laneCut":1.4});
// LAB_TUNING_END
// v55 only changes late, unresolved encounters; proven fast wins are preserved.
const V55_STALEMATE_MS = 75000;
// v63: The positional denial and interception logic used to activate only
// after 75 seconds. Enable it sooner on a clear board, where its candidate
// moves still pass the existing legal-movement and risk checks.
const V63_EARLY_PRESSURE_MS = 9000;
function v63PressurePhase() {
  // 開幕から常にプレッシャーフェーズを維持する
  return true; 
}
function showBombermanBuildVersion() {
  if (typeof document.querySelectorAll !== "function") return;
  const headings = document.querySelectorAll("h1, h2, [role=heading]");
  const heading = Array.from(headings).find(node =>
    node.textContent && node.textContent.includes("Bomberman AI Lab"));
  if (!heading || heading.querySelector?.("[data-bomberman-ai-version]")) return;
  const suffix = document.createElement("span");
  suffix.setAttribute("data-bomberman-ai-version", AI_BUILD_VERSION);
  suffix.textContent = " — " + AI_BUILD_VERSION;
  suffix.style.fontSize = "0.68em";
  suffix.style.fontWeight = "600";
  suffix.style.opacity = "0.8";
  suffix.style.whiteSpace = "nowrap";
  heading.appendChild(suffix);
}
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", showBombermanBuildVersion);
} else {
  showBombermanBuildVersion();
}

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const message = document.getElementById("message");

const heldKeys = new Set();
// The on-screen stick has its own state, independent from keyboard input.
let joystickDirection = null;
let joystickPointerId = null;
let playerMoveTimer = 0;
const PLAYER_MOVE_INTERVAL = 120; // グリッド移動間隔（判定は従来どおり）
const PLAYER_VISUAL_MOVE_MS = 105; // マス間の表示補間時間
const ENEMY_VISUAL_MOVE_MS = 105;
const BOMB_COOLDOWN_MS = 120; // v17: 250ms
const BOMB_INPUT_BUFFER_MS = 180; // クールタイム中の短い入力を保持
const ENEMY_THINK_INTERVAL = 120;
const ENEMY_STEP_MS = 120;
// A deliberately conservative time quantum for deep escape search.
// Real AI movement and decision intervals are both 120ms.
const ENEMY_PATH_STEP_MS = 200;
const BOMB_FLAME_MS = 600;

const gamepadKeys = new Set();
let gamepadBombWasPressed = false;

const TILE = 32;
const COLS = 15;
const ROWS = 13;

let map;
let player;
let enemy;
let bombs;
let flames;
let gameOver;
let lastTime;
let bombCooldown;
let bombInputBufferMs = 0;
let playerVisual = null;
let enemyVisual = null;
let enemyMoveTimer;
let enemyBombCooldown;
let enemyEscapeTarget;
let playerDirX = 0;
let playerDirY = 0;
// v68: A remembered direction is not necessarily an active heading.
// Require two recent moves in the same direction before predicting a lane.
let lastPlayerMoveAt = -Infinity;
let playerHeadingStreak = 0;
let lastObservedPlayerPos = null;
let lastObservedHeading = {dx:0,dy:0};
let lastEnemyCounterBombAt = -Infinity;
// v69: A late linked-bomb attempt is rare, chosen once per existing anchor.
let v69SurpriseRolls = new Map();
let lastV69SurpriseAt = -Infinity;


// Lightweight mobile edition: keep the original v18 AI and game clock,
// but do not collect frames, events, or download any match records.
let replayClock = 0;
let replayBombId = 0;
function replayLog() {}
function replaySnapshot() {}
function replayRecordDecision() {}

function resetGame() {
  v58BreakoutCount=0;
  v59EscapeRedirectCount=0;
  v59EscapeCheckedCount=0;
  v60RefugeRedirectCount=0;
  map = Array.from({ length: ROWS }, (_, y) =>
  Array.from({ length: COLS }, (_, x) => {
    // 外周の固い壁
    if (
      x === 0 ||
      y === 0 ||
      x === COLS - 1 ||
      y === ROWS - 1
    ) {
      return 1;
    }

    // 内側の固い壁を格子状に配置
    if (
    (x % 2 === 0 && y % 2 === 0) ||
    (x === 2 && y === 2) ||
    (x === 12 && y === 10)
    ) {
  return 1;
}
    // ソフトブロックなし
    return 0;
  })
);

  // プレイヤー側のスタート地点を空ける
  for (const [x, y] of [[1, 1], [1, 2], [2, 1]]) {
    map[y][x] = 0;
  }

  // 敵側のスタート地点を空ける
  for (const [x, y] of [
    [COLS - 2, ROWS - 2],
    [COLS - 2, ROWS - 3],
    [COLS - 3, ROWS - 2]
  ]) {
    map[y][x] = 0;
  }

  player = {
    x: 1,
    y: 1,
    alive: true
  };

  enemy = {
    x: COLS - 2,
    y: ROWS - 2,
    alive: true
  };

  bombs = [];
  flames = [];
  gameOver = false;
  bombCooldown = 0;
  bombInputBufferMs = 0;
  // リスタート時は補間状態を破棄し、初期位置から描画する。
  playerVisual = createVisualPosition(player.x, player.y);
  enemyVisual = createVisualPosition(enemy.x, enemy.y);
  enemyBombCooldown = 0;
  enemyMoveTimer = 0;
  lastTime = performance.now();
  enemyEscapeTarget = null;
  enemyEscapeGoal = null;
  enemyLastPosition = null;
  v18StrategicSafety = null;
  v18ThreatSafety = null;
  v18RetreatMemory = null;
  playerDirX = 0;
  playerDirY = 0;
  lastPlayerMoveAt = -Infinity;
  playerHeadingStreak = 0;
  lastObservedPlayerPos = {x:player.x,y:player.y};
  lastObservedHeading = {dx:0,dy:0};
  lastEnemyCounterBombAt = -Infinity;
  v69SurpriseRolls = new Map();
  lastV69SurpriseAt = -Infinity;

  replayClock = 0;
  replayBombId = 0;
  heldKeys.clear();
  gamepadKeys.clear();
  joystickDirection = null;
  joystickPointerId = null;
  const stickEl = document.getElementById("move-stick");
  const stickKnob = document.getElementById("stick-knob");
  if (stickEl) stickEl.classList.remove("active");
  if (stickKnob) stickKnob.style.transform = "translate(-50%, -50%)";
  playerMoveTimer = 0;
  message.textContent = "対戦中 — 青：あなた / 赤：AI v18";
  const resultMark = document.getElementById("result-mark");
  if (resultMark) { resultMark.hidden = true; resultMark.textContent = ""; }
  if (typeof updateMatchStatus === "function") updateMatchStatus();
  draw();
}

function canMove(x, y) {
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) {
    return false;
  }

  if (map[y][x] !== 0) {
    return false;
  }

  if (bombs.some(b => b.x === x && b.y === y)) {
    return false;
  }

  return true;
}

// 物理/当たり判定はグリッドの座標で処理し、見た目だけ滑らかにつなぐ。
function createVisualPosition(x, y) {
  return { fromX:x, fromY:y, toX:x, toY:y, startedAt:performance.now(), duration:1 };
}

function getVisualPosition(visual, x, y, now = performance.now()) {
  if (!visual) return { x, y };
  const progress = Math.max(0, Math.min(1, (now - visual.startedAt) / visual.duration));
  // 加速・減速を少しつけ、次のマスへの移動とつながりやすくする。
  const eased = progress * progress * (3 - 2 * progress);
  return {
    x: visual.fromX + (visual.toX - visual.fromX) * eased,
    y: visual.fromY + (visual.toY - visual.fromY) * eased
  };
}

function animateVisualPosition(visual, x, y, duration) {
  if (!visual) return createVisualPosition(x, y);
  if (visual.toX === x && visual.toY === y) return visual;
  const now = performance.now();
  const current = getVisualPosition(visual, x, y, now);
  visual.fromX = current.x;
  visual.fromY = current.y;
  visual.toX = x;
  visual.toY = y;
  visual.startedAt = now;
  visual.duration = duration;
  return visual;
}

function movePlayer(dx, dy) {
  if (gameOver || !player.alive) return;

  const x = player.x + dx;
  const y = player.y + dy;

  if (canMove(x, y)) {
    player.x = x;
    player.y = y;
    playerVisual = animateVisualPosition(playerVisual, x, y, PLAYER_VISUAL_MOVE_MS);
    // Heading consistency is sampled when the AI makes its next decision.
    playerDirX = dx;
    playerDirY = dy;
    replayLog("player_move", { x, y, dx, dy });
  }
}

function updateGamepad() {
  gamepadKeys.clear();

  if (!navigator.getGamepads) return;

  const gamepads = navigator.getGamepads();
  let pad = null;

  for (const gamepad of gamepads) {
    if (gamepad && gamepad.connected) {
      pad = gamepad;
      break;
    }
  }

  // コントローラーが接続されていない
  if (!pad) {
    gamepadBombWasPressed = false;
    return;
  }

  // 十字キー
  const up = pad.buttons[12]?.pressed;
  const down = pad.buttons[13]?.pressed;
  const left = pad.buttons[14]?.pressed;
  const right = pad.buttons[15]?.pressed;

  // 左スティック
  const axisX = pad.axes[0] || 0;
  const axisY = pad.axes[1] || 0;
  const deadzone = 0.5;

  if (up || axisY < -deadzone) {
    gamepadKeys.add("arrowup");
  } else if (down || axisY > deadzone) {
    gamepadKeys.add("arrowdown");
  } else if (left || axisX < -deadzone) {
    gamepadKeys.add("arrowleft");
  } else if (right || axisX > deadzone) {
    gamepadKeys.add("arrowright");
  }

  // Bボタン／○ボタン（標準配置ではボタン番号1）
  const bombPressed = pad.buttons[1]?.pressed ?? false;

  // 押した瞬間だけ爆弾を設置
  if (bombPressed && !gamepadBombWasPressed) {
    requestBomb();
  }

  gamepadBombWasPressed = bombPressed;
}

// キー/ゲームパッドからの設置要求。現在設置できなければ180msだけ予約する。
// 押しっぱなしで無制限に置かないよう、押下エッジでのみ呼び出す。
function requestBomb() {
  if (gameOver || !player.alive) return;
  if (placeBomb()) {
    bombInputBufferMs = 0;
  } else {
    bombInputBufferMs = BOMB_INPUT_BUFFER_MS;
  }
}

function placeBomb() {
  if (gameOver || !player.alive || bombCooldown > 0) return false;

  // プレイヤーの爆弾は最大8個
  const playerBombCount = bombs.filter(
    b => b.owner !== "enemy"
  ).length;

  if (playerBombCount >= 8) return false;

  if (bombs.some(b => b.x === player.x && b.y === player.y)) {
    return false;
  }

  bombs.push({
    replayId: ++replayBombId,
    owner: "player", // v59: authoritative ownership, not just replay metadata
    x: player.x,
    y: player.y,
    timer: 2000,
    range: 8
  });

  replayLog("bomb_placed", { id: replayBombId, owner: "player", x: player.x, y: player.y, timer: 2000, range: 8 });
  replaySnapshot("bomb_placed");
  bombCooldown = BOMB_COOLDOWN_MS;
  bombInputBufferMs = 0;
  return true;
}

// v11: 実際の爆弾設置と攻撃地点の探索に同じ条件を適用する。
// v10では探索が「設置不可の地点」を最高得点に選び、そこで停止していた。
// v22: 追加爆弾が、プレイヤーの次の一手の爆弾を介して早期誘爆
// する場合は設置を見送る。既知の爆弾しか計算しない従来の検証の穴を埋める。
// あくまで設置時の検証用。移動のたびに仮想爆弾で重い探索は行わない。
function enemyBombChainAmbush(proposedBomb) {
  if (bombs.length < 2 || !player.alive) return false;
  const earliestExisting = Math.min(...bombs.map(b=>b.timer));
  if (earliestExisting > 1150) return false;
  const baseline = getTimedBombEvents(proposedBomb);
  const baseTime=baseline[baseline.length-1].time;
  if (baseTime <= 1100) return false; // 既知の早期誘爆は従来の探索で考慮済み
  const positions=getPlayerReachableCells(2);
  for (const p of positions) {
    if (bombs.some(b=>b.x===p.x&&b.y===p.y) ||
        (p.x===proposedBomb.x&&p.y===proposedBomb.y)) continue;
    const earliestPlacement=p.depth*PLAYER_MOVE_INTERVAL;
    // 現在の位置から十分早く置けない爆弾を過大評価しない。
    if (earliestPlacement > earliestExisting + 75) continue;
    const virtual={x:p.x,y:p.y,timer:2000+earliestPlacement,range:8,owner:'player'};
    bombs.push(virtual);
    let future;
    try { future=getTimedBombEvents(proposedBomb); }
    finally { bombs.pop(); }
    const newBombTime=future[future.length-2].time;
    const proposedTime=future[future.length-1].time;
    // 仮想爆弾は「置かれた後」に既存爆弾で誘爆した場合だけ有効。
    if (newBombTime+35 < earliestPlacement) continue;
    if (newBombTime <= 1100 && proposedTime <= 1100 &&
        proposedTime < baseTime - 320) return true;
  }
  return false;
}

// v72: A motionless corner defender has two independent exits. A single
// direct blast typically covers only one. Preserve an intentional TWO-SIDED
// attack, but only if the second bomb is legal and our real-bomb escape
// search confirms survival. This is conditional on the defender remaining
// stationary; a human who reacts to the first bomb can still break the trap.
function v72StationaryCorner() {
  if(!player.alive || !enemy.alive || replayClock<1250 ||
     replayClock-lastPlayerMoveAt<1100) return null;
  const sx=player.x===1 ? 1 : player.x===COLS-2 ? -1 : 0;
  const sy=player.y===1 ? 1 : player.y===ROWS-2 ? -1 : 0;
  if(!sx || !sy) return null;
  const horizontal={x:player.x+2*sx,y:player.y};
  const vertical={x:player.x,y:player.y+2*sy};
  if(map[horizontal.y][horizontal.x]!==0 ||
     map[vertical.y][vertical.x]!==0) return null;
  return {horizontal,vertical};
}

// Count actual time-expanded escape routes for the CURRENT stationary player,
// not only immediate exits. This is an occasional specialized test, NOT a
// claim about where the human might have moved before the second placement.
function v72PlayerHasSurvivalRoute(extraBomb) {
  const events=getTimedBombEvents(extraBomb);
  const all=[...bombs,extraBomb];
  const end=Math.max(...events.map(e=>e.time+BOMB_FLAME_MS),0)+PLAYER_MOVE_INTERVAL;
  const step=PLAYER_MOVE_INTERVAL;
  const steps=Math.ceil(end/step);
  let positions=new Set([player.y*COLS+player.x]);
  const offsets=[[0,0],[0,-1],[0,1],[-1,0],[1,0]];
  for(let i=0;i<steps;i++) {
    const from=i*step,to=(i+1)*step;
    const next=new Set();
    for(const pos of positions){
      const ox=pos%COLS, oy=Math.floor(pos/COLS);
      for(const [dx,dy] of offsets){
        const x=ox+dx,y=oy+dy;
        if(x<0||y<0||x>=COLS||y>=ROWS||map[y][x]!==0)continue;
        // Bombs block future entry, but their original occupant can depart.
        if((x!==ox || y!==oy) && all.some((b,j)=>b.x===x &&
           b.y===y && from<=events[j].time+BOMB_FLAME_MS))continue;
        if(isTileDangerDuring(x,y,from,to,events))continue;
        next.add(y*COLS+x);
      }
    }
    if(!next.size)return false;
    positions=next;
  }
  return positions.size>0;
}

// Only the second half of the stationary corner combination can use the
// otherwise banned outermost row/column. No hostile bomb and an early anchor
// are required, and the resulting timeline must eliminate all currently
// available escape routes (as opposed to just showing pressure).
function v72CornerClosureCandidate(x,y,proposedBomb) {
  const corner=v72StationaryCorner();
  if(!corner || bombs.length!==1 || bombs[0].owner!=='enemy')return false;
  const anchor=bombs[0];
  if(2000-anchor.timer>730 || anchor.timer<1190)return false;
  const same=(p,q)=>p.x===q.x&&p.y===q.y;
  const paired=(same(anchor,corner.horizontal)&&same({x,y},corner.vertical)) ||
    (same(anchor,corner.vertical)&&same({x,y},corner.horizontal));
  if(!paired || !getBlastCells(proposedBomb).some(([px,py])=>
       px===player.x&&py===player.y))return false;
  return !v72PlayerHasSurvivalRoute(proposedBomb);
}

// Preserve the setup after planting the first bomb. Otherwise the normal
// escape planner runs away from its own blast and never visits the opposite
// corridor. Route length <=6, hazard checked at EACH future step. Subsequent
// steps must still be fully survivable under the existing bombs.
function v72CornerCapturePlan(events) {
  const corner=v72StationaryCorner();
  if(!corner || bombs.length!==1 || bombs[0].owner!=='enemy')return null;
  const anchor=bombs[0];
  const same=(p,q)=>p.x===q.x&&p.y===q.y;
  const target=same(anchor,corner.horizontal) ? corner.vertical :
    same(anchor,corner.vertical) ? corner.horizontal : null;
  if(!target || anchor.timer<1190)return null;
  const queue=[{x:enemy.x,y:enemy.y,first:null,dist:0}];
  const visited=new Set([`${enemy.x},${enemy.y}`]);
  let found=null;
  for(let index=0;index<queue.length;index++) {
    const cur=queue[index];
    if(cur.x===target.x&&cur.y===target.y){found=cur;break;}
    if(cur.dist>=6)continue;
    for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){
      const x=cur.x+dx,y=cur.y+dy,key=`${x},${y}`;
      if(visited.has(key) || !enemyCanMove(x,y,events,cur.dist+1))continue;
      visited.add(key);
      queue.push({x,y,first:cur.first||{x,y},dist:cur.dist+1});
    }
  }
  if(!found || 2000-anchor.timer+found.dist*ENEMY_STEP_MS>730)return null;
  if(found.first) {
    // Avoid mutating the persistent escape goal while probing a setup step.
    const saved=enemyEscapeGoal;
    const safe=findTimedSafeStep(found.first.x,found.first.y,null,null,1);
    enemyEscapeGoal=saved;
    if(!safe)return null;
  }
  return {target,first:found.first,dist:found.dist,remaining:anchor.timer};
}

// v74: Connect the two stationary-corner bombs at their intersection.
// The third bomb is a RELAY: the earlier flame ignites it and it can ignite
// the later second bomb. This is worthwhile only if it genuinely shortens
// the second fuse, and only when a full AI survival route exists.
function v74CornerRelayCandidate(x,y,proposedBomb) {
  const corner=v72StationaryCorner();
  if(!corner || bombs.length!==2 || bombs.some(b=>b.owner!=='enemy'))return false;
  const cross={x:corner.horizontal.x,y:corner.vertical.y};
  if(x!==cross.x||y!==cross.y || map[y][x]!==0)return false;
  const same=(b,a)=>b.x===a.x&&b.y===a.y;
  if(!bombs.some(b=>same(b,corner.horizontal)) ||
     !bombs.some(b=>same(b,corner.vertical)))return false;
  const remaining=Math.min(...bombs.map(b=>b.timer));
  if(remaining<830 || remaining>1600)return false;
  const before=getTimedBombEvents();
  const after=getTimedBombEvents(proposedBomb);
  // No bonus if the two bombs already detonate together without a relay.
  const acceleration=Math.max(...bombs.map((b,i)=>before[i].time-after[i].time));
  return acceleration>=250 && after[after.length-1].time>=800;
}

function v74CornerRelayPlan(events) {
  const corner=v72StationaryCorner();
  if(!corner || bombs.length!==2 || bombs.some(b=>b.owner!=='enemy'))return null;
  if(!bombs.some(b=>b.x===corner.horizontal.x&&b.y===corner.horizontal.y) ||
     !bombs.some(b=>b.x===corner.vertical.x&&b.y===corner.vertical.y))return null;
  const target={x:corner.horizontal.x,y:corner.vertical.y};
  const remaining=Math.min(...bombs.map(b=>b.timer));
  if(remaining<880||remaining>1700)return null;
  const queue=[{x:enemy.x,y:enemy.y,first:null,dist:0}];
  const seen=new Set([`${enemy.x},${enemy.y}`]);
  let found=null;
  for(let k=0;k<queue.length;k++){
    const cur=queue[k];
    if(cur.x===target.x&&cur.y===target.y){found=cur;break;}
    if(cur.dist>=3)continue;
    for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){
      const x=cur.x+dx,y=cur.y+dy,key=`${x},${y}`;
      if(seen.has(key)||!enemyCanMove(x,y,events,cur.dist+1))continue;
      seen.add(key);queue.push({x,y,first:cur.first||{x,y},dist:cur.dist+1});
    }
  }
  if(!found || remaining-found.dist*ENEMY_STEP_MS<800)return null;
  if(found.first){
    const oldGoal=enemyEscapeGoal;
    const safe=findTimedSafeStep(found.first.x,found.first.y,null,null,1);
    enemyEscapeGoal=oldGoal;
    if(!safe)return null;
  }
  return {first:found.first,target,remaining};
}

// v24: プレイヤーの勝ち筋を模倣する「段階的な出口封鎖」。
// リプレイでは相手の2～4マス付近に爆弾を置き、200～600ms程度で
// 隣の縦横レーンへ移動して次の爆弾を追加する攻めが多かった。
// 既存の自分の爆弾が脅かしていない退路を、次の爆弾が新たに塞ぐ場合に加点。
// 導火線・連鎖爆発・自分の退路の判断は evaluateEnemyBombSpot が別途検証する。
function getEnemyLayeredAttackScore(newBomb, blastCells = null, playerOptions = null) {
  const anchors=bombs.filter(b=>b.owner==='enemy' && b.timer>650);
  if (!anchors.length) return 0;
  const toKey=(x,y)=>`${x},${y}`;
  const newBlast=new Set((blastCells||getBlastCells(newBomb)).map(([x,y])=>toKey(x,y)));
  const options=playerOptions||getPlayerReachableCells(3);
  let best=0;
  for(const anchor of anchors){
    const separation=Math.abs(newBomb.x-anchor.x)+Math.abs(newBomb.y-anchor.y);
    // 重複爆弾ではなく、プレイヤーが使うような段差のある配置を探す。
    if(separation<2 || separation>6)continue;
    const oldBlast=new Set(getBlastCells(anchor).map(([x,y])=>toKey(x,y)));
    let newlyClosed=0, escapeClosure=0, stillOpen=0;
    for(const p of options){
      if(p.depth>3)continue;
      const key=toKey(p.x,p.y);
      const oldHit=oldBlast.has(key),newHit=newBlast.has(key);
      if(newHit&&!oldHit) newlyClosed += p.depth===0?3.5:p.depth===1?2.5:p.depth===2?1.4:0.55;
      if(!newHit&&!oldHit&&p.depth<=2)stillOpen++;
    }
    for(const [dx,dy] of [[0,1],[0,-1],[1,0],[-1,0]]){
      const x=player.x+dx,y=player.y+dy;
      if(x<0||y<0||x>=COLS||y>=ROWS||map[y][x]!==0)continue;
      if(bombs.some(b=>b.x===x&&b.y===y))continue;
      const key=toKey(x,y);
      if(newBlast.has(key)&&!oldBlast.has(key))escapeClosure++;
    }
    // 横並びの2発で縦の退路を、縦並びなら横の退路を塞ぐ。
    const offsetGood=(newBomb.x!==anchor.x&&newBomb.y!==anchor.y) ? 3 : 1.5;
    const spacingGood=separation>=2&&separation<=4 ? 3:0;
    const novel=Math.min(22,newlyClosed*1.5+escapeClosure*6+offsetGood+spacingGood);
    // 次の爆弾が無関係なら、ただの連続設置を高評価しない。
    if(newlyClosed<2 && escapeClosure===0)continue;
    const remaining=anchor.timer;
    const urgency=remaining<950?0.55:remaining<1250?0.78:1;
    // 既存爆弾と新規爆弾が完全に重なる場合の加点を抑える。
    const score=urgency*novel - (stillOpen===0?2:0);
    best=Math.max(best,score);
  }
  return Math.round(best*10)/10;
}


// v61: Human-match examples repeatedly use 2-3 tile spacing followed by a
// perpendicular turn (an L-shaped volley). This is a light look-ahead for
// ATTACK SELECTION, not a license to place the hypothetical follow-up bomb.
// A real placement must still pass the complete timed survival test.
function getV61VolleySetupPotential(first, blastCells=null, options=null) {
  if (bombs.length || !player.alive) return 0;
  const firstCells=new Set((blastCells||getBlastCells(first))
    .map(([x,y])=>`${x},${y}`));
  const reach=options||getPlayerReachableCells(3);
  if (!reach.length) return 0;
  // Only reward an opening with useful pressure against the ACTUAL target.
  const primaryHits=reach.filter(p=>p.depth<=2 && firstCells.has(`${p.x},${p.y}`));
  if(primaryHits.length<2)return 0;
  let best=0;
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
    for(const length of [2,3]) {
      const x=first.x+dx*length,y=first.y+dy*length;
      if(x<1||y<1||x>=COLS-1||y>=ROWS-1||map[y][x]!==0)continue;
      if(Math.abs(player.x-x)+Math.abs(player.y-y)>6)continue;
      const blast=getBlastCells({x,y,range:8});
      const followCells=new Set(blast.map(([xx,yy])=>`${xx},${yy}`));
      let novel=0, newExits=0;
      for(const p of reach) {
        if (p.depth>3) continue;
        const key=`${p.x},${p.y}`;
        if(followCells.has(key)&&!firstCells.has(key))
          novel+=p.depth===0?3.5:p.depth===1?2.5:p.depth===2?1.4:0.5;
      }
      for(const [ex,ey] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const xx=player.x+ex, yy=player.y+ey;
        if(xx>=1&&yy>=1&&xx<COLS-1&&yy<ROWS-1&&map[yy][xx]===0 &&
           followCells.has(`${xx},${yy}`)&&!firstCells.has(`${xx},${yy}`))newExits++;
      }
      if(newExits>0 && novel>=2)best=Math.max(best,Math.min(12,novel*0.43+newExits*2.5));
    }
  }
  return Math.round(best*10)/10;
}

// v64: Tactical *ranking* based on the escape corridor an opponent has
// already restricted with their OWN bombs. A new enemy bomb may close the
// remaining open lane and form a crossfire. This is only a cheap local
// opportunity heuristic; placement must still pass the original full timed
// escape planner and every bomb-chain/trap guard.
// Uses a shared blast cache from v62; no second path-finding/search is added.
function makeV64CounterContext() {
  if (!player.alive) return null;
  const relevant=bombs.filter(b=>b.owner==='player' && b.timer>900 &&
    Math.abs(b.x-player.x)+Math.abs(b.y-player.y)<=5);
  if(!relevant.length)return null;
  const hostileBlast=new Set();
  for(const b of relevant)
    for(const [x,y] of getBlastCells(b)) hostileBlast.add(y*COLS+x);
  const lanes=[];
  let priorBlocked=0;
  for(const [dx,dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
    const x=player.x+dx,y=player.y+dy;
    if(x<1||y<1||x>=COLS-1||y>=ROWS-1||map[y][x]!==0)continue;
    const occupied=relevant.some(b=>b.x===x&&b.y===y);
    const blocked=occupied||hostileBlast.has(y*COLS+x);
    if(blocked)priorBlocked++;
    lanes.push({x,y,blocked});
  }
  return priorBlocked ? {lanes,priorBlocked} : null;
}
function getV64CounterTrapScore(newBomb, blastCells = null, context = undefined) {
  // All candidates in one tactical search share the same player and bombs.
  // Passing one precomputed context avoids re-scanning bomb blast cells for
  // every candidate and adds no pathfinding or time-expanded searches.
  const c=context===undefined ? makeV64CounterContext() : context;
  if(!c)return 0;
  const blast=blastCells||getBlastCells(newBomb);
  let newlyBlocked=0,remaining=0;
  for(const lane of c.lanes){
    if(lane.blocked)continue;
    if((lane.x===newBomb.x&&lane.y===newBomb.y) ||
       blast.some(([x,y])=>x===lane.x&&y===lane.y))newlyBlocked++;
    else remaining++;
  }
  if(!newlyBlocked)return 0;
  const direct=blast.some(([x,y])=>x===player.x&&y===player.y);
  const score=6+2*c.priorBlocked+3*newlyBlocked+
    (remaining===0?4:remaining===1?2:0)+(direct?2:0);
  return Math.min(20,score);
}

let v14LastBombReject = 'unknown';
function v14BombReject(reason) {v14LastBombReject=reason;return null;}
function evaluateEnemyBombSpot(x, y, playerOptions = null, precomputed = null) {
  v14LastBombReject='not_checked';
  const v14OwnBombCount=bombs.filter(b=>b.owner==='enemy').length;
  const v14Followup=v14OwnBombCount>=2; // 3発目以降のみ緩和
  const v16Pressure=precomputed?.v16Pressure || null;

  const distance = Math.abs(player.x - x) + Math.abs(player.y - y);
  if (distance > 6 || (player.x === x && player.y === y)) return v14BombReject('position_out_of_range');
  if (bombs.some(b => b.x === x && b.y === y)) return v14BombReject('tile_occupied');
  const proposedBomb = { x, y, timer: 2000, range: 8, owner: "enemy" };
  // v63: The tactical search has already scored this exact position with
  // the unchanged player/bomb state. Reuse those values during the costly
  // legality check instead of evaluating pressure/layering/denial twice.
  const blast = precomputed ? precomputed.trialBlast : getBlastCells(proposedBomb);
  const options = playerOptions || getPlayerReachableCells(3);
  const offense = precomputed ? precomputed.offense :
    getEnemyOffenseOpportunity(proposedBomb,blast,options);
  const v56Denial=precomputed ? precomputed.denied :
    getV56EscapeDenial(proposedBomb,blast);
  const {pressure, hitNow} = offense;
  const layeredAttack=precomputed ? precomputed.layered :
    getEnemyLayeredAttackScore(proposedBomb,blast,options);
  const counterTrap=precomputed && precomputed.counterTrap!==undefined ?
    precomputed.counterTrap : getV64CounterTrapScore(proposedBomb,blast);
  const supportedCounter=counterTrap>=13/AI_ATTACK_TUNING.counter && pressure>=3;
  const supportedLaneCut=offense.laneCut>=9/AI_ATTACK_TUNING.laneCut && offense.leadHits>=2 && pressure>=3;
  const supportedInterdiction=isV68Interdiction(offense) &&
    bombs.filter(b=>b.owner==='player').length<=1;
  const v72CornerClosure=v72CornerClosureCandidate(x,y,proposedBomb);
  const v74CornerRelay=v74CornerRelayCandidate(x,y,proposedBomb);
  const v72VerifiedCounter=!!(precomputed && precomputed.v72CounterShot &&
    bombs.filter(b=>b.owner==='player').length<=5 &&
    hitNow && pressure>=9 && offense.threatenedExits>=1 && distance<=5);
  const v71StrongDirect=hitNow && pressure>=11 &&
    offense.threatenedExits>=2 && distance<=5 &&
    bombs.filter(b=>b.owner==='player').length<=4 && bombs.length<=5;
  // A direct counter that removes a genuine human exit can be worth the
  // planting turn even when existing hostile bombs make it uncomfortable.
  // This ONLY bypasses heuristic score thresholds, not timed survival.
  const hostileCount=bombs.filter(b=>b.owner==='player').length;
  const v74AssaultShot=hostileCount<=5 && distance<=5 &&
    ((hitNow && pressure>=8 && offense.threatenedExits>=1) ||
     (pressure>=9 && offense.threatenedExits>=2) ||
     (offense.leadHits>=3 && pressure>=8 && offense.leadExitPressure>=1));
  // Only the purpose-built v69 late-ambush selector may request this exception.
  // It must prove novel coverage, a single friendly anchor and full survival.
  const lateSurprise=!!(precomputed && precomputed.v69LateSurprise &&
    bombs.length===1 && bombs[0].owner==='enemy' &&
    bombs[0].timer>=760 && bombs[0].timer<=1050 &&
    getBlastCells(bombs[0]).some(([bx,by])=>bx===x&&by===y));
// 【試験版：連撃制限を段階的に解除】爆弾の数に関係なく攻撃判定を優先。
  // これらは「攻撃候補の優先フラグ」であり、爆風・誘爆の生存確認は後段で継続する。
  const linkedOwnBomb = bombs.some(b=>b.owner==='enemy' && b.timer<1750 &&
    (blast.some(([bx,by])=>bx===b.x&&by===b.y) ||
      getBlastCells(b).some(([bx,by])=>bx===x&&by===y)));
  const ownAnchors = bombs.filter(b=>b.owner==='enemy');
  const v74NovelShot = v74AttackValue(x,y,offense,blast,options);
  const isFreshChain = ownAnchors.length>=1 && ownAnchors.some(b=>b.timer>=1550);

  // ユーザー指定：3発目・4発目も含め、連撃候補を常に許可。
  const v74OffsetVolley = true;
  const controlledCrossfire = true;
  // linkedOwnBomb による従来の設置拒否は解除。
  // escapeDiagnostics はこの後に計算されるため、ここでは参照しない。
  // 実際に生存可能な退路がない場合は後段の findTimedSafeStep が拒否する。

  // ユーザー指定：盤面に残る自分の爆弾が多いほど攻撃評価を加算する。
  offense.score += 35 + ownAnchors.length*15;
  if (precomputed) {
    precomputed.priority = (Number.isFinite(precomputed.priority) ?
      precomputed.priority : 0) + 60 + ownAnchors.length*20;
  }
  // 直撃コース以外でも、複数の退路を塞ぐときは戦術的に設置可能。
  if (pressure < 5/AI_ATTACK_TUNING.aggression && !(offense.threatenedExits>=2 && pressure>=3) &&
      !(offense.leadHits>=3 && offense.leadExitPressure>=2 && pressure>=3) &&
      !(layeredAttack>=12 && pressure>=3) && !supportedCounter && !supportedLaneCut &&
      !supportedInterdiction && !v74AssaultShot && !v74OffsetVolley && !v74CornerRelay) return v14BombReject('pressure_low');
  // v19: ただ爆風を広げるだけで相手の動きを制限しない弱い爆弾は
  // 自分の退路と攻撃手番を浪費する。次の攻撃位置へ移るほうがよい。
  // v41: Low-value diagonal/lead-only shots are not worth giving the
  // opponent an 8-tile chain-reaction anchor. Two v40 losses planted
  // speculative 6-point attacks while every immediate exit remained open.
  // Retain meaningful layered attacks and the direct shot against a camper.
  // v43: a moving opponent can exploit a speculative diagonal shot as
  // a chain-reaction anchor while our 200ms planting turn is spent.
  // Keep strong layered shots and direct pressure against stationary campers.
  if (!hitNow && offense.score<12/AI_ATTACK_TUNING.aggression &&
      offense.threatenedExits<2 && layeredAttack<13 && !supportedCounter && !supportedLaneCut &&
      !supportedInterdiction && !v74AssaultShot && !v74OffsetVolley && !v74CornerRelay) return v14BombReject('weak_attack');
  if (!hitNow && (playerDirX!==0 || playerDirY!==0) &&
      offense.score<20/AI_ATTACK_TUNING.aggression && offense.pressure<=5 && offense.leadHits<=2 &&
      offense.threatenedExits<=1 && layeredAttack<13 && !supportedCounter && !supportedLaneCut &&
      !supportedInterdiction && !v74AssaultShot && !v74OffsetVolley && !v74CornerRelay) return v14BombReject('moving_target_low_value');
  // A bomb already on the board gives the fast player an immediate way to
  // seal our own retreat. Only spend another turn planting when the shot
  // substantially restricts their options; otherwise reposition and wait
  // for a better opportunity. The high-value counterattack remains intact.
  const v73TwoExitPressure=offense.threatenedExits>=2 &&
    offense.pressure>=8 && distance<=5 &&
    bombs.filter(b=>b.owner==='player').length<=5;
  if (bombs.some(b=>b.owner==='player') && distance<=5 &&
      offense.score<36/AI_ATTACK_TUNING.aggression && offense.safeExits>=1 &&
      offense.leadExitPressure<=1 && layeredAttack<13 && !supportedCounter && !supportedLaneCut &&
      !supportedInterdiction && !v71StrongDirect && !v72VerifiedCounter &&
      !v73TwoExitPressure && !v74AssaultShot && !v74OffsetVolley && !v74CornerRelay) return v14BombReject('hostile_bomb_risk');
  // v44: Do not add a low-pressure bomb into an already multi-bomb
  // opponent volley. Our 200ms planting turn gives the faster player
  // enough time to close the only remaining lane, especially when the
  // new shot does not meaningfully predict or shut any escape route.
  // Keep high-leverage and layered counterattacks, including the
  // stationary-opponent opener, intact.
  const livePlayerBombCount=bombs.filter(b=>b.owner==='player').length;
  if(livePlayerBombCount>=2 && distance<=6 && layeredAttack<13 &&
      offense.score<44/AI_ATTACK_TUNING.aggression && offense.leadHits<=2 &&
      offense.leadExitPressure<=1 && offense.threatenedExits<=2 && !supportedCounter && !supportedLaneCut &&
      !v71StrongDirect && !v72VerifiedCounter && !v73TwoExitPressure) return v14BombReject('multi_hostile_bomb_risk');
  // v11: 一本道での設置は禁止。上下一方向ずつでも一つの通路に封鎖される。
  if (enemyEscapeMobility(x,y,proposedBomb) < (v14Followup?2:3))
    return v14BombReject('no_neighbor_routes');
  // v30: 端で先に爆弾を置くと自分の移動レーンが塞がれる。
  // 相手は新しい爆弾を200msのAI手番の間に置けるため、
  // 余裕があるときは先に中央寄りの安全な攻撃位置へ進む。
  const border=Math.min(x-1,COLS-2-x,y-1,ROWS-2-y);
  // v37: a motionless opponent can camp in the start corner forever if
  // border bomb sites are all forbidden. Permit only a *direct* shot at a
  // vulnerable edge player with no existing bombs, strong pressure, and
  // enough immediate exits. Full delayed-survival / robust-exit checks below
  // still decide whether the actual installation is legal.
  const safeEdgeOpening=bombs.length===0 && hitNow && pressure>=10 &&
    distance<=4 && offense.safeExits<=1 &&
    enemyEscapeMobility(x,y,proposedBomb)>=3;
  if(border===0 && distance<=6 && !safeEdgeOpening && !v72CornerClosure &&
      !(v14Followup && (hitNow || offense.threatenedExits>=1)))
    return v14BombReject('border_site');
  // v38: When a fast-moving opponent is RUNNING DOWN OUR CURRENT ROW
  // from 5-6 squares away, planting now spends an entire 200ms turn and
  // supplies them with an 8-tile chain anchor. First close the gap or
  // move to a better attack lane. A stationary opponent (v37 fix) must
  // still be attacked immediately, and counter-bombs are not affected.
  // v40: Extend the v38 charging-player safeguard to FOUR squares.
  // The v39 losses at 14:00:16 and 14:01:24 placed at a four-tile
  // charging distance. With both opponents taking 120ms turns,
  // that bomb can become a chain-reaction anchor before retreat is complete.
  // Only defer the opening shot; stationary targets and active-bomb
  // counterattacks retain their existing behavior and safety checks.
  const opponentCharging = bombs.length===0 && hitNow && distance>=4 &&
    ((player.y===y && (x-player.x)*playerDirX>0) ||
     (player.x===x && (y-player.y)*playerDirY>0));
  if(opponentCharging) return v14BombReject('charging_opponent');
  // v41: A fast-moving player who JUST entered our bomb column/row from
  // the SIDE can immediately place a bomb there and move away before our
  // next 200ms turn. A close two-tile shot in this situation often becomes
  // a self-trapping chain anchor rather than an offensive opportunity.
  // Only defer the opening bomb: bombs already in play are still handled
  // by the existing counterattack and full-timeline survival checks.
  const opponentCrossingBlastLane = bombs.length===0 && hitNow && distance<=3 &&
    ((player.x===x && player.y!==y && playerDirX!==0) ||
     (player.y===y && player.x!==x && playerDirY!==0));
  if(opponentCrossingBlastLane) return v14BombReject('opponent_crossing_blast_lane');
  // v17: 設置手番では移動できない。連鎖誘爆や既存火炎に
  // 200ms以内で巻き込まれるなら、たとえ長期退路があっても設置しない。
  const initialBombEvents=getTimedBombEvents(proposedBomb);
  if(isTileDangerDuring(x,y,0,ENEMY_STEP_MS+45,initialBombEvents))
    return v14BombReject('blast_before_next_tick');
  // 直近のプレイヤー置き爆弾が残存爆弾に誘爆すると、設置後の
  // 1手目が封鎖される。安全な反撃に見えても早期誘爆する候補は避ける。
  if(enemyBombChainAmbush(proposedBomb) && !v16Pressure) return v14BombReject('predicted_human_chain_ambush');
  // v23: 自分の爆弾が既存の爆弾に巻き込まれ、実質的な導火線が
  // 1.65秒を下回る場合、追加設置した瞬間に逃げ遅れやすい。
  // 相手は120msごとに移動・追加設置できるため、急な連鎖攻撃は控える。
  const proposedExplosion=initialBombEvents[initialBombEvents.length-1].time;
  const rapidChain=bombs.length>0 && distance<=6 && proposedExplosion<1650;
  // v24: 過去のプレイヤーの2～4マス間隔の置き爆弾を模倣。
  // ただし1.15秒未満で誘爆する配置や、爆弾が密集する混戦は見送る。
  if(rapidChain && !lateSurprise && !v74CornerRelay &&
      (v16Pressure ? (proposedExplosion<480) :
        v14Followup ? (proposedExplosion<950 ||
        (bombs.filter(b=>b.owner==='player').length>=2 && layeredAttack<14)) :
        (layeredAttack<14 || proposedExplosion<1150 ||
         bombs.filter(b=>b.owner!=='enemy').length>=2)))
    return v14BombReject('chain_too_fast');
  const escapeDiagnostics = {};
  // v16: 爆弾を置いたAIはその手番では移動しない。次の200msまで
  // そのマスに留まる条件で退避経路を調べる（即時移動を仮定しない）。
  const escape = findTimedSafeStep(x, y, proposedBomb, escapeDiagnostics, 1,
    v16Pressure ? ENEMY_STEP_MS : ENEMY_PATH_STEP_MS, initialBombEvents);
  if (!escape) return v14BombReject('full_escape_route_missing');
  const exits = (escapeDiagnostics.viableFirstSteps || []).filter(p => p.x !== x || p.y !== y);
  if (exits.length < (v14Followup?1:2)) return v14BombReject('immediate_exits_insufficient');
  // v12: 必ずしも全出口が安全とは限らない。敵に近い狭路のみなら爆弾を控える。
  // 現在のプレイヤー位置と爆弾配置から、出口が一つしかない逃走先を調べる。
  const escapeBombs = [...bombs, proposedBomb];
  const robustExits = exits.filter(p => {
    const open=[];
    for (const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]) {
      const xx=p.x+dx,yy=p.y+dy;
      if (xx<0||yy<0||xx>=COLS||yy>=ROWS||map[yy][xx]!==0) continue;
      if (escapeBombs.some(b=>b.x===xx&&b.y===yy)) continue;
      open.push({x:xx,y:yy});
    }
    if (open.length!==1) return open.length>=2;
    const only=open[0];
    return Math.abs(player.x-only.x)+Math.abs(player.y-only.y)>3;
  });
  if (robustExits.length===0) return v14BombReject('robust_exit_missing');
  // v15: 端・角で出口1本しか残らない爆弾は、追加設置で封鎖されやすい。
  // プレイヤーが遠く、退路が十分広ければ従来どおり許可する。
  const siteRisk = getEnemyPositionRisk(x,y).score;
  if (robustExits.length<2 && !v14Followup &&
      (distance<=5 || siteRisk>=5 || bombs.length>=2))
    return v14BombReject('two_robust_exits_required');
  // 現在安全でも、プレイヤーが近づいて爆弾を置いた時に退路が消えるか評価する。
  const trapRisk = getEnemyPlayerTrapRisk(x,y,escapeBombs);
  if (trapRisk >= (v14Followup?18:24) && robustExits.length < (v14Followup?2:3))
    return v14BombReject('human_countertrap_risk');
  // 段階攻撃中も生存可能な退路を2本以上確保し、封鎖されやすい場所を避ける。
  if (layeredAttack>=12 && bombs.length>=2 &&
      (trapRisk>=(v14Followup?18:16) || robustExits.length<(v14Followup?1:2)))
    return v14BombReject('layered_crossfire_risk');
  // A brief intentional wait can be safe with a long fuse; keep it only
  // when the first two movement ticks are clear and two exits remain.
  // true に固定した攻撃フラグだけで、全ての初手に連鎖専用の制限を掛けない。
  if(linkedOwnBomb && (
      (v14Followup?robustExits.length<1:robustExits.length<2) ||
      trapRisk>(v14Followup?15:10) ||
      proposedExplosion<(v16Pressure?480:v14Followup?950:1550) ||
      isTileDangerDuring(x,y,0,ENEMY_STEP_MS*2+45,initialBombEvents)))
    return v14BombReject('linked_bomb_risk');
  if(rapidChain && !lateSurprise && !v74CornerRelay &&
     (robustExits.length<(v14Followup?1:2) || trapRisk>=(v14Followup?18:14) ||
      (distance<=2 && robustExits.length<(v14Followup?2:3) &&
       proposedExplosion<(v16Pressure?620:v14Followup?1000:1400))))
   return v14BombReject('rapid_chain_risk');
  // A v69 surprise deliberately shortens the new bomb's fuse by chain
  // reaction. It retains the original multi-exit check and disallows waiting.
  if (lateSurprise && (proposedExplosion<760 || proposedExplosion>1050 ||
      robustExits.length<2 || exits.length<2 || trapRisk>10 ||
      (escape.x===x && escape.y===y))) return v14BombReject('late_surprise_risk');
  if(v72VerifiedCounter && (robustExits.length<3 || trapRisk>11 ||
       proposedExplosion<1300))return v14BombReject('verified_counter_risk');
  if(v73TwoExitPressure && livePlayerBombCount>=2 &&
     (robustExits.length<3 || trapRisk>11 || proposedExplosion<1250))
    return v14BombReject('multi_hostile_counter_risk');
  if(v74AssaultShot && hostileCount>=2 &&
     (robustExits.length<2 || trapRisk>12 || proposedExplosion<1300))return v14BombReject('assault_vs_hostile_bombs');
  // Never make a previously legal controlled crossfire fail solely because
  // it ALSO qualifies for the new offset-shot score.
  if(v74OffsetVolley && !controlledCrossfire && !v72CornerClosure && !v74CornerRelay &&
     (robustExits.length<2 || trapRisk>11 || proposedExplosion<1250 ||
      (linkedOwnBomb && robustExits.length<3)))return v14BombReject('offset_volley_risk');
  if(v74CornerRelay && (proposedExplosion<800 || robustExits.length<2 ||
     trapRisk>12 || (escape.x===x&&escape.y===y)))return v14BombReject('corner_relay_risk');
  return { proposedBomb, pressure, hitNow, escape, exits: exits.length,
    robustExitCount:robustExits.length, trapRisk, offense, layeredAttack, v56Denial,
    counterTrap, controlledCrossfire, v74OffsetVolley,
    realLinkedOwnBomb:linkedOwnBomb, ownAnchorCount:ownAnchors.length,
    v74NovelExitCount:v74NovelShot.novel,
    v69LateSurprise:lateSurprise,v16Pressure,
    v72CornerClosure, v72VerifiedCounter, v74CornerRelay };
}

function placeEnemyBomb(precheckedEvaluation = null) {
  if (gameOver || !enemy.alive || enemyBombCooldown > 0) return false;
  if (bombs.filter(b=>b.owner==='enemy').length>=8){
    replayLog('ai_v14_bomb_rejected',{reason:'active_bomb_cap',ownBombs:8});
    return false;
  }
  const evaluation=precheckedEvaluation || evaluateEnemyBombSpot(enemy.x,enemy.y);
  if(!evaluation){
    const own=bombs.filter(b=>b.owner==='enemy').length;
    if(own>=2) replayLog('ai_v14_bomb_rejected',{
      at:{x:enemy.x,y:enemy.y},ownBombs:own,
      reason:v14LastBombReject,player:{x:player.x,y:player.y},
      cooldownMs:enemyBombCooldown});
    return false;
  }
  const newBomb = { ...evaluation.proposedBomb, replayId: ++replayBombId };
  bombs.push(newBomb);
  if(evaluation.v74CornerRelay) replayLog('ai_v74_corner_relay',{
    at:{x:newBomb.x,y:newBomb.y},player:{x:player.x,y:player.y},
    robustExits:evaluation.robustExitCount});
  if(evaluation.v72VerifiedCounter) replayLog('ai_v72_verified_counter',{
    at:{x:newBomb.x,y:newBomb.y},pressure:evaluation.pressure,
    robustExits:evaluation.robustExitCount,trapRisk:evaluation.trapRisk});
  if(evaluation.v72CornerClosure) replayLog('ai_v72_corner_closure',{
    at:{x:newBomb.x,y:newBomb.y},player:{x:player.x,y:player.y},
    robustExits:evaluation.robustExitCount,anchorRemainingMs:
      bombs.find(b=>b!==newBomb&&b.owner==='enemy')?.timer||0});
  if(evaluation.counterTrap>=13) {
    replayLog('ai_v64_counter_trap', {
      at:{x:newBomb.x,y:newBomb.y},score:evaluation.counterTrap,
      offense:evaluation.offense.score,robustExits:evaluation.robustExitCount
    });
  }
  if(evaluation.controlledCrossfire && evaluation.realLinkedOwnBomb) {
    replayLog('ai_v56_crossfire',{
      at:{x:newBomb.x,y:newBomb.y},layeredAttack:evaluation.layeredAttack});
    replayLog('ai_v61_human_volley',{
      at:{x:newBomb.x,y:newBomb.y},layeredAttack:evaluation.layeredAttack,
      robustExits:evaluation.robustExitCount});
  }
  if(isV68Interdiction(evaluation.offense)) {
    replayLog('ai_v68_interdiction', {
      at:{x:newBomb.x,y:newBomb.y},
      heading:{dx:playerDirX,dy:playerDirY,streak:playerHeadingStreak},
      projectedDepth:evaluation.offense.interdictionDepth,
      lateralExitsCovered:evaluation.offense.interdictionLateral,
      score:evaluation.offense.interdiction,
      robustExits:evaluation.robustExitCount
    });
  }
  if(evaluation.v74OffsetVolley && evaluation.ownAnchorCount>0) {
    replayLog('ai_v74_offset_volley',{
      at:{x:newBomb.x,y:newBomb.y},player:{x:player.x,y:player.y},
      newlyCoveredExits:evaluation.v74NovelExitCount,
      robustExits:evaluation.robustExitCount});
  }
  if(evaluation.v16Pressure){
    replayLog('ai_v16_human_pressure_chain',{at:{x:newBomb.x,y:newBomb.y},
      ...evaluation.v16Pressure,escape:{x:evaluation.escape.x,y:evaluation.escape.y}});
  }
  if(evaluation.v69LateSurprise) {
    lastV69SurpriseAt=replayClock;
    replayLog('ai_v69_late_chain',{
      at:{x:newBomb.x,y:newBomb.y},
      anchorRemainingMs:Math.round(bombs.find(b=>b!==newBomb&&b.owner==='enemy')?.timer||0),
      escape:{x:evaluation.escape.x,y:evaluation.escape.y},
      robustExits:evaluation.robustExitCount,
      trapRisk:evaluation.trapRisk});
  }
  replayLog("bomb_placed", { id:newBomb.replayId, owner:"enemy", x:newBomb.x,
    y:newBomb.y, timer:newBomb.timer, range:newBomb.range,
    pressure:evaluation.pressure, escape:evaluation.escape,
    safeExitCount:evaluation.exits, robustExitCount:evaluation.robustExitCount,
    trapRisk:evaluation.trapRisk,offense:evaluation.offense,
    counterTrap:evaluation.counterTrap||0,
    v69LateSurprise:!!evaluation.v69LateSurprise,
    v16HumanPressure:!!evaluation.v16Pressure,
    v72CornerClosure:!!evaluation.v72CornerClosure,
    v72VerifiedCounter:!!evaluation.v72VerifiedCounter,
    v74CornerRelay:!!evaluation.v74CornerRelay,
    layeredAttack:evaluation.layeredAttack||0, v56Denial:evaluation.v56Denial||null,
    positionRisk:getEnemyPositionRisk(newBomb.x,newBomb.y) });
  replaySnapshot("bomb_placed");
  enemyEscapeTarget = null;
  enemyEscapeGoal = null;
  enemyBombCooldown = 100;
  return true;
}

function explode(bomb) {
  const cells = [[bomb.x, bomb.y]];
  const directions = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  for (const [dx, dy] of directions) {
    for (let i = 1; i <= bomb.range; i++) {
      const x = bomb.x + dx * i;
      const y = bomb.y + dy * i;

      // 固い壁は爆風を遮る
      if (map[y][x] === 1) break;

      cells.push([x, y]);

      // 壊せる壁は破壊して、その先には爆風を通さない
      if (map[y][x] === 2) {
        map[y][x] = 0;
        break;
      }
    }
  }

  replayLog("bomb_exploded", { id: bomb.replayId, owner: bomb.owner || "player", x: bomb.x, y: bomb.y, cells });
  flames.push({
    cells,
    timer: 600,
    owner: bomb.owner || 'player',
    bombId: bomb.replayId
  });

  // 爆風が届いた爆弾を連鎖爆発させる
  for (const other of bombs) {
    if (
      other !== bomb &&
      cells.some(([x, y]) => x === other.x && y === other.y)
    ) {
      other.timer = 0;
    }
  }
}



// 爆弾の連鎖爆発を含む、相対的な爆発時刻と爆風範囲を作る。
function getTimedBombEvents(extraBomb = null) {
  const cacheKey=!extraBomb && v17TimelineCache ? v17BombFieldKey() : null;
  if(cacheKey!==null && v17TimelineCache.has(cacheKey))
    return v17TimelineCache.get(cacheKey);
  const allBombs=extraBomb?[...bombs,extraBomb]:bombs;
  const n=allBombs.length;
  const cells=allBombs.map(b=>getBlastCells(b));
  const times=allBombs.map(b=>Math.max(0,b.timer||0));
  // 壁・爆弾位置が同じなら爆風の接続関係は一定。1回だけ作る。
  const links=cells.map((area,i)=>{
    const occupied=new Set(area.map(([x,y])=>y*COLS+x));
    const linked=[];
    for(let j=0;j<n;j++)if(j!==i && occupied.has(allBombs[j].y*COLS+allBombs[j].x))
      linked.push(j);
    return linked;
  });
  // 既存処理と同じく早い爆発時刻が伝播するまで緩和する。
  let changed=true,passes=0;
  while(changed && passes++<n+2){
    changed=false;
    for(let i=0;i<n;i++)for(const j of links[i]){
      if(times[j]>times[i]){times[j]=times[i];changed=true;}
    }
  }
  const events=allBombs.map((b,i)=>({time:times[i],cells:cells[i]}));
  if(cacheKey!==null)v17TimelineCache.set(cacheKey,events);
  return events;
}

function isTileDangerDuring(x, y, fromMs, toMs, events) {
  // すでに発生している爆風が残る時間も考慮する。
  for (const flame of flames) {
    if (flame.timer > fromMs && flame.cells.some(([fx, fy]) => fx === x && fy === y)) {
      return true;
    }
  }

  for (const event of events) {
    const blastEnds = event.time + BOMB_FLAME_MS;
    if (event.time <= toMs && blastEnds >= fromMs &&
        event.cells.some(([bx, by]) => bx === x && by === y)) {
      return true;
    }
  }
  return false;
}

// v7: 時刻を考慮した移動可否。爆弾から離れた後は同じマスへ戻れない。
function timedWalkable(x, y, t, startX, startY, extraBomb, leftStart) {
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS || map[y][x] !== 0) return false;
  if (player.alive && player.x === x && player.y === y) return false;
  for (const bomb of (extraBomb ? [...bombs, extraBomb] : bombs)) {
    if (bomb.x !== x || bomb.y !== y) continue;
    // 設置直後の自分のマスだけは、まだ離れていなければ滞在できる。
    if (x === startX && y === startY && !leftStart) continue;
    // 爆弾が消えるまでは進入不可（連鎖爆発時刻を含む）。
    if (t < bomb._effectiveTime + BOMB_FLAME_MS) return false;
  }
  return true;
}

// v13: 危険な一方向通路・外周に追い込まれにくくするための
// 「周囲の退路の広さ」の指標。マスを通行禁止にはせず、候補間の優先度のみ変える。
// 固い壁・爆弾・プレイヤーの占有を織り込んだ2手先までの到達可能マス数を数える。
function getEnemyPositionRisk(x, y, bombList = bombs) {
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS || map[y][x] !== 0)
    return { score: 100, edgeDistance: 0, openArea: 0, exits: 0 };
  const blocked = (cx, cy) =>
    cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS || map[cy][cx] !== 0 ||
    bombList.some(b => b.x === cx && b.y === cy) ||
    (player.alive && player.x === cx && player.y === cy);
  const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
  const seen = new Set([`${x},${y}`]);
  let layer = [{x,y}], exits = 0;
  for (let depth = 1; depth <= 2; depth++) {
    const next = [];
    for (const pos of layer) {
      for (const [dx,dy] of dirs) {
        const nx=pos.x+dx, ny=pos.y+dy, key=`${nx},${ny}`;
        if (blocked(nx,ny) || seen.has(key)) continue;
        if (depth === 1) exits++;
        seen.add(key);
        next.push({x:nx,y:ny});
      }
    }
    layer = next;
  }
  const edgeDistance = Math.min(x-1, COLS-2-x, y-1, ROWS-2-y);
  // 外周は逃げ切るために必要な場合もあるため、あくまでソフトなペナルティ。
  const edgeCost = edgeDistance === 0 ? 7 : edgeDistance === 1 ? 2.5 : 0;
  const opennessCost = seen.size <= 4 ? 13 : seen.size <= 6 ? 7 :
                       seen.size <= 8 ? 3 : 0;
  const exitCost = exits <= 1 ? 8 : exits === 2 ? 2 : 0;
  const playerDistance = Math.abs(x-player.x)+Math.abs(y-player.y);
  // 近距離の一本道は1手先の爆弾で入口を封鎖されやすい。
  const blockadeCost = exits <= 2 && playerDistance <= 4 ? 5 : 0;
  return { score: edgeCost + opennessCost + exitCost + blockadeCost,
           edgeDistance, openArea: seen.size, exits };
}

// v15: 相手が現在地から1～2歩で爆弾を置ける位置を仮定し、
// 自分のマスと隣接する退路が同時に塞がれるリスクを推定する。
// 確定していない未来なので通行禁止にはせず、候補の優先順位だけ変える。
function getEnemyPlayerTrapRisk(x,y,bombList=bombs,options=null) {
  if (!player.alive) return 0;
  const possible = options || getPlayerReachableCells(2);
  const directions=[[0,-1],[0,1],[-1,0],[1,0]];
  const freeExits = directions.map(([dx,dy])=>({x:x+dx,y:y+dy}))
    .filter(p=>p.x>=0&&p.y>=0&&p.x<COLS&&p.y<ROWS&&map[p.y][p.x]===0&&
      !bombList.some(b=>b.x===p.x&&b.y===p.y));
  let greatest=0;
  for (const possibleBomb of possible) {
    if (bombList.some(b=>b.x===possibleBomb.x&&b.y===possibleBomb.y)) continue;
    const coverage=v17BlastSet(possibleBomb.x,possibleBomb.y);
    const tileHit=coverage.has(`${x},${y}`);
    const survivingExits=freeExits.filter(p=>!coverage.has(`${p.x},${p.y}`));
    // 爆弾の列にいること自体は避けられるが、出口を失うと危険が急増する。
    let danger=(tileHit ? 5 : 0) +
      (tileHit && survivingExits.length===0 ? 16 :
       tileHit && survivingExits.length===1 ? 9 : 0) +
      (freeExits.length<=1 ? 6 : freeExits.length===2 ? 2 : 0);
    // プレイヤーの爆弾は他の爆弾を誘爆させる。既存爆弾の爆風が
    // このマスへ届くなら、地形的には逃走不能の可能性が高い。
    if (bombList.some(b=>coverage.has(`${b.x},${b.y}`)&&
        getBlastCells(b).some(([bx,by])=>bx===x&&by===y))) danger+=5;
    if (!tileHit && survivingExits.length>=2) danger=0;
    const stepWeight=possibleBomb.depth===0?1:possibleBomb.depth===1?0.80:
      possibleBomb.depth===2?0.50:possibleBomb.depth===3?0.30:0.17;
    greatest=Math.max(greatest,danger*stepWeight);
  }
  const proximity=Math.abs(x-player.x)+Math.abs(y-player.y);
  if (proximity<=2 && freeExits.length<=2) greatest+=5;
  return Math.round(greatest*10)/10;
}

// v19: 爆弾連打を受けたときに「相手側の一本道」へ入り込むのを防ぐ。
// プレイヤーは120msで動けるため、直後の爆弾を一本の通路へ置かれると
// 200msごとのAIでは封鎖に対応できない。実際の爆弾の時刻を上書きせず
// 移動候補の優先度に限って反映する。
function getEnemyCorridorRisk(x,y,bombList=bombs) {
  if (x<1 || y<1 || x>=COLS-1 || y>=ROWS-1 || map[y][x]!==0) return 80;
  const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
  const exits=[];
  for(const [dx,dy] of dirs) {
    const nx=x+dx,ny=y+dy;
    if(nx<1||ny<1||nx>=COLS-1||ny>=ROWS-1||map[ny][nx]!==0)continue;
    if(bombList.some(b=>b.x===nx&&b.y===ny))continue;
    if(player.alive&&player.x===nx&&player.y===ny)continue;
    exits.push({dx,dy,x:nx,y:ny});
  }
  const d=Math.abs(x-player.x)+Math.abs(y-player.y);
  if(exits.length===0) return 60;
  if(exits.length===1) return d<=5?32:12;
  const straight=exits.length===2&&
    (exits[0].dx===-exits[1].dx&&exits[0].dy===-exits[1].dy);
  let risk=straight?(d<=4?17:d<=7?8:3):exits.length===2?(d<=3?7:2):0;
  if(straight&&bombList.length>0&&d<=5)risk+=7;
  // 爆風が通る一列の通路に入ると、次の置き爆弾で出口を失いやすい。
  if((x===player.x||y===player.y)&&d<=5&&exits.length<=2)risk+=7;
  return risk;
}

// v29: 相手が隣の平行通路を爆弾で順番に塞いでくる局面を評価する。
// まだ存在しない爆弾でマスを閉鎖せず、逃走先の優先度だけを変更する。
let aiShadowRiskCache=null;
// v17: 両陣営の爆弾配置が変わったらキーも変わる、1思考内専用メモ。
let v17ReachCache=null;
let v17TimelineCache=null;
let v17TrapBlastCache=null;
let v17PressureCache=null;
function v17BombFieldKey(){
  return bombs.map(b=>`${b.x},${b.y},${b.timer},${b.range},${b.owner}`).join(';');
}
function v17ClearCaches(){
  v17ReachCache=null;
  v17TimelineCache=null;
  v17TrapBlastCache=null;
  v17PressureCache=null;
}
function v17BlastSet(x,y){
  if(!v17TrapBlastCache)return new Set(getBlastCells({x,y,range:8}).map(q=>`${q[0]},${q[1]}`));
  const key=x*ROWS+y;
  if(!v17TrapBlastCache.has(key))v17TrapBlastCache.set(key,
    new Set(getBlastCells({x,y,range:8}).map(q=>`${q[0]},${q[1]}`)));
  return v17TrapBlastCache.get(key);
}

function getEnemyShadowBombRisk(x,y,bombList=bombs) {
  if(!player.alive || bombList.length===0) return 0;
  // v63: Risk depends on this tile and the CURRENT bomb field. Cache only
  // inside one AI decision and only when the default live list is used.
  const riskKey=aiShadowRiskCache && bombList===bombs ? y*COLS+x : null;
  if(riskKey!==null && aiShadowRiskCache.has(riskKey))
    return aiShadowRiskCache.get(riskKey);
  const dist=Math.abs(x-player.x)+Math.abs(y-player.y);
  if(dist>9) return 0;
  const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
  const possible=[{x:player.x,y:player.y,depth:0}];
  const front={x:player.x+playerDirX,y:player.y+playerDirY};
  let step=front;
  for(let depth=1;depth<=3 && (playerDirX||playerDirY);depth++) {
    if(step.x<1||step.y<1||step.x>=COLS-1||step.y>=ROWS-1||
       map[step.y][step.x]!==0 ||
       bombList.some(b=>b.x===step.x&&b.y===step.y)) break;
    possible.push({x:step.x,y:step.y,depth});
    step={x:step.x+playerDirX,y:step.y+playerDirY};
  }
  const exits=dirs.map(([dx,dy])=>({x:x+dx,y:y+dy}))
    .filter(p=>p.x>=1&&p.y>=1&&p.x<COLS-1&&p.y<ROWS-1&&
      map[p.y][p.x]===0&&!bombList.some(b=>b.x===p.x&&b.y===p.y));
  let risk=0;
  for(const p of possible) {
    const blast=v17BlastSet(p.x,p.y);
    const hit=blast.has(`${x},${y}`);
    const exitHit=exits.filter(q=>blast.has(`${q.x},${q.y}`)).length;
    const remaining=exits.length-exitHit;
    const pressure=(hit?7:0)+(remaining===0?17:remaining===1?9:0)+
      (hit&&exits.length<=2?6:0);
    const weight=p.depth===0?0.35:p.depth===1?0.8:p.depth===2?0.7:0.45;
    risk=Math.max(risk,pressure*weight);
  }
  // 平行に進む相手からは2～4マス離れていても長射程爆弾で出口が閉じる。
  const parallelY=Math.abs(x-player.x)>=2&&Math.abs(x-player.x)<=4&&
    Math.abs(y-player.y)<=4&&playerDirY!==0;
  const parallelX=Math.abs(y-player.y)>=2&&Math.abs(y-player.y)<=4&&
    Math.abs(x-player.x)<=4&&playerDirX!==0;
  if(parallelY||parallelX) risk+=4;
  // A two-step bomb stagger is hardest to survive in a straight corridor.
  // Penalize crossing the same corridor as the current player or the
  // next likely planting tile, especially if a timer is already running.
  const earliest=Math.min(...bombList.map(b=>b.timer));
  if(earliest<1600 && dist<=7 && exits.length<=2 &&
     possible.some(p=>p.depth>=1&&p.depth<=2&&
       ((x===p.x&&Math.abs(y-p.y)<=5)||
        (y===p.y&&Math.abs(x-p.x)<=5)))) risk+=
          earliest<900?13:earliest<1300?10:6;
  // Opponent staggered bombing: two bombs may cover opposite ends of a
  // straight two-exit corridor, even if neither bomb has been planted yet.
  // Only estimate this in tight spaces within three player moves.
  if(dist<=7 && exits.length<=2 && bombList.some(b=>b.owner==='player')) {
    const reach=getPlayerReachableCells(3);
    const possiblePlanted=reach.filter(p=>p.depth<=3 &&
      !bombList.some(b=>b.x===p.x&&b.y===p.y));
    const candidateBlasts=possiblePlanted.map(p=>({depth:p.depth,x:p.x,y:p.y,
      cells:v17BlastSet(p.x,p.y)}));
    let stage=0;
    for(const a of candidateBlasts) {
      if(a.depth>2)continue;
      const hitA=a.cells.has(`${x},${y}`);
      const coveredA=exits.filter(p=>a.cells.has(`${p.x},${p.y}`)).length;
      if(!hitA && !coveredA)continue;
      for(const b of candidateBlasts) {
        if(b.x===a.x&&b.y===a.y || b.depth<a.depth || b.depth>a.depth+2)continue;
        if(Math.abs(a.x-b.x)+Math.abs(a.y-b.y)>3)continue;
        const blocked=exits.filter(p=>a.cells.has(`${p.x},${p.y}`)||
          b.cells.has(`${p.x},${p.y}`)).length;
        const hitB=b.cells.has(`${x},${y}`);
        if(blocked===exits.length && (hitA||hitB))
          stage=Math.max(stage, (hitA&&hitB?15:11) -a.depth*2-b.depth);
      }
    }
    risk+=Math.max(0,stage);
  }
  const rounded=Math.round(risk*10)/10;
  if(riskKey!==null)aiShadowRiskCache.set(riskKey,rounded);
  return rounded;
}

// v9: 時間展開探索。爆風の発生時刻と600msの持続時間を
// 「到着時点」ではなく「そのマスに滞在する全期間」で判定する。
// 初手は現在のAI更新内で即時移動し、2手目以降は200ms間隔。
let enemyEscapeGoal = null;
let enemyLastPosition = null;
// v18: Preserve the actual full-timeline first-step result across later
// pursuit heuristics. These hints expire after each AI tick.
let v18StrategicSafety = null;
let v18ThreatSafety = null;
// A short-lived guard against walking straight back into the just-escaped lane.
let v18RetreatMemory = null;

function findTimedSafeStep(startX, startY, extraBomb = null, diagnostics = null, initialDelaySteps = 0, searchStepMs = ENEMY_PATH_STEP_MS, preparedEvents = null) {
  // v62: Reuse a previously calculated chain-reaction timeline when the
  // caller already evaluated the exact same proposed bomb.
  const events = preparedEvents || getTimedBombEvents(extraBomb);
  // 設置直後は次のAI手番までその場に残る。これを生き延びられない
  // 場所には、たとえ「今すぐ逃げれば安全」でも爆弾を設置しない。
  if (initialDelaySteps > 0 && isTileDangerDuring(startX, startY, 0,
       initialDelaySteps*searchStepMs+35, events)) return null;
  const allBombs = extraBomb ? [...bombs, extraBomb] : [...bombs];
  const lastDanger = Math.max(0, ...events.map(e => e.time + BOMB_FLAME_MS),
                              ...flames.map(f => f.timer));
  const horizon = Math.min(30, Math.max(2, Math.ceil(lastDanger / searchStepMs) + 2));
  const directions = [[0,-1],[0,1],[-1,0],[1,0],[0,0]];
  const rejected = { wall:0, player:0, bomb:0, flame:0, futureBlast:0 };
  const intersects = (a,b,c,d) => a < d && c < b;

  // v12: 逃走先が一本出口の通路で、相手がその出口を先に塞げるなら危険。
  // これは「現在ある爆弾を全部避けられる」だけの探索では評価できなかった。
  // 爆弾・壁に挟まれた通路の出口を、相手が次の数手で塞ぐ危険を評価する。
  const exposureCache = new Map();
  const positionCache = new Map();
  const shadowCache = new Map();
  const shadowRisk=(x,y)=>{
    if(extraBomb) return 0;
    const key=`${x},${y}`;
    if(!shadowCache.has(key))shadowCache.set(key,getEnemyShadowBombRisk(x,y,allBombs));
    return shadowCache.get(key);
  };
  const playerFutureOptions = getPlayerReachableCells(4);
  const trapCache = new Map();
  const futureTrapRisk = (x,y) => {
    const key=`${x},${y}`;
    if (!trapCache.has(key))
      trapCache.set(key,getEnemyPlayerTrapRisk(x,y,allBombs,playerFutureOptions));
    return trapCache.get(key);
  };
  const positionRisk = (x,y) => {
    const key = `${x},${y}`;
    if (!positionCache.has(key))
      positionCache.set(key, getEnemyPositionRisk(x,y,allBombs));
    return positionCache.get(key);
  };
  function playerBlockadeRisk(x,y) {
    const key = `${x},${y}`;
    if (exposureCache.has(key)) return exposureCache.get(key);
    const exits=[];
    for (const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]) {
      const nx=x+dx,ny=y+dy;
      if (nx<0||ny<0||nx>=COLS||ny>=ROWS||map[ny][nx]!==0) continue;
      if (allBombs.some(b=>b.x===nx&&b.y===ny)) continue;
      exits.push({x:nx,y:ny});
    }
    let risk=0;
    if (exits.length===0) risk=90;
    else if (exits.length===1) {
      const exit=exits[0];
      const d=Math.abs(player.x-exit.x)+Math.abs(player.y-exit.y);
      // 隣のマスをプレイヤーが占拠すると、実質的に逃げ道が消える。
      risk=d<=1?70:d===2?45:d===3?24:d===4?10:0;
    } else if (exits.length===2) {
      const close=exits.filter(p=>Math.abs(player.x-p.x)+Math.abs(player.y-p.y)<=2).length;
      risk=close===2?14:0;
    }
    exposureCache.set(key,risk);
    return risk;
  }
  // v62: Build the same hazard intervals once per search instead of scanning
  // every bomb blast on every edge of the time-expanded graph. The flame check
  // stays before future blasts, preserving the original rejection reason.
  const tileCount=COLS*ROWS;
  const hazardIntervals=Array.from({length:tileCount},()=>[]);
  const flameUntil=new Float64Array(tileCount);
  const bombUntil=new Float64Array(tileCount);
  for(const flame of flames) for(const [x,y] of flame.cells) {
    const tile=y*COLS+x;
    if(flame.timer>flameUntil[tile])flameUntil[tile]=flame.timer;
  }
  for(const ev of events)for(const [x,y] of ev.cells)
    hazardIntervals[y*COLS+x].push([ev.time,ev.time+BOMB_FLAME_MS]);
  for(let i=0;i<allBombs.length;i++){
    const b=allBombs[i],tile=b.y*COLS+b.x;
    bombUntil[tile]=Math.max(bombUntil[tile],events[i].time+BOMB_FLAME_MS);
  }
  // Each (tile, decision-step) has exactly the same arrival/departure window.
  // 0=unchecked, 1=safe, 2=existing flame, 3=future blast.
  const dangerAtStep=Array.from({length:horizon+1},()=>new Uint8Array(tileCount));
  const hazardAt=(x,y,currentStep) => {
    const tile=y*COLS+x;
    const cached=dangerAtStep[currentStep][tile];
    if(cached)return cached;
    const from=currentStep===initialDelaySteps ? 0 :
      Math.max(0,currentStep*searchStepMs-35);
    const to=(currentStep+1)*searchStepMs+35;
    let result=1;
    if(flameUntil[tile]>from) result=2;
    else for(const [start,end] of hazardIntervals[tile]){
      if(intersects(from,to,start,end)){result=3;break;}
    }
    dangerAtStep[currentStep][tile]=result;
    return result;
  };
  // Terminal-location penalties are independent of the route into the cell.
  // Thousands of surviving paths frequently share the same destination.
  const terminalPenaltyCache=new Float64Array(tileCount);
  const terminalPenaltyKnown=new Uint8Array(tileCount);
  const terminalPenalty=(x,y)=>{
    const tile=y*COLS+x;
    if(terminalPenaltyKnown[tile])return terminalPenaltyCache[tile];
    const distanceFromPlayer=Math.abs(x-player.x)+Math.abs(y-player.y);
    const destinationMobility=enemyEscapeMobility(x,y);
    const preferred=enemyEscapeGoal&&distanceFromPlayer>=5&&
      x===enemyEscapeGoal.x&&y===enemyEscapeGoal.y ? -3 : 0;
    const proximityCost=Math.max(0,6-distanceFromPlayer)*1.5;
    const trapCost=Math.max(0,3-destinationMobility)*3;
    const followupTrap=extraBomb?0:futureTrapRisk(x,y)*
      (distanceFromPlayer<=7?1.35:0.45);
    const lineCost=(x===player.x||y===player.y)?1.5:0;
    const shadowCost=extraBomb?0:shadowRisk(x,y)*
      (distanceFromPlayer<=7?1.15:0.30);
    const positionPenalty=positionRisk(x,y).score*1.6;
    const corridorPenalty=extraBomb?0:getEnemyCorridorRisk(x,y,allBombs)*0.65;
    const outerEdgePenalty=!extraBomb&&allBombs.length>=2&&
      Math.abs(x-player.x)+Math.abs(y-player.y)<=9&&
      positionRisk(x,y).edgeDistance===0 ? 28 :
      (!extraBomb&&distanceFromPlayer<=7&&
       positionRisk(x,y).edgeDistance===0 ? 12 : 0);
    const value=preferred+proximityCost+trapCost+lineCost+
      positionPenalty+corridorPenalty+outerEdgePenalty+followupTrap+
      shadowCost+(Math.abs(x-startX)+Math.abs(y-startY))*0.02;
    terminalPenaltyKnown[tile]=1;
    terminalPenaltyCache[tile]=value;
    return value;
  };
  const queue = [{x:startX,y:startY,step:initialDelaySteps,first:null,left:false,
                  previous:null,cost:0}];
  // v62: Encode (time,tile,left-start,direction) into a dense numeric slot.
  // This preserves the original state identity and cost comparison without
  // allocating thousands of concatenated strings and Map entries.
  const bestKnownCost=new Float64Array((horizon+1)*tileCount*2*5);
  bestKnownCost.fill(Infinity);
  let head=0, best=null, survivors=0;
  let partialBest=null;
  const survivingFirst = new Map();
  while (head < queue.length) {
    const cur=queue[head++];
    // If no route survives the entire known bomb sequence, preserve the most
    // promising shorter route for emergency movement (never for bomb approval).
    if(!extraBomb && cur.first && cur.step>initialDelaySteps) {
      if(!partialBest || cur.step>partialBest.step ||
         (cur.step===partialBest.step && cur.cost<partialBest.cost)) {
        partialBest={step:cur.step,first:cur.first,cost:cur.cost};
      }
    }
    if (cur.step >= horizon) {
      survivors++;
      const score=cur.cost+terminalPenalty(cur.x,cur.y);
      if (!best || score < best.score) best={first:cur.first,goal:{x:cur.x,y:cur.y},score};
      if (cur.first) survivingFirst.set(`${cur.first.x},${cur.first.y}`,cur.first);
      continue;
    }
    for (let dirIndex=0;dirIndex<directions.length;dirIndex++) {
      const [dx,dy]=directions[dirIndex];
      const x=cur.x+dx,y=cur.y+dy;
      const step=cur.step+1;
      // 実フレームの揺れで爆発が次回判断より先に起こるため、
      // 到着/滞在の前後35msも危険区間に含める。
      const arrival = cur.step===initialDelaySteps ? 0 : Math.max(0,cur.step*searchStepMs-35);
      const departure = step*searchStepMs+35;
      if (x<0||y<0||x>=COLS||y>=ROWS||map[y][x]!==0) { rejected.wall++; continue; }
      if (player.alive&&player.x===x&&player.y===y) { rejected.player++; continue; }
      const left=cur.left||x!==startX||y!==startY;
      // Exploded bombs become walkable only after their flame has ended.
      if ((x!==startX||y!==startY||left) && arrival<bombUntil[y*COLS+x]) {
        rejected.bomb++; continue;
      }
      const hazard=hazardAt(x,y,cur.step);
      if (hazard!==1) {
        rejected[hazard===2?'flame':'futureBlast']++;
        continue;
      }
      // v10: 初手が待機の場合も初手として保持する。
      // v9は「待機→移動」の後の移動を今すぐ実行してしまった。
      const first=cur.step===initialDelaySteps ? {x,y} : cur.first;
      const backtrack=cur.previous&&x===cur.previous.x&&y===cur.previous.y;
      const initialBacktrack=cur.step===initialDelaySteps&&enemyLastPosition&&
        x===enemyLastPosition.x&&y===enemyLastPosition.y;
      // v27: The player tends to lay staggered bombs along the escape column.
      // Direction reversal wastes a 200ms turn and lets the new bomb close both exits.
      // A reversal is still allowed whenever it is the only viable survival route.
      const reversedIntoPressure=initialBacktrack && !extraBomb &&
        Math.abs(player.x-x)+Math.abs(player.y-y)<=7 && allBombs.length>0;
      const distanceBefore=Math.abs(cur.x-player.x)+Math.abs(cur.y-player.y);
      const distanceAfter=Math.abs(x-player.x)+Math.abs(y-player.y);
      // 最初の逃走方向を決める際は、封鎖される危険を最重視する。
      // あとからできる爆弾を完全予知するのではなく、既知の相手位置から
      // 出口を塞がれやすい細道を避けるためのリスクペナルティ。
      const nearPlayerPenalty=cur.step===initialDelaySteps
        ? (distanceAfter<distanceBefore?10:distanceAfter>distanceBefore?-4:0)
        : cur.step<3 && distanceAfter<distanceBefore?2:0;
      const chokepointPenalty=cur.step===initialDelaySteps
        ? playerBlockadeRisk(x,y)
        : cur.step<3 ? playerBlockadeRisk(x,y)*0.15 : 0;
      // 自分の爆弾の上に長居すると、プレイヤーの追加設置に退路を奪われる。
      const plantedBombWait=cur.step===0&&dx===0&&dy===0&&
        allBombs.some(b=>b.x===startX&&b.y===startY)?22:0;
      const positionPenalty=cur.step===initialDelaySteps ? positionRisk(x,y).score * 0.55 :
        cur.step<3 ? positionRisk(x,y).score * 0.12 : 0;
      // v14: 既知の爆弾だけなら安全でも、待ち続ける間にプレイヤーが
      // 新しい爆弾を置いて塞ぐ。特に近距離では200ms待機ごとにコストを加える。
      // 待機が唯一の生存経路の場合は探索から削除せず残す。
      const waitPenalty=dx===0&&dy===0&&allBombs.length>0 ?
        (distanceAfter<=5 ? (extraBomb?3.2:5.5) : 1.1) +
        (!extraBomb && cur.step===initialDelaySteps && distanceAfter<=7 ? 28 : 0) +
        (positionRisk(x,y).exits<=2 ? 2.5 : 0) : 0;
      // 逃走開始時は、まだ置かれていない爆弾による封鎖のされやすさも重視。
      // 既知爆弾から逃げる唯一の道は残せるようソフトペナルティに留める。
      const futureTrapPenalty=extraBomb ? 0 : cur.step===initialDelaySteps ?
        futureTrapRisk(x,y)*1.15 : cur.step<5 ? futureTrapRisk(x,y)*0.20 : 0;
      // 敵が次の爆弾を置く前に出口の狭い通路から離れる。
      const corridorPenalty=extraBomb?0:cur.step===initialDelaySteps
        ? getEnemyCorridorRisk(x,y,allBombs)*0.60
        : cur.step<3 ? getEnemyCorridorRisk(x,y,allBombs)*0.10 : 0;
      // An enemy trapped along the right/left wall has almost no way to
      // counter a player who can move and plant bombs between AI ticks.
      // v28: a 120ms opponent can close a perimeter escape lane before
      // the next AI turn. Prefer room to turn when both paths survive.
      const perimeterPenalty=!extraBomb && cur.step===initialDelaySteps &&
        distanceAfter<=8 && allBombs.length>=2 &&
        positionRisk(x,y).edgeDistance===0 ? 31 :
        (!extraBomb && cur.step===initialDelaySteps && distanceAfter<=7 &&
         positionRisk(x,y).edgeDistance===0 ? 16 : 0);
      const earlyEdgeCost=!extraBomb && allBombs.length>=2 && cur.step<5 &&
        distanceAfter<=8 && positionRisk(x,y).edgeDistance===0 ? 5 : 0;
      const shadowCost=!extraBomb && allBombs.length>=1 && distanceAfter<=8 &&
        cur.step===initialDelaySteps ? shadowRisk(x,y)*1.35 :
        !extraBomb && cur.step<4 ? shadowRisk(x,y)*0.12 : 0;
      const cost=cur.cost+(dx||dy?1:0)+(backtrack?6:0)+
        (initialBacktrack?(reversedIntoPressure?21:4):0)
        +nearPlayerPenalty+chokepointPenalty+plantedBombWait+positionPenalty+
        waitPenalty+futureTrapPenalty+corridorPenalty+perimeterPenalty+earlyEdgeCost+shadowCost;
      const stateId=(((step*tileCount+y*COLS+x)*2+(left?1:0))*5+dirIndex);
      if (bestKnownCost[stateId]<=cost) continue;
      bestKnownCost[stateId]=cost;
      queue.push({x,y,step,first,left,previous:{x:cur.x,y:cur.y},cost});
    }
  }
  if (diagnostics) Object.assign(diagnostics, {
    horizonSteps:horizon, lastDangerMs:Math.round(lastDanger),
    exploredStates:queue.length, survivors, rejected,
    chosenGoal:best?best.goal:null,
    firstAction:best?best.first:null,
    partialFirstAction:!best&&partialBest?partialBest.first:null,
    partialSurvivalSteps:!best&&partialBest?partialBest.step:0,
    blockadeRisk:best&&best.first?playerBlockadeRisk(best.first.x,best.first.y):null,
    futureTrapRisk:best&&best.first?futureTrapRisk(best.first.x,best.first.y):null,
    corridorRisk:best&&best.first?getEnemyCorridorRisk(best.first.x,best.first.y,allBombs):null,
    escapeGoalPositionRisk:best?positionRisk(best.goal.x,best.goal.y):null,
    viableFirstSteps:[...survivingFirst.values()],
    firstActionIsWait:!!best&&best.first.x===startX&&best.first.y===startY
  });
  if (best && !extraBomb) enemyEscapeGoal=best.goal;
  return best?best.first:null;
}

// v30: 時間差攻撃への備え。相手が次の120～360msで置ける爆弾が
// 既存の爆弾から誘爆するケースをシミュレートする。
// 実在しない爆弾を確定情報として扱わず、既知の爆弾から生存する候補の
// 順序だけを見直す。前方の連鎖が起こりそうなときだけ重い探索を追加する。

// v47: The first deep-search pass deliberately uses a conservative 200ms
// quantum to keep the normal 120ms game responsive. When it reports no
