  lastObservedPlayerPos=now;
}

// v68: Only trust the opponent's heading if movement is recent and
// repeated. A stopped player must not be projected forever in the last
// direction pressed. Predict at most three tiles, not a guaranteed path.
function getRecentPlayerHeading() {
  const age=matchClock-lastPlayerMoveAt;
  return playerHeadingStreak>=2 && age>=0 && age<=390 &&
    (playerDirX!==0 || playerDirY!==0) ?
    {dx:playerDirX,dy:playerDirY,streak:playerHeadingStreak,age} : null;
}
function isV68Interdiction(offense) {
  // Safety rules in evaluateEnemyBombSpot remain authoritative.
  return offense.interdiction>=13 && offense.leadHits>=2 &&
    offense.pressure>=3;
}

// v74: Measure an attack by exits denied, not bombs planted. Existing friendly
// blast lines count as set-up: a new bomb is useful when it blocks DIFFERENT
// exits. This is a cheap positional approximation; it does not claim a kill.
function v74AttackValue(x,y,offense=null,blast=null,playerOptions=null) {
  if(!player.alive)return {value:0,novel:0,blocked:0};
  const proposed={x,y,range:8};
  const shot=blast||getBlastCells(proposed);
  const hit=new Set(shot.map(([px,py])=>`${px},${py}`));
  const old=new Set();
  for(const b of bombs.filter(b=>b.owner==='enemy'))
    for(const [bx,by] of getBlastCells(b))old.add(`${bx},${by}`);
  let blocked=0,novel=0;
  for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]) {
    const xx=player.x+dx,yy=player.y+dy;
    if(xx<1||yy<1||xx>=COLS-1||yy>=ROWS-1 || map[yy][xx]!==0 ||
       bombs.some(b=>b.x===xx&&b.y===yy))continue;
    if(hit.has(`${xx},${yy}`)){
      blocked++;
      if(!old.has(`${xx},${yy}`))novel++;
    }
  }
  const o=offense||getEnemyOffenseOpportunity(proposed,shot,playerOptions);
  const distance=Math.abs(x-player.x)+Math.abs(y-player.y);
  const value=novel*12+blocked*5+o.pressure*1.6+
    o.leadHits*1.7+o.interdiction*0.45+
    (o.hitNow?9:0) -Math.max(0,distance-5)*3;
  return {value,novel,blocked};
}

// v74: In a hostile volley choose an attack-producing *safe first step*
// rather than endlessly retreating. Actual bomb placement remains subject
// to the full delayed time-expanded escape checker in evaluateEnemyBombSpot.
// Verify only the strongest prospective step to limit CPU cost.
function findV74AssaultStep(events, fallback=null, options=null) {
  if(!player.alive || !enemy.alive || enemyBombCooldown>900)return null;
  const hostile=bombs.filter(b=>b.owner==='player').length;
  if(hostile>6 || bombs.length>9)return null;
  const from={x:enemy.x,y:enemy.y};
  const distance=Math.abs(from.x-player.x)+Math.abs(from.y-player.y);
  if(distance<3 || distance>9)return null;
  const nearest=Math.min(Infinity,...events.map(e=>e.time));
  if(nearest<680)return null;
  const risk=getEnemyPositionRisk(from.x,from.y);
  const playerOptions=getPlayerReachableCells(3);
  const baseline=v74AttackValue(from.x,from.y,null,null,playerOptions).value;
  const viable=options||[[0,-1],[0,1],[-1,0],[1,0]].map(([dx,dy])=>
    ({x:from.x+dx,y:from.y+dy}));
  const ranked=[];
  for(const p of viable) {
    if(p.x===from.x&&p.y===from.y)continue;
    const d=Math.abs(p.x-player.x)+Math.abs(p.y-player.y);
    if(d>=distance || !enemyCanMove(p.x,p.y,events,1) ||
       isTileDangerDuring(p.x,p.y,0,ENEMY_STEP_MS*2+45,events))continue;
    const freedom=getEnemyPositionRisk(p.x,p.y);
    if(freedom.exits<2 || freedom.score>risk.score+5 ||
       (freedom.edgeDistance===0 && risk.edgeDistance>0))continue;
    const trap=getEnemyPlayerTrapRisk(p.x,p.y);
    if(trap>17)continue;
    const shadow=getEnemyShadowBombRisk(p.x,p.y);
    if(shadow>24)continue;
    const plan=v74AttackValue(p.x,p.y,null,null,playerOptions);
    const reversal=enemyLastPosition && p.x===enemyLastPosition.x &&
      p.y===enemyLastPosition.y?12:0;
    const score=plan.value-baseline+18*(distance-d) -
      Math.max(0,trap-5)*1.1-freedom.score*1.1-shadow*0.6-reversal;
    if(score>7)ranked.push({x:p.x,y:p.y,score,pressure:plan.value,
      blocked:plan.blocked,novel:plan.novel});
  }
  if(!ranked.length)return null;
  ranked.sort((a,b)=>b.score-a.score);
  // Do not add four deep searches to every tick: probe only the best lane.
  const best=ranked[0];
  const saved=enemyEscapeGoal;
  const survival=findTimedSafeStep(best.x,best.y,null,null,1);
  enemyEscapeGoal=saved;
  if(!survival)return null;
  return best;
}

// v74: Existing friendly bombs should constrain OUR escape choice only as
// much as necessary. Among verified first actions, stay close enough to
// plant an offset follow-up rather than retreating across the whole arena.
function findV74AttackEscapeStep(chosen,diagnostics,events) {
  const friendlies=bombs.filter(b=>b.owner==='enemy');
  const hostiles=bombs.filter(b=>b.owner==='player');
  const viable=diagnostics?.viableFirstSteps||[];
  if(!chosen || !friendlies.length || friendlies.length>3 ||
     hostiles.length>2 || viable.length<2 ||
     Math.min(...events.map(e=>e.time),Infinity)<1050)return chosen;
  const distance=Math.abs(enemy.x-player.x)+Math.abs(enemy.y-player.y);
  if(distance<2||distance>8)return chosen;
  const playerOptions=getPlayerReachableCells(3);
  const value=p=>{
    const d=Math.abs(p.x-player.x)+Math.abs(p.y-player.y);
    const r=getEnemyPositionRisk(p.x,p.y);
    const ownPressure=v74AttackValue(p.x,p.y,null,null,playerOptions);
    return ownPressure.value + (distance-d)*13 + ownPressure.novel*9 -
      r.score*1.8-getEnemyPlayerTrapRisk(p.x,p.y)*1.2-
      getEnemyShadowBombRisk(p.x,p.y)*0.7-
      (enemyLastPosition&&p.x===enemyLastPosition.x&&p.y===enemyLastPosition.y?10:0);
  };
  let best=chosen,bestScore=value(chosen),old=bestScore;
  for(const p of viable){
    if(p.x===enemy.x&&p.y===enemy.y)continue;
    if(!enemyCanMove(p.x,p.y,events,1))continue;
    const r=getEnemyPositionRisk(p.x,p.y);
    if(r.exits<2 || r.score>16)continue;
    const score=value(p);
    if(score>bestScore+2){best=p;bestScore=score;}
  }
  if((best.x!==chosen.x||best.y!==chosen.y)&&bestScore>old+13){
    void 0;
    return {x:best.x,y:best.y};
  }
  return chosen;
}

// v16: プレイヤーが実際に逃げられる方向と、そのまま進む方向を
// 爆風がどの程度塞ぐか測る。予想スコアは撃破保証ではない。
// 爆弾の威力が大きいだけで、避け放題の位置を高得点にしない。
function getEnemyOffenseOpportunity(newBomb, blastCells = null, playerOptions = null) {
  const blast = blastCells || getBlastCells(newBomb);
  const cells=new Set(blast.map(([x,y])=>`${x},${y}`));
  const hitNow=cells.has(`${player.x},${player.y}`);
  const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
  const open=dirs.map(([dx,dy])=>({x:player.x+dx,y:player.y+dy}))
    .filter(p=>p.x>=0&&p.y>=0&&p.x<COLS&&p.y<ROWS&&map[p.y][p.x]===0)
    .filter(p=>!bombs.some(b=>b.x===p.x&&b.y===p.y))
    .filter(p=>p.x!==newBomb.x||p.y!==newBomb.y);
  const threatenedExits=open.filter(p=>cells.has(`${p.x},${p.y}`)).length;
  const safeExits=open.length-threatenedExits;
  const walkableExits=open.length;
  const forward={x:player.x+playerDirX,y:player.y+playerDirY};
  const forwardThreatened=(playerDirX||playerDirY) &&
    cells.has(`${forward.x},${forward.y}`) ? 1:0;
  const options=playerOptions||getPlayerReachableCells(3);
  let pressure=0;
  for(const c of options)
    if(cells.has(`${c.x},${c.y}`))
      pressure+=c.depth===0?5:c.depth===1?3:1;
  // プレイヤーの既存爆弾と交差すれば、位置取りを制約しやすい。
  const competingBombs=bombs.filter(b=>b.owner!=='enemy');
  const playerBombCoverage=competingBombs.filter(b=>
    cells.has(`${b.x},${b.y}`)).length;
  // v17: 現在位置への直撃だけではなく、移動中のプレイヤーを待ち受ける
  // 爆風のレーンも評価する。相手が曲がれば避けられるため補助点に留める。
  let leadHits=0, leadExitPressure=0, laneCut=0;
  let interdiction=0,interdictionDepth=0,interdictionLateral=0;
  const recentHeading=getRecentPlayerHeading();
  if (playerDirX || playerDirY) {
    let ahead={x:player.x,y:player.y};
    // v65: Reuse this candidate's blast set to value a *cross-lane* trap
    // along the human's actual heading. No additional path search or new
    // blast evaluation. This is a ranking estimate, never a kill guarantee.
    const sideOffsets=playerDirX ? [[0,-1],[0,1]] : [[-1,0],[1,0]];
    for (let i=1;i<=4;i++) {
      const nx=ahead.x+playerDirX,ny=ahead.y+playerDirY;
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS||map[ny][nx]!==0 ||
         bombs.some(b=>b.x===nx&&b.y===ny) ||
         (nx===newBomb.x&&ny===newBomb.y)) break;
      ahead={x:nx,y:ny};
      const hitsForward=cells.has(`${nx},${ny}`);
      if(hitsForward) leadHits += i<=2 ? 2 : 1;
      if(i<=3) {
        const exits=dirs.map(([dx,dy])=>({x:nx+dx,y:ny+dy}))
          .filter(p=>p.x>=0&&p.y>=0&&p.x<COLS&&p.y<ROWS&&map[p.y][p.x]===0);
        const hits=exits.filter(p=>cells.has(`${p.x},${p.y}`)).length;
        if(hits>=2) leadExitPressure+=1;
        let sideOpen=0,sideClosed=0;
        for(const [sx,sy] of sideOffsets) {
          const ex=nx+sx,ey=ny+sy;
          if(ex<0||ey<0||ex>=COLS||ey>=ROWS||map[ey][ex]!==0 ||
             bombs.some(b=>b.x===ex&&b.y===ey)) continue;
          sideOpen++;
          if(cells.has(`${ex},${ey}`))sideClosed++;
        }
        // Reward new blast coverage of a future sideways escape, but only
        // if the proposed blast also threatens that future corridor itself.
        if(hitsForward && sideOpen && sideClosed) {
          const locallyClosed=sideClosed===sideOpen;
          const value=(locallyClosed?6:2)+sideClosed*2+(i===1?2:i===2?1:0);
          laneCut=Math.max(laneCut,value);
        }
        // v68: A predicted path can be deterred even when it is not a
        // full lateral trap. In narrow corridors, occupying the forward
        // line forces a turn; against an approaching player the bomb can
        // protect the AI's space. Side coverage still receives priority.
        // This is a short-horizon *positioning* score, not a guaranteed hit.
        if(hitsForward && recentHeading && i<=3) {
          const approachesBomb=(newBomb.x-player.x)*playerDirX+
            (newBomb.y-player.y)*playerDirY>0;
          const denial=(i===1?9:i===2?10:6)+
            sideClosed*2+(sideOpen===0?6:sideClosed===sideOpen?3:0)+
            (recentHeading.streak>=3?2:0)+
            (approachesBomb && i<=2?3:0);
          if(denial>interdiction) {
            interdiction=denial;
            interdictionDepth=i;
            interdictionLateral=sideClosed;
          }
        }
      }
    }
  }
  const score=(hitNow?13:0)+threatenedExits*6+leadHits*2+leadExitPressure*2+
    (hitNow?Math.max(0,3-safeExits)*5:0)+forwardThreatened*5+
    (hitNow&&playerBombCoverage>0?6:0)+
    (hitNow&&walkableExits<=2?7:0)+
    (hitNow&&safeExits===0?12:0);
  return {score,pressure,hitNow,safeExits,threatenedExits,
          forwardThreatened,playerBombCoverage,leadHits,leadExitPressure,
          laneCut,interdiction,interdictionDepth,interdictionLateral};
}

// v17: 爆発を避けつつ「次に攻撃できる場所」へ逃げる。
// 時間軸探索のviableFirstStepsに限るため、避けるべき爆風を無視して
// 攻撃のために突入することはない。爆発が迫るときは従来の最安全経路を優先。
function chooseOffensiveEscapeStep(safeStep, diagnostics, events) {
  if(!safeStep || !diagnostics || !diagnostics.viableFirstSteps) return safeStep;
  const candidates=diagnostics.viableFirstSteps;
  if(candidates.length<2 || enemyBombCooldown>650) return safeStep;
  const dangerIn=events.reduce((min,event)=>
    event.cells.some(([x,y])=>x===enemy.x&&y===enemy.y)
       ? Math.min(min,event.time) : min, Infinity);
  // v20: 攻撃的な回避が最安全経路を上書きする事故を防ぐ。
  // プレイヤーは120msごとに爆弾を追加できるので、既存爆弾が
  // 1300ms以内に爆発する場合は安全経路から逸脱しない。
  const nearestBlast=events.reduce((min,event)=>Math.min(min,event.time),Infinity);
  const nearOpponent=Math.abs(enemy.x-player.x)+Math.abs(enemy.y-player.y)<=5;
  if(dangerIn<=1300 || (nearOpponent && bombs.length>=2 && nearestBlast<=1400))
    return safeStep;
  // v49: Prioritize the complete timed-survival route against a player who
  // has already laid two or more bombs. The alternative offense score only
  // evaluates *present* bomb positions; it cannot account for another bomb
  // planted 120ms later. In v48 loss replays, offensive reranking changed
  // verified escape directions while the opponent was stacking 2-4 bombs.
  // The separate proactive/staggered escape selectors still act when needed.
  if(bombs.filter(b=>b.owner==='player').length>=2) return safeStep;
  const playerOptions=getPlayerReachableCells(3);
  const manhattan=(p,q)=>Math.abs(p.x-q.x)+Math.abs(p.y-q.y);
  function score(p) {
    const distance=manhattan(p,player);
    const risk=getEnemyPositionRisk(p.x,p.y,bombs).score;
    const futureTrap=getEnemyPlayerTrapRisk(p.x,p.y,bombs,playerOptions);
    const corridorRisk=getEnemyCorridorRisk(p.x,p.y);
    const mobility=enemyEscapeMobility(p.x,p.y);
    let offenseScore=0;
    // 次の一手から狙える爆風と相手の逃げ道の圧縮を評価する。
    if(distance<=7 && distance>=2 && mobility>=3) {
      const trial={x:p.x,y:p.y,range:8};
      const off=getEnemyOffenseOpportunity(trial,null,playerOptions);
      const layered=getEnemyLayeredAttackScore(trial,null,playerOptions);
      offenseScore=off.score*0.30+off.pressure*0.37 +off.leadHits*1.2 + layered*0.9;
    }
    return offenseScore - risk*1.4 - futureTrap*0.95 - corridorRisk*0.85 -
      (distance<=2?10:0) - (distance>=7?(distance-6)*3:0) -
      (p.x===enemy.x&&p.y===enemy.y?4:0);
  }
  const oldScore=score(safeStep);
  let best={p:safeStep,score:oldScore};
  for(const p of candidates){
    if(p.x===safeStep.x&&p.y===safeStep.y)continue;
    // 自爆を避けるため、爆弾の上での攻撃待機へ上書きしない。
    if(p.x===enemy.x&&p.y===enemy.y &&
       (bombs.some(b=>b.x===enemy.x&&b.y===enemy.y) ||
        (safeStep.x!==enemy.x||safeStep.y!==enemy.y)))continue;
    if(isTileDangerDuring(p.x,p.y,0,ENEMY_STEP_MS+35,events))continue;
    // 相手から至近距離で後退先が減る移動は、単発攻撃の期待値で上書きしない。
    // 逃走探索が返した進路はそのまま利用できる。
    const d=Math.abs(p.x-player.x)+Math.abs(p.y-player.y);
    const originalDistance=Math.abs(safeStep.x-player.x)+Math.abs(safeStep.y-player.y);
    // v45: During a multi-bomb volley, offensive re-ranking must not
    // reverse the very last escape step. The faster player can exploit
    // that wasted 200ms turn to close the lane we were leaving.
    // Both candidates remain time-safe for *existing* bombs, but keeping
    // the outward trajectory is less vulnerable to one more planted bomb.
    if(bombs.filter(b=>b.owner==='player').length>=2 && enemyLastPosition &&
       p.x===enemyLastPosition.x && p.y===enemyLastPosition.y &&
       !(safeStep.x===p.x&&safeStep.y===p.y) &&
       d<originalDistance && nearestBlast<=2100) continue;
    if(nearOpponent && bombs.length>=2 && d<3 && d<originalDistance)continue;
    // v38: Attack-oriented re-ranking must not overrule a time-safe route
    // by running into the perimeter with a live player bomb. The opponent
    // can add a second bomb during our next turn and seal that lane.
    const playerBombActive=bombs.some(b=>b.owner==='player');
    const safeFreedom=getEnemyPositionRisk(safeStep.x,safeStep.y);
    const offensiveFreedom=getEnemyPositionRisk(p.x,p.y);
    if(playerBombActive && nearestBlast<=2100 && d<=7 &&
       offensiveFreedom.edgeDistance<safeFreedom.edgeDistance &&
       offensiveFreedom.edgeDistance===0) continue;
    const s=score(p);
    if(s>best.score+2.5)best={p,score:s};
  }
  if(best.p!==safeStep && best.score>oldScore+6) {
    void 0;
    return {x:best.p.x,y:best.p.y};
  }
  return safeStep;
}

// v16: 対人戦用の「後出し誘爆」評価。両陣営の既存爆弾を同一時間軸に置き、
// 新しい爆弾によって爆発する方向・時刻が本当に変わる候補のみ抽出する。
// 爆弾数を増やしただけの位置は候補にしない。人間の判断ミスを誘う補助得点であり、
// 実際の爆弾設置とAIの生存可否は evaluateEnemyBombSpot に委ねる。
function v16ChainProfile(x,y,baselineEvents=null) {
  if(!player.alive || bombs.length<1 || bombs.length>9 ||
     bombs.some(b=>b.x===x && b.y===y) ||
     Math.abs(x-player.x)+Math.abs(y-player.y)>6)return null;
  const baseline=baselineEvents||getTimedBombEvents();
  const trial={x,y,timer:2000,range:8,owner:'enemy'};
  const trialBlast=getBlastCells(trial);
  const trialEvents=getTimedBombEvents(trial);
  const detonate=trialEvents[trialEvents.length-1].time;
  // まず既存爆弾が、新しい爆弾を通常より早く爆発させることを証明する。
  // 直前過ぎる設置は危険。回避可能かを後段で確定する。
  if(detonate<480 || detonate>1220)return null;
  const anchors=[];
  for(let i=0;i<bombs.length;i++) {
    const b=bombs[i];
    if(Math.abs(trialEvents[i].time-detonate)>5 || baseline[i].time>detonate+5)continue;
    if(!getBlastCells(b).some(([a,c])=>a===x&&c===y))continue;
    anchors.push({owner:b.owner||'player',id:b.id??null,time:Math.round(detonate)});
  }
  if(!anchors.length)return null;
  const newArea=new Set(trialBlast.map(([a,b])=>`${a},${b}`));
  const originallyThreatened=new Set();
  for(let i=0;i<baseline.length;i++){
    // 同じ爆発の直前・直後に既存の爆風が覆う場所は新規牽制と評価しない。
    if(Math.abs(baseline[i].time-detonate)>350)continue;
    for(const [a,b] of baseline[i].cells)originallyThreatened.add(`${a},${b}`);
  }
  const newlyCovered=[...newArea].filter(q=>!originallyThreatened.has(q));
  const novel=new Set(newlyCovered);
  let local=0,aligned=0;
  for(const cell of getPlayerReachableCells(5)){
    if(!novel.has(`${cell.x},${cell.y}`))continue;
    if(cell.depth<=2)local+=2;
    else if(cell.depth<=4)local++;
    if(playerHeadingStreak>=2 &&
       (cell.x-player.x)*playerDirX+(cell.y-player.y)*playerDirY>0)aligned++;
  }
  const acceleratedHuman=bombs.filter((b,i)=>
    b.owner==='player' && baseline[i].time-trialEvents[i].time>=160).length;
  // 人間の逃走可能域への新規爆風か、敵爆弾の明確な早期誘爆が必要。
  if((local<2 && acceleratedHuman===0) || newlyCovered.length<2)return null;
  const blastPlayer=newArea.has(`${player.x},${player.y}`);
  const value=local*6 + Math.min(4,aligned)*3 + acceleratedHuman*17 +
    (blastPlayer?9:0) + anchors.some(a=>a.owner==='player')*7 -
    Math.max(0,750-detonate)*0.025;
  return {time:Math.round(detonate),anchors,novelCells:newlyCovered.length,
    reachablePressure:local,acceleratedHuman,value:Math.round(value*10)/10};
}

// 本当に合法な最終設置からだけ行う。通常攻撃が成り立たないときの
// 設置閾値緩和は安全確認・爆発時刻確認をバイパスしない。
function findV16HumanPressureBomb() {
  if(enemyBombCooldown>0 || !player.alive || bombs.length<1)return null;
  const baseline=getTimedBombEvents();
  const profile=v16ChainProfile(enemy.x,enemy.y,baseline);
  if(!profile || profile.value<12)return null;
  const trial={x:enemy.x,y:enemy.y,timer:2000,range:8,owner:'enemy'};
  const blast=getBlastCells(trial),options=getPlayerReachableCells(3);
  const offense=getEnemyOffenseOpportunity(trial,blast,options);
  const assessment=evaluateEnemyBombSpot(enemy.x,enemy.y,options,{
    offense,trialBlast:blast,
    layered:getEnemyLayeredAttackScore(trial,blast,options),
    counterTrap:getV64CounterTrapScore(trial,blast),
    denied:getV56EscapeDenial(trial,blast),v16Pressure:profile
  });
  if(!assessment || !assessment.v16Pressure)return null;
  // 危険な1本出口の奇襲は不採用。時間軸の出口が複数必要。
  if(assessment.robustExitCount<2 || assessment.trapRisk>12 ||
     assessment.v16Pressure.time<480)return null;
  return assessment;
}

// 爆発寸前の爆弾と接続できる一歩を探す。単なる足踏みより優先するが、
// 相手の追加設置を想定した袋小路チェックにも合格する場合だけ移動する。
function findV16PressureApproach(events) {
  if(enemyBombCooldown>0 || !player.alive || bombs.length<1 || bombs.length>7)return null;
  const candidates=[[0,-1],[0,1],[-1,0],[1,0]]
    .map(([dx,dy])=>({x:enemy.x+dx,y:enemy.y+dy}))
    .filter(p=>enemyCanMove(p.x,p.y,events,1))
    .map(p=>({...p,profile:v16ChainProfile(p.x,p.y,events)}))
    .filter(p=>p.profile && p.profile.value>=15)
    .sort((a,b)=>b.profile.value-a.profile.value);
  const oldGoal=enemyEscapeGoal;
  for(const p of candidates.slice(0,2)){
    const route=findTimedSafeStep(p.x,p.y,null,null,1,ENEMY_STEP_MS,events);
    enemyEscapeGoal=oldGoal;
    if(!route || !v16HumanCounterBombSafe(p))continue;
    // この手番で設置すると、既存の爆弾に巻き込まれる位置は検証で拒否。
    return {x:p.x,y:p.y,profile:p.profile};
  }
  return null;
}

// 接近先を人間の追加爆弾で塞がれた場合の保険。既存の爆弾からの
// 脱出に加え、人間が現在地で1発追加した場合の生存経路を確認する。
// この仮想爆弾は評価中にのみ存在し、ゲームの爆弾には追加されない。
function v16HumanCounterBombSafe(p) {
  const cacheKey=v17PressureCache ? `${p.x},${p.y}:${player.x},${player.y}:${v17BombFieldKey()}`:null;
  if(cacheKey!==null && v17PressureCache.has(cacheKey))return v17PressureCache.get(cacheKey);
  const distance=Math.abs(p.x-player.x)+Math.abs(p.y-player.y);
  if(distance>5 || bombs.length<1)return true;
  const posRisk=getEnemyPositionRisk(p.x,p.y);
  const corridor=getEnemyCorridorRisk(p.x,p.y);
  // 複数の人間爆弾の近くで出口が狭い場合は追跡補正を適用しない。
  const hostileCount=bombs.filter(b=>b.owner==='player').length;
  if(hostileCount>=2 && bombs.length>=3 && distance<=5 &&
     (posRisk.exits<=2 || corridor>=15))return false;
  if(posRisk.exits>=3 && corridor<16)return true;
  if(bombs.some(b=>b.x===player.x&&b.y===player.y))return true;
  const imagined={x:player.x,y:player.y,timer:2000,range:8,owner:'player'};
  const savedGoal=enemyEscapeGoal;
  const savedShadowCache=aiShadowRiskCache;
  let path=null;
  bombs.push(imagined);
  aiShadowRiskCache=null;
  try {path=findTimedSafeStep(p.x,p.y,null,null,1,ENEMY_STEP_MS);}
  finally {bombs.pop();enemyEscapeGoal=savedGoal;aiShadowRiskCache=savedShadowCache;}
  if(cacheKey!==null)v17PressureCache.set(cacheKey,!!path);
  return !!path;
}

// v69: Rare, deliberate last-second chain. The existing own bomb has only
// 0.62-1.12 seconds remaining; putting a second bomb on its blast line
// instantly synchronizes both explosions. This is useful ONLY when the new
// blast threatens player options outside the original blast. Sampling once
// per anchor prevents an apparently "rare" chance from becoming almost
// guaranteed after repeated 120ms ticks. The normal survival checker remains
// authoritative and the final selector requires two independent robust exits and a move.
// v18-LG: blast-reachable, deliberately late chain-reaction shot.
// A +200 attack preference is only considered when the EXISTING bomb can
// really ignite the newly planted one AND its blast newly seals a player
// escape square. No bonus may substitute for the full timed-survival proof.
// Three *committed* escape steps for a sub-560ms chain. The planted bomb's
// orthogonal cross generally requires moving sideways and then turning;
// stopping after the first step is fatal. Restrict the destination to a
// tile safe throughout the known flame horizon, not just on arrival.
function findV18GiriFastRoute(x,y,events,viableFirstSteps,allBombs) {
  const fullEnd=Math.max(0,...events.map(e=>e.time+BOMB_FLAME_MS),
    ...flames.map(f=>f.timer))+45;
  const candidates=[];
  const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
  const open=p=>p.x>=1&&p.y>=1&&p.x<COLS-1&&p.y<ROWS-1&&
    map[p.y][p.x]===0&&!(player.alive&&p.x===player.x&&p.y===player.y)&&
    !allBombs.some(b=>b.x===p.x&&b.y===p.y);
  for(const first of viableFirstSteps){
    if(Math.abs(first.x-x)+Math.abs(first.y-y)!==1 || !open(first) ||
       isTileDangerDuring(first.x,first.y,0,ENEMY_STEP_MS+45,events))continue;
    for(const [dx2,dy2] of dirs){
      const second={x:first.x+dx2,y:first.y+dy2};
      if(second.x===x&&second.y===y||!open(second)||
         isTileDangerDuring(second.x,second.y,
           ENEMY_STEP_MS-35,ENEMY_STEP_MS*2+45,events))continue;
      for(const [dx3,dy3] of dirs){
        const third={x:second.x+dx3,y:second.y+dy3};
        if(third.x===x&&third.y===y||!open(third)||
           isTileDangerDuring(third.x,third.y,
             ENEMY_STEP_MS*2-35,fullEnd,events))continue;
        candidates.push({first:{x:first.x,y:first.y},second,third,
          score:getEnemyPositionRisk(third.x,third.y,allBombs).score+
            getEnemyPositionRisk(first.x,first.y,allBombs).score*0.15});
      }
    }
  }
  candidates.sort((a,b)=>a.score-b.score);
  return candidates[0]||null;
}
function findV18LGiriOkiBomb(currentEvents, edgeRelayInfo = null) {
  if(!player.alive || enemyBombCooldown>0 || bombs.length<1 || bombs.length>5 ||
     bombs.some(b=>b.x===enemy.x&&b.y===enemy.y))return null;
  // LG4: Keep the true collision-aware blast map, but do not require a
  // *direct* hit to consider an endgame chain attack. Hard walls never
  // transmit flames; breaking a soft block helps only future attacks.
  if(enemy.x===player.x && enemy.y===player.y)return null;
  const proposed={x:enemy.x,y:enemy.y,timer:2000,range:8,owner:'enemy'};
  const blast=getBlastCells(proposed);
  const blastSet=new Set(blast.map(([x,y])=>y*COLS+x));
  const targetInBlast=blastSet.has(player.y*COLS+player.x);
  const edgeDepth=Math.min(player.x-1,COLS-2-player.x,
    player.y-1,ROWS-2-player.y);
  // An aligned target can be hidden by a hard or soft blocker. Unlike
  // raw Manhattan range, this is strictly limited to the bomb's 8 cells.
  const alignedDistance=player.x===enemy.x ? Math.abs(player.y-enemy.y) :
    player.y===enemy.y ? Math.abs(player.x-enemy.x) : Infinity;
  let blocker=null;
  if(!targetInBlast && alignedDistance<=8) {
    const dx=Math.sign(player.x-enemy.x),dy=Math.sign(player.y-enemy.y);
    for(let i=1;i<=alignedDistance;i++){
      const x=enemy.x+dx*i,y=enemy.y+dy*i;
      if(map[y][x]===1||map[y][x]===2){
        blocker={x,y,kind:map[y][x]===2?'soft':'hard'};
        break;
      }
    }
  }
  if(!targetInBlast && edgeDepth>2)return null;
  const existingCoverage=new Set();
  for(const ev of currentEvents){
    // Only fire that actually overlaps in time with the planned chain counts.
    if(ev.time<V18_GIRI_MIN_CHAIN_MS || ev.time>1100)continue;
    for(const [x,y] of ev.cells)existingCoverage.add(y*COLS+x);
  }
  const reachable=getPlayerReachableCells(2);
  let best=null;
  for(let i=0;i<bombs.length;i++){
    const anchor=bombs[i],evt=currentEvents[i];
    // An anchor may also be several tiles away: only actual blast contact
    // at the AI's square matters, not a fixed four-tile anchor radius.
    if(!evt || evt.time<V18_GIRI_MIN_CHAIN_MS || evt.time>1100 ||
       !evt.cells.some(([x,y])=>x===enemy.x&&y===enemy.y))continue;
    // The chain must cover the player now, or an immediately reachable
    // position, in addition to removing an escape that the old blast missed.
    let newExits=0,nearbyNew=0;
    for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){
      const x=player.x+dx,y=player.y+dy;
      if(x<=0||y<=0||x>=COLS-1||y>=ROWS-1||map[y][x]!==0 ||
         bombs.some(b=>b.x===x&&b.y===y))continue;
      const id=y*COLS+x;
      if(blastSet.has(id)&&!existingCoverage.has(id))newExits++;
    }
    for(const p of reachable)if(p.depth<=1 &&
       blastSet.has(p.y*COLS+p.x)&&!existingCoverage.has(p.y*COLS+p.x))nearbyNew++;
    // Direct finishers keep LG3's requirement for genuinely new exits.
    // Blocked endgame shots may be useful as a side-lane cut or as a soft
    // block breaker. On the outermost edge, an aligned hard-wall shot is
    // intentionally permitted as an aggressive *experiment*, despite not
    // directly reaching the player; never bypass the escape simulation.
    const blockedEdge=!targetInBlast && edgeDepth<=2 && (
      newExits>=1 || nearbyNew>=1 ||
      !!blocker);
    if(targetInBlast ? (newExits<1||nearbyNew<1) : !blockedEdge)continue;
    // Verify actual chain detonation including OTHER bombs and chain links.
    const timeline=getTimedBombEvents(proposed);
    const time=timeline[timeline.length-1].time;
    if(Math.abs(time-evt.time)>5 || time<V18_GIRI_MIN_CHAIN_MS || time>1100)continue;
    const score=(targetInBlast?300:170)+newExits*22+nearbyNew*5+
      (targetInBlast?25:0)+(blocker?.kind==='soft'?24:0);
    if(!best||score>best.score)best={score,newExits,nearbyNew,
      blockedEdge,targetInBlast,alignedDistance:Number.isFinite(alignedDistance)?alignedDistance:null,
      blocker,edgeDepth,anchorId:anchor.id,
      chainMs:Math.round(time),anchorOwner:anchor.owner||'player'};
  }
  if(!best)return null;
  const options=getPlayerReachableCells(3);
  const offense=getEnemyOffenseOpportunity(proposed,blast,options);
  // In the cornered/blocked exception, it is possible to have zero
  // immediate pressure. This is an intentional aggressive setup shot,
  // NOT a claim that its flames will reach through an unbreakable wall.
  if(!best.blockedEdge && (offense.pressure<3 ||
     (!offense.hitNow && offense.threatenedExits===0 && offense.leadHits<1)))return null;
  const evaluation=evaluateEnemyBombSpot(enemy.x,enemy.y,options,{
    v18LGiri:best,v18EdgeRelay:edgeRelayInfo,trialBlast:blast,offense,
    layered:getEnemyLayeredAttackScore(proposed,blast,options),
    denied:getV56EscapeDenial(proposed,blast),
    counterTrap:getV64CounterTrapScore(proposed,blast)
  });
  if(!evaluation?.v18LGiri)return null;
  const escape=evaluation.giriEscape;
  if(!escape || (escape.x===enemy.x&&escape.y===enemy.y) ||
     Math.abs(escape.x-enemy.x)+Math.abs(escape.y-enemy.y)!==1)return null;
  return evaluation;
}

function findV69LateSurpriseBomb() {
  if(!player.alive || enemyBombCooldown>0 || bombs.length!==1 ||
     bombs[0].owner!=='enemy' || matchClock-lastV69SurpriseAt<17000)
    return null;
  const anchor=bombs[0];
  if(anchor.timer<760 || anchor.timer>1050 ||
     (anchor.x===enemy.x&&anchor.y===enemy.y)) return null;
  const dist=Math.abs(enemy.x-player.x)+Math.abs(enemy.y-player.y);
  if(dist<2 || dist>5) return null;
  const originBlast=getBlastCells(anchor);
  if(!originBlast.some(([x,y])=>x===enemy.x&&y===enemy.y))return null;
  const trial={x:enemy.x,y:enemy.y,timer:2000,range:8,owner:'enemy'};
  const expandedBlast=getBlastCells(trial);
  const original=new Set(originBlast.map(([x,y])=>`${x},${y}`));
  const added=new Set(expandedBlast.map(([x,y])=>`${x},${y}`)
    .filter(k=>!original.has(k)));
  const options=getPlayerReachableCells(3);
  const covered=options.filter(p=>p.depth<=2 && added.has(`${p.x},${p.y}`));
  if(covered.length<2 || !covered.some(p=>p.depth<=1))return null;
  const offense=getEnemyOffenseOpportunity(trial,expandedBlast,options);
  if(offense.pressure<6 || (!offense.hitNow && offense.threatenedExits<1 &&
     offense.leadHits<2))return null;
  // Only draw once for each anchor: do not let repeated ticks make it likely.
  const key=anchor.id ?? anchor;
  if(!v69SurpriseRolls.has(key))v69SurpriseRolls.set(key,Math.random()<0.20);
  if(!v69SurpriseRolls.get(key))return null;
  const evaluation=evaluateEnemyBombSpot(enemy.x,enemy.y,options,{
    v69LateSurprise:true,offense,trialBlast:expandedBlast,
    layered:getEnemyLayeredAttackScore(trial,expandedBlast,options),
    counterTrap:getV64CounterTrapScore(trial,expandedBlast),
    denied:getV56EscapeDenial(trial,expandedBlast)
  });
  // Validate actual chain timing; the extra bomb must REALLY explode with
  // the anchor. Never reinterpret this check as approval to drop into fire.
  if(!evaluation || !evaluation.v69LateSurprise)return null;
  const events=getTimedBombEvents(evaluation.proposedBomb);
  if(Math.abs(events[events.length-1].time-events[0].time)>5)return null;
  return evaluation;
}

// 新しく置く爆弾が既存の爆弾に誘爆される可能性と、
// 設置手番を消費する200msを加味した「安全な反撃」判定。
// v74: Continue an actual two-sided attack from the CURRENT square when
// our live first bomb creates an offset opportunity. The candidate must pass
// exactly the same placement test as all other attacks; no suicidal shortcut.
function findV74VerifiedFollowup(events) {
  if(enemyBombCooldown>0 || bombs.some(b=>b.x===enemy.x&&b.y===enemy.y))return null;
  const friends=bombs.filter(b=>b.owner==='enemy');
  if(friends.length<1 || friends.length>2 ||
     !friends.some(b=>b.timer>=1050) ||
     bombs.filter(b=>b.owner==='player').length>2)return null;
  const distance=Math.abs(enemy.x-player.x)+Math.abs(enemy.y-player.y);
  if(distance<2||distance>5)return null;
  if(isTileDangerDuring(enemy.x,enemy.y,0,ENEMY_STEP_MS*2+45,events))return null;
  const proposed={x:enemy.x,y:enemy.y,timer:2000,range:8,owner:'enemy'};
  const blast=getBlastCells(proposed),options=getPlayerReachableCells(3);
  const off=getEnemyOffenseOpportunity(proposed,blast,options);
  const novel=v74AttackValue(enemy.x,enemy.y,off,blast,options);
  if(novel.novel<1 || novel.blocked<1)return null;
  const evaluated=evaluateEnemyBombSpot(enemy.x,enemy.y,options,{
    offense:off,trialBlast:blast,
    layered:getEnemyLayeredAttackScore(proposed,blast,options),
    denied:getV56EscapeDenial(proposed,blast),
    counterTrap:getV64CounterTrapScore(proposed,blast)});
  if(!evaluated || !evaluated.v74OffsetVolley ||
     evaluated.robustExitCount<2 || evaluated.trapRisk>11)return null;
  return evaluated;
}

function findEnemyCounterBomb(currentEvents) {
  if(enemyBombCooldown>0 || matchClock-lastEnemyCounterBombAt<650) return null;
  if(bombs.filter(b=>b.owner==='enemy').length>=5) return null;
  const distance=Math.abs(enemy.x-player.x)+Math.abs(enemy.y-player.y);
  if(distance>6 || distance===0 || bombs.some(b=>b.x===enemy.x&&b.y===enemy.y))return null;
  const dangerSoon=currentEvents.some(e=>e.time<=620 &&
    e.cells.some(([x,y])=>x===enemy.x&&y===enemy.y));
  if(dangerSoon)return null;
  const proposed={x:enemy.x,y:enemy.y,timer:2000,range:8,owner:'enemy'};
  const blast=getBlastCells(proposed);
  const options=getPlayerReachableCells(3);
  const offense=getEnemyOffenseOpportunity(proposed,blast,options);
  // 回避中に手番を消費するので、真正面でプレイヤーの移動・退路を
  // 制約できるときだけ反撃する。むやみな爆弾連打を防ぐ。
  // 直撃レーンか、進行先+複数出口を塞ぐ攻撃を候補にする。
  // v16は「その瞬間の直撃」に限定して好機を逃していた。
  const layeredAttack=getEnemyLayeredAttackScore(proposed,blast,options);
  const counterTrap=getV64CounterTrapScore(proposed,blast);
  const supportedCounter=counterTrap>=13/AI_ATTACK_TUNING.counter && offense.pressure>=3;
  const supportedLaneCut=offense.laneCut>=9/AI_ATTACK_TUNING.laneCut && offense.leadHits>=2 && offense.pressure>=4;
  // Counter while escaping only if the predicted corridor is strongly
  // covered, the opponent's volley is not dense, and full safety passes.
  const supportedInterdiction=isV68Interdiction(offense) &&
    offense.interdiction>=16 && offense.pressure>=5 &&
    bombs.filter(b=>b.owner==='player').length<=1;
  const v72CounterShot=offense.hitNow && offense.pressure>=9 &&
    offense.threatenedExits>=1 && distance<=5 &&
    bombs.filter(b=>b.owner==='player').length<=5;
  const v74AssaultCounter=offense.hitNow && offense.pressure>=8 &&
    offense.threatenedExits>=1 && distance<=5 &&
    bombs.filter(b=>b.owner==='player').length<=5;
  const v71StrongCounter=offense.hitNow && offense.pressure>=11 &&
    offense.threatenedExits>=2 &&
    bombs.filter(b=>b.owner==='player').length<=4;
  if (!(offense.hitNow && offense.score>=23) &&
      !(offense.threatenedExits>=2 && offense.leadHits>=2 && offense.score>=23) &&
      !(layeredAttack>=13 && offense.score>=12 && offense.threatenedExits>=1) &&
      !supportedCounter && !supportedLaneCut && !supportedInterdiction &&
      !v71StrongCounter && !v72CounterShot && !v74AssaultCounter) return null;
  // v20: 相手の爆弾が複数置かれた混戦では、追撃に200msを使う代わりに
  // 安全な空間を確保する。高得点の反撃は引き続き許可する。
  const playerBombCount=bombs.filter(b=>b.owner!=='enemy').length;
  if(playerBombCount>=2 && bombs.length>=3 && offense.score<30 &&
     layeredAttack<18 && !supportedCounter && !supportedLaneCut &&
     !v71StrongCounter && !v72CounterShot) return null;
  const evalBomb=evaluateEnemyBombSpot(enemy.x,enemy.y,options,{
    offense,layered:layeredAttack,counterTrap,trialBlast:blast,
    denied:getV56EscapeDenial(proposed,blast),
    v72CounterShot
  });
  if(!evalBomb || evalBomb.robustExitCount<2) return null;
  if((v71StrongCounter && playerBombCount>=2) || v72CounterShot) {
    if(evalBomb.robustExitCount<3 || evalBomb.trapRisk>11)return null;
  }
  if(v74AssaultCounter && playerBombCount>=2 &&
     (evalBomb.trapRisk>12 || evalBomb.robustExitCount<2))return null;
  // 初手が待機の場合でも、他に2方向の生存経路があり、
  // プレイヤーに入口を封鎖されるリスクが低い場合だけ許可。
  const firstIsWait=evalBomb.escape.x===enemy.x && evalBomb.escape.y===enemy.y;
  // A timed planner can choose a brief wait despite two independent escape
  // routes. Permit this only if the opponent is in the bomb's blast lane,
  // a safe exit can be taken later, and no explosion is imminent.
  const events=getTimedBombEvents(proposed);
  const nearestExplode=Math.min(Infinity,...events.map(e=>e.time));
  const effectiveOffense=offense.score+Math.min(18,layeredAttack*0.85)+
    Math.min(10,counterTrap*0.55)+Math.min(8,offense.laneCut*0.65);
  if(firstIsWait && !(distance>=2 && evalBomb.robustExitCount>=2 &&
      evalBomb.exits>=2 && effectiveOffense>=28 && nearestExplode>=1300 &&
      (layeredAttack<13 || evalBomb.trapRisk<=10) &&
      !isTileDangerDuring(enemy.x,enemy.y,0,ENEMY_STEP_MS*2+55,events)))
    return null;
  if(isTileDangerDuring(enemy.x,enemy.y,0,ENEMY_STEP_MS+50,events))return null;
  return {evaluation:evalBomb,offense};
}

// 攻撃地点を探す。単にプレイヤーへ近づくのではなく、
// 爆風が届くこと・自分が逃げられること・プレイヤーの逃げ道を減らせることを評価する。
function findBestTacticalAttackStep() {
  const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
  const predictedEvents = getTimedBombEvents();
  const queue = [{x:enemy.x,y:enemy.y,first:null,distance:0}];
  const visited = new Set([`${enemy.x},${enemy.y}`]);
  const options = getPlayerReachableCells(3);
  const prospects=[];
  // These anchor-state flags do not change during the BFS; calculate once.
  const freshAnchor=bombs.some(b=>b.owner==='enemy' && b.timer>=1350);
  const v14ThirdProspect=bombs.filter(b=>b.owner==='enemy').length>=2;
  const hostilePresent=bombs.some(b=>b.owner==='player');
  const counterContext=hostilePresent ? makeV64CounterContext() : null;
  let head=0;
  while (head < queue.length) {
    const spot = queue[head++];
    if (spot.distance > 18) continue;
    const pdist = Math.abs(spot.x-player.x)+Math.abs(spot.y-player.y);
    // 安全経路の詳細探索は高コストなので、安価な条件で候補を絞る。
    if (pdist<=6 && enemyEscapeMobility(spot.x,spot.y)>=3) {
      const trial={x:spot.x,y:spot.y,range:8};
      // v63: One shared blast per candidate; the old planner rebuilt multiple
      // cell collections (including an expensive volley scan) before it even
      // knew whether the tile qualified as an attack opportunity.
      const trialBlast=getBlastCells(trial);
      const offense=getEnemyOffenseOpportunity(trial,trialBlast,options);
      const layered=getEnemyLayeredAttackScore(trial,trialBlast,options);
      const v18LCombo=getV18LFormationScore(trial,trialBlast,options);
      const counterTrap=counterContext ?
        getV64CounterTrapScore(trial,trialBlast,counterContext) : 0;
      if(v18LCombo.score>=15 || offense.pressure>=5/AI_ATTACK_TUNING.aggression ||
         (offense.threatenedExits>=2 && offense.pressure>=3) ||
         (offense.leadHits>=3 && offense.leadExitPressure>=2 && offense.pressure>=3) ||
         (layered>=12 && offense.pressure>=3) ||
         (counterTrap>=13/AI_ATTACK_TUNING.counter && offense.pressure>=3) ||
         (offense.laneCut>=9/AI_ATTACK_TUNING.laneCut && offense.leadHits>=2 && offense.pressure>=3 && spot.distance<=5) ||
         (isV68Interdiction(offense) && spot.distance<=6 && !hostilePresent) ||
         (v14ThirdProspect && (offense.pressure>=3 ||
           offense.threatenedExits>=1 || offense.leadHits>=2 || layered>=7))) {
        const denied=getV56EscapeDenial(trial,trialBlast);
        const setup=getV61VolleySetupPotential(trial,trialBlast,options);
        const v18LOpener=getV18LOpenerPotential(trial,trialBlast,options);
        // v63: The old 75-second gate made the human-inspired follow-up
        // priority completely inactive in 30-second training matches. Rank
        // offset shots while a fresh anchor is still live, rather than
        // waiting until the attack window has closed. Exact bomb placement
        // and survival checks remain unchanged and authoritative.
        const anchorBonus=freshAnchor && !hostilePresent && layered>=12 ?
          layered*2.8 : 0;
        const priority=offense.pressure*4.2*AI_ATTACK_TUNING.pressure+
          offense.score*4+offense.leadHits*3*AI_ATTACK_TUNING.lead+
          layered*3.6*AI_ATTACK_TUNING.layered+anchorBonus+denied.score*3.0+
          setup*3.0+counterTrap*2.4*AI_ATTACK_TUNING.counter+
          offense.laneCut*5.0*AI_ATTACK_TUNING.laneCut+
          offense.interdiction*3.4+v18LCombo.score*7.2+
          v18LOpener*3.8-spot.distance*4.2;
        prospects.push({...spot,priority,offense,layered,denied,setup,counterTrap,
          v18LCombo,trialBlast});
      }
    }
    for (const [dx,dy] of dirs) {
      const x=spot.x+dx,y=spot.y+dy,key=`${x},${y}`;
      if (visited.has(key)||!enemyCanMove(x,y,predictedEvents,spot.distance+1)) continue;
      visited.add(key);
      queue.push({x,y,first:spot.first||{x,y},distance:spot.distance+1});
    }
  }
  prospects.sort((a,b)=>b.priority-a.priority);
  let best=null;
  for (const spot of prospects.slice(0,v14ThirdProspect?26:17)) {
    const ev=evaluateEnemyBombSpot(spot.x,spot.y,options,spot);
    if (!ev) continue;
    // 外周攻撃は確実な圧力がある場合に許すが、同等の攻撃なら退路の広い地点を選ぶ。
    const siteRisk=getEnemyPositionRisk(spot.x,spot.y).score;
    const score=spot.priority+ev.exits*2-siteRisk*1.4 - ev.trapRisk*1.2 +
      (ev.layeredAttack||0)*0.6+(ev.v56Denial?.score||0)*0.8+
      (ev.v18LCombo?.score||0)*1.0;
    if (!best||score>best.score) best={first:spot.first,score};
    // 高得点の実行可能な攻撃候補を見つけたら、無駄な探索は打ち切る。
    if (spot.priority < best.score-25) break;
  }
  return best&&best.first ? best.first : null;
}

// v55: Intercept a player walking down a corridor instead of chasing the
// tile they occupied two turns ago. Only active on a clear board: with live
// bombs the existing time-expanded planner takes priority. This is a
// POSITIONING move, not an unsafe new bomb-placement shortcut.
function findEnemyInterceptStep(currentAttackStep=null) {
  if (!v63PressurePhase() || bombs.length || !player.alive ||
      !(playerDirX||playerDirY)) return null;
  const distance=Math.abs(enemy.x-player.x)+Math.abs(enemy.y-player.y);
  if(distance<5||distance>11)return null;
  let target={x:player.x,y:player.y};
  let forward=0;
  for(let i=0;i<3;i++) {
    const x=target.x+playerDirX,y=target.y+playerDirY;
    if(x<1||y<1||x>=COLS-1||y>=ROWS-1 || map[y][x]!==0)break;
    target={x,y};forward++;
  }
  if(forward<2)return null;
  const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
  // True shortest-path distance on the pillar map; Manhattan can pick the
  // wrong side of a corridor when walls intervene.
  const queue=[{...target,depth:0}],seen=new Set([`${target.x},${target.y}`]);
  const cost=new Map([[`${target.x},${target.y}`,0]]);
  for(let h=0;h<queue.length;h++){
    const a=queue[h];
    for(const [dx,dy] of dirs){
      const x=a.x+dx,y=a.y+dy,k=`${x},${y}`;
      if(x<1||y<1||x>=COLS-1||y>=ROWS-1||map[y][x]!==0||seen.has(k))continue;
      seen.add(k);cost.set(k,a.depth+1);queue.push({x,y,depth:a.depth+1});
    }
  }
  const where=p=>cost.get(`${p.x},${p.y}`)??100;
  const candidate=dirs.map(([dx,dy])=>({x:enemy.x+dx,y:enemy.y+dy}))
    .filter(p=>enemyCanMove(p.x,p.y,null,1))
    .filter(p=>getEnemyPositionRisk(p.x,p.y).exits>=2)
    .sort((a,b)=>where(a)-where(b) ||
      getEnemyPositionRisk(a.x,a.y).score-getEnemyPositionRisk(b.x,b.y).score)[0];
  if(!candidate || where(candidate)>=where(enemy))return null;
  // Do not discard an existing high-quality tactical attack route for a
  // one-step intercept that has negligible advantage.
  if(currentAttackStep && where(candidate)+1>=where(currentAttackStep))return null;
  // Require an interception to improve projected lane control, not just distance
  // to the opponent's extrapolated position. This reduces aimless pursuits.
  if(currentAttackStep && matchClock>=V55_STALEMATE_MS){
    const proposed={...candidate,range:8,timer:2000};
    const attack={...currentAttackStep,range:8,timer:2000};
    if(getV56EscapeDenial(proposed).score + 2 < getV56EscapeDenial(attack).score)
      return null;
  }
  if(getEnemyPositionRisk(candidate.x,candidate.y).score>
     getEnemyPositionRisk(enemy.x,enemy.y).score+3)return null;
  return candidate;
}

// v11: 攻撃地点が見つからないときにも、敵を追跡して位置取りを続ける。
// 爆弾の射程に入っただけで停止しない。前のマスへの往復にもペナルティ。
function findApproachStep() {
  const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
  const predictedEvents=getTimedBombEvents();
  const queue=[{x:enemy.x,y:enemy.y,first:null,depth:0}];
  const visited=new Set([`${enemy.x},${enemy.y}`]);
  let head=0,best=null;
  while(head<queue.length) {
    const cur=queue[head++];
    if(cur.depth>0) {
      const distance=Math.abs(cur.x-player.x)+Math.abs(cur.y-player.y);
      const backtrack=enemyLastPosition && cur.depth===1 &&
        cur.x===enemyLastPosition.x && cur.y===enemyLastPosition.y;
      const sameLane=(cur.x===player.x||cur.y===player.y);
      const nearby=dirs.filter(([dx,dy])=>{
        const x=cur.x+dx,y=cur.y+dy;
        return x>=0&&y>=0&&x<COLS&&y<ROWS&&map[y][x]===0 &&
          !bombs.some(b=>b.x===x&&b.y===y);
      }).length;
      const positionRisk=getEnemyPositionRisk(cur.x,cur.y).score;
      // 追跡は続けつつ、同程度の距離なら外周より逃走余地のある位置を選ぶ。
      // v14: 爆弾が残るときにプレイヤーから1～2マスまで接近して
      // 新しい爆弾で出口を塞がれる事態を軽く抑止する。
      const proximityCost=bombs.length>0 ? Math.max(0,4-distance)*0.9 : 0;
      const score=distance + cur.depth*0.16 + (backtrack?2:0) +
        (sameLane?0.3:0) + (nearby<=1?2:nearby===2?0.3:0) +
        positionRisk*0.22 + proximityCost;
      if (!best||score<best.score) best={first:cur.first,score};
    }
    if(cur.depth>=12) continue;
    for(const [dx,dy] of dirs){
      const x=cur.x+dx,y=cur.y+dy,key=`${x},${y}`;
      if(visited.has(key)||!enemyCanMove(x,y,predictedEvents,cur.depth+1)) continue;
      visited.add(key);
      queue.push({x,y,first:cur.first||{x,y},depth:cur.depth+1});
    }
  }
  return best?best.first:null;
}

// v14: 「いつか爆風が届く」だけでは通路を完全封鎖しない。
// 実際にこのマスへ到着してから次の移動までの200msだけ危険を判定する。
// 攻撃・接近BFSでは探索深度を渡し、将来の爆発時刻も確認する。
function enemyCanMove(x, y, predictedEvents = null, stepIndex = 1) {
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return false;
  if (map[y][x] !== 0) return false;
  if (bombs.some(b => b.x === x && b.y === y)) return false;
  if (player.alive && player.x === x && player.y === y) return false;
  const events = predictedEvents || getTimedBombEvents();
  const arrival = Math.max(0, (stepIndex - 1) * ENEMY_STEP_MS - 35);
  const departure = stepIndex * ENEMY_STEP_MS + 35;
  return !isTileDangerDuring(x, y, arrival, departure, events);
}

// v18: A pursuit override cannot deliberately reverse into the exact square
// just evacuated, or worsen an outer-wall/choke trap under a live human volley.
// Cheap static check before any expensive path search; emergency escape can
// still choose any full-horizon-survivable first action.
function v18PursuitAllowed(here,p) {
  const hostile=bombs.filter(b=>b.owner==='player').length;
  if(!hostile || bombs.length<2) return true;
  const d=Math.abs(here.x-player.x)+Math.abs(here.y-player.y);
  if(d>9) return true;
  if(v18StrategicSafety &&
     v18StrategicSafety.origin.x===here.x &&
     v18StrategicSafety.origin.y===here.y &&
     v18StrategicSafety.bombKey===v17BombFieldKey() &&
     v18StrategicSafety.viable.length===1 &&
     !v18StrategicSafety.viable.some(q=>q.x===p.x&&q.y===p.y))return false;
  if(v18RetreatMemory && matchClock<v18RetreatMemory.until &&
     p.x===v18RetreatMemory.from.x && p.y===v18RetreatMemory.from.y &&
     here.x===v18RetreatMemory.to.x && here.y===v18RetreatMemory.to.y)
     return false;
  const current=getEnemyPositionRisk(here.x,here.y);
  const future=getEnemyPositionRisk(p.x,p.y);
  if(hostile>=2 && bombs.length>=3 && d<=7 &&
     future.edgeDistance===0 && current.edgeDistance>0)return false;
  if(hostile>=2 && bombs.length>=3 && d<=6 &&
     future.exits<=2 && current.exits>=3)return false;
  // The human can move one or two tiles before another AI decision and
  // connect a fresh bomb to an ALREADY imminent flame. This inexpensive
  // counter-chain check is only for optional pursuit overrides into a
  // corridor; it does not re-run the expensive timed-path BFS.
  if(d<=7 && future.exits<=3){
    const imminent=getTimedBombEvents().filter(e=>
      e.time>=PLAYER_MOVE_INTERVAL && e.time<=900);
    if(imminent.length){
      const exits=[[0,-1],[0,1],[-1,0],[1,0]].map(([dx,dy])=>
        ({x:p.x+dx,y:p.y+dy})).filter(q=>
        q.x>0&&q.y>0&&q.x<COLS-1&&q.y<ROWS-1&&
        map[q.y][q.x]===0 && !bombs.some(b=>b.x===q.x&&b.y===q.y));
      for(const plant of getPlayerReachableCells(2)){
        if(bombs.some(b=>b.x===plant.x&&b.y===plant.y))continue;
        const arrives=plant.depth*PLAYER_MOVE_INTERVAL;
        if(!imminent.some(e=>e.time>=arrives+60 &&
           e.cells.some(([x,y])=>x===plant.x&&y===plant.y)))continue;
        const blast=v17BlastSet(plant.x,plant.y);
        if(!blast.has(`${p.x},${p.y}`))continue;
        if(exits.length<=2 && exits.every(q=>blast.has(`${q.x},${q.y}`)))
          return false;
      }
    }
  }
  return true;
}

// v15: 非緊急時も「次の爆弾で退路を失う」マスを避ける。
// 従来の攻撃経路の一歩を基本とし、危険度が顕著に異なるときだけ変更する。
function chooseEnemyStrategicStep(proposed) {
  const here={x:enemy.x,y:enemy.y};
  const playerDistance=Math.abs(here.x-player.x)+Math.abs(here.y-player.y);
  if (bombs.length===0 && playerDistance>5) return proposed;
  const events=getTimedBombEvents();
  const options=getPlayerReachableCells(2);
  const candidates=[[0,-1],[0,1],[-1,0],[1,0],[0,0]]
    .map(([dx,dy])=>({x:here.x+dx,y:here.y+dy}))
    .filter(p=> p.x>=0&&p.y>=0&&p.x<COLS&&p.y<ROWS&&map[p.y][p.x]===0)
    .filter(p=>!(player.alive&&player.x===p.x&&player.y===p.y))
    .filter(p=>!(p.x!==here.x||p.y!==here.y)||!bombs.some(b=>b.x===p.x&&b.y===p.y))
    .filter(p=>!isTileDangerDuring(p.x,p.y,0,ENEMY_STEP_MS+35,events));
  // v37: trap estimates are intentionally conservative against new bombs.
  // When there are NO bombs and the opponent is waiting at the start,
  // those speculative penalties must not overrule a legitimate pursuit
  // step and force us to idle at the diagonal offset (3,3).
  // Keep the existing tactical and bomb-safety checks for every other case.
  if(bombs.length===0 && proposed &&
     (proposed.x!==here.x || proposed.y!==here.y) &&
     candidates.some(p=>p.x===proposed.x && p.y===proposed.y) &&
     !flames.some(f=>f.cells.some(([x,y])=>x===proposed.x&&y===proposed.y))) {
    return {x:proposed.x,y:proposed.y};
  }
  let best=null;
  const debug=[];
  for (const c of candidates) {
    const posRisk=getEnemyPositionRisk(c.x,c.y);
    const trapRisk=getEnemyPlayerTrapRisk(c.x,c.y,bombs,options);
    const corridorRisk=getEnemyCorridorRisk(c.x,c.y);
    const d=Math.abs(c.x-player.x)+Math.abs(c.y-player.y);
    const isProposed=!!proposed&&proposed.x===c.x&&proposed.y===c.y;
    const wait=c.x===here.x&&c.y===here.y;
    const repeat=enemyLastPosition&&c.x===enemyLastPosition.x&&c.y===enemyLastPosition.y;
    // v35: The opponent can lay another 8-tile bomb during our 200ms
    // strategic turn. Re-entering the square just escaped is especially
    // dangerous when multiple fuses are running: the first blast may force
    // us back down that very lane while the second closes the exit.
    // Penalize only elective strategic reversals, never timed escape steps.
    const delayedRetreat=repeat&&bombs.length>=2&&playerDistance<=8&&
      d<=playerDistance && bombs.some(b=>b.owner==='player');
    const repeatPenalty=delayedRetreat ?
      (d<=5?39:28) : repeat?2.5:0;
    // プレイヤーが近いほど（既存爆弾があれば特に）不安定な位置取りを避ける。
    // v19: 爆弾が残っている間にプレイヤーへ1～2歩まで寄ると、
    // すぐ隣に置かれた爆弾で一本道を塞がれる。接近するなら広い通路へ。
    const exposure=bombs.length>0 && d<=3 ? (4-d)*3.5 : 0;
    const futureBombExposure=bombs.length>=2 && playerDistance<=8 ?
      getEnemyPlayerTrapRisk(c.x,c.y,bombs,options)*0.45 : 0;
    const stalledNearBoundary=wait && bombs.length>0 && playerDistance<=8 &&
      getEnemyPositionRisk(here.x,here.y).edgeDistance===0;
    // 爆弾がある間、相手が接近中なのに立ち止まると次の爆弾で出口を
    // 塞がれる。待機が唯一の安全策なら他候補の即時危険判定が残る。
    const approachingPlayer=bombs.length>0 && playerDistance<=6;
    const waitCost=wait ? (stalledNearBoundary ? 22 : 4) +
      (approachingPlayer ? 15 : 0) +
      (bombs.length>=2 && approachingPlayer &&
       bombs.some(b=>b.owner==='player') ? 13 : 0) : 0;
    // v26: 現在地が危険でない局面でも、「次の一手で爆発予定の列へ入る」
    // とその次に相手に封鎖される。今の200msだけでなく800ms先を評価する。
    let upcoming=Infinity;
    for(const event of events) if(event.cells.some(([bx,by])=>bx===c.x&&by===c.y))
      upcoming=Math.min(upcoming,event.time);
    // v31: An unthreatened strategic step can still walk back onto a bomb
    // lane with only 1-1.6 seconds left. The player can then stagger another
    // bomb while we burn 200ms escaping the old one. Prefer a lateral exit.
    const onFutureBlast=upcoming<Infinity;
    const hereUpcoming=events.some(e=>e.time<=1700 &&
      e.cells.some(([bx,by])=>bx===here.x&&by===here.y));
    const fuseLanePenalty=upcoming<=1650 ?
      (upcoming<=420?55:upcoming<=700?46:upcoming<=1000?37:
       (bombs.length>=2 && playerDistance<=8 && !hereUpcoming ? 39:24)) : 0;
    // v33: when the player is laying delayed bombs, do not idle on an
    // outer-wall lane just because the next 200ms are safe. With 8-tile
    // blasts, a wall-side two-way corridor can be closed from the inside.
    // This is a soft scoring rule: timed survival checks still take priority.
    const wallStaggerPenalty=bombs.length>=2 && playerDistance<=8 &&
      bombs.some(b=>b.owner==='player') && posRisk.edgeDistance===0 ?
      (d<=5?42:25) : 0;
    // v38: Even ONE newly placed player bomb can force an opponent to
    // reverse direction at the end of a wall corridor. If an interior
    // alternative exists, do not enter the outside lane just to pursue.
